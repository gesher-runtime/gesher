name: Installed guest resource policy component
on:
  push:
    branches: [wip/binder-isolated-spawn, wip/binder-gather-repair, wip/binder-lowbox-nul-fix, wip/binder-property-diagnosis]
    paths: ['tests/windows/installed-guest-policy-*', 'compat/framework/installed_guest.h', 'compat/posix/src/startup_null.h', '.github/workflows/installed-guest-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: installed-guest-policy-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify pinned llvm-mingw archive
        run: |
          set -euo pipefail
          mkdir -p ~/toolchain
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW_NAME.tar.xz -o toolchain.tar.xz
          echo '5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4  toolchain.tar.xz' | sha256sum -c -
          tar -xJf toolchain.tar.xz -C ~/toolchain
      - name: Compile actual fixture and bind compiler receipt
        run: python3 tests/windows/installed-guest-policy-receipt.py build
      - uses: actions/upload-artifact@v4
        with:
          name: guest-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: guest-policy-artifact/
          if-no-files-found: error
  probe:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current-run producer archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/artifact_receipt.py --name "guest-policy-$env:GITHUB_SHA-$env:GITHUB_RUN_ATTEMPT" --producer build --destination guest-policy-artifact
          if ($LASTEXITCODE -ne 0) { throw 'strict archive receipt failed' }
          python tests/windows/installed-guest-policy-receipt.py verify
          if ($LASTEXITCODE -ne 0) { throw 'source/compiler/executable receipt failed' }
      - name: Exercise real pinned resource, reparse and retirement controls
        shell: pwsh
        env:
          GESHER_CI_PROCESS_TRACE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          . "$pwd/tests/windows/helpers/CloseProcessReaders.ps1"
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile("$pwd/tests/windows/tracks/50-services.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw $errors[0] }
          $definitions = @($ast.FindAll({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] }, $false) | Where-Object Name -eq 'RunTimed')
          if ($definitions.Count -ne 1) { throw 'qualified supervisor missing or ambiguous' }
          . ([scriptblock]::Create($definitions[0].Extent.Text))
          $directory = Join-Path $pwd 'policy-owned-fixture'
          New-Item -ItemType Directory $directory | Out-Null
          $output = RunTimed (Resolve-Path guest-policy-artifact/installed-guest-policy-fixture.exe).Path @($directory) 90
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { throw "resource policy fixture failed: $code" }
          foreach ($row in @('POLICY_REPARSE subtree_rejected=1 outside_unchanged=1 owners=0',
              'POLICY_RUNTIME_NESTED actual_gather=1 nested_directory=1 nested_file=1',
              'POLICY_PROPERTY_READONLY_PROTECT writable=',
              'POLICY_PROPERTY_READONLY_ALL duplicate=',
              'POLICY_PROPERTY_READONLY_SECTION read_magic=1 duplicate_write=',
              'POLICY_PROPERTY_SECTION read_magic=1 duplicate_write=',
              'POLICY_PROPERTY_GUEST_HOLD host_blocked=1',
              'POLICY_PROPERTY_SESSION_SPLIT host_value_visible=0',
              'POLICY_PROPERTY_MUTEX_DUP requested_all_access=1',
              'POLICY_PROPERTY_MUTEX guest_blocked_while_host_held=1 inherited_limited=1',
              'POLICY_PROPERTY_LIVE read=1 updated_value=1',
              'POLICY_PROPERTY_ACCESS direct_write_denied=1 error=5',
              'POLICY_PROPERTY guest_read=1 host_value=1 guest_write=0',
              'POLICY_PROPERTY_HOST observed_write=0 value_matches=0',
              'POLICY_VERIFIED_NULL actual_null=1 private_duplicate=1 crt_close=1 wrong_object_rejected=1 invalid_rejected=1',
              'POLICY_READONLY low_label_rejected=1 missing_writeup_rejected=1 rollback_owners=0',
              'POLICY_PIN ancestor_rename=32 asset_rename=32 data_rename=32 final_file_rename=32',
              'POLICY_CHILD actual_lowbox=1 nested_create=1 file_reopen_read=1 nested_delete=1 exit=0 retired=1',
              'POLICY_PRIVATE actual_bootstrap=1 guest_serve_error=5 private_endpoints_inheritable=0',
              'POLICY_SERVER actual_parent_positive=1 wrong_pid_rejected=1 zero_pid_rejected=1',
              'POLICY_RETIRE insertion_target_unchanged=1 injected_error=5 retained=1 retry_confirmed=1 postcleanup_rename=1 owners=0')) {
            if (-not $output.Contains($row)) { throw "missing actual resource observation: $row" }
          }
          # The actual property area deliberately retains its file and mapping until
          # process exit. RunTimed has already proved that process retired.
          $propertyRoot = Join-Path $directory 'property-host'
          $propertySystem = Join-Path $propertyRoot 'system'
          $propertyArea = Join-Path $propertySystem 'gesher-properties'
          $propertyPersist = Join-Path $propertyRoot 'property'
          foreach ($path in @($propertyRoot, $propertySystem, $propertyArea, $propertyPersist)) {
            $item = Get-Item -LiteralPath $path -Force
            if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "unexpected property fixture directory: $path"
            }
          }
          $areas = @(Get-ChildItem -LiteralPath $propertyArea -Force)
          if ($areas.Count -ne 1 -or $areas[0].PSIsContainer -or
              ($areas[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $areas[0].Name -cne '28ccc633bf3e2ba6.area') { throw 'unexpected property area contents' }
          if (@(Get-ChildItem -LiteralPath $propertyPersist -Force).Count) { throw 'unexpected persistent properties' }
          Remove-Item -LiteralPath $areas[0].FullName
          foreach ($path in @($propertyArea, $propertySystem, $propertyPersist, $propertyRoot)) {
            if (@(Get-ChildItem -LiteralPath $path -Force).Count) { throw "unexpected property fixture contents: $path" }
            Remove-Item -LiteralPath $path
          }
          Write-Host 'POLICY_PROPERTY_CLEANUP exact_area_removed=1 directories_empty=1'
          if (@(Get-ChildItem -LiteralPath $directory -Force).Count) { throw 'owned resource directory not empty' }
          Remove-Item -LiteralPath $directory
          Write-Host 'Resource-policy component only; actual production APK/Binder route requires full CI.'
