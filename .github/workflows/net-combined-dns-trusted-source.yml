                  supplier_head = pr['head']['sha']
                  head_repository_id = str(pr['head']['repo']['id'])
                  require(bool(re.fullmatch('[0-9a-f]{40}', supplier_head)), 'Invalid PR head SHA')
                  subprocess.run(['git', 'merge-base', '--is-ancestor', supplier_head, sha], check=True)
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + '/actions/runs/' + run_id,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  run = json.load(response)
              verify_run_identity(run, event, supplier_head, head_repository_id, run_id, attempt, repository_id)
              for field, value in (('id', -1), ('run_attempt', -1), ('head_sha', '0' * 40),
                                   ('event', 'unsupported'), ('path', 'forged.yml'), ('name', 'forged')):
                  mutant_run = copy.deepcopy(run)
                  mutant_run[field] = value
                  reject('actual_run_' + field, lambda: verify_run_identity(mutant_run, event,
                      supplier_head, head_repository_id, run_id, attempt, repository_id))
              for field in ('repository', 'head_repository'):
                  mutant_run = copy.deepcopy(run)
                  mutant_run[field]['id'] = -1
                  reject('actual_run_' + field, lambda: verify_run_identity(mutant_run, event,
                      supplier_head, head_repository_id, run_id, attempt, repository_id))
              for field in ('actor', 'triggering_actor'):
                  mutant_run = copy.deepcopy(run); mutant_run[field]['login'] = 'foreign'
                  reject('actual_run_' + field, lambda: verify_run_identity(mutant_run, event,
                      supplier_head, head_repository_id, run_id, attempt, repository_id))
              mutant_run = copy.deepcopy(run); mutant_run['head_repository']['full_name'] = 'foreign/repo'
              reject('actual_run_head_repository_name', lambda: verify_run_identity(mutant_run, event,
                  supplier_head, head_repository_id, run_id, attempt, repository_id))
              reject('unsupported_event', lambda: verify_run_identity(run, 'schedule',
