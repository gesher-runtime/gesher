              require(os.environ.get('GITHUB_ACTOR') == os.environ.get('GITHUB_TRIGGERING_ACTOR') == 'palmoni5', 'Wrong coherent actor')
              require(os.environ.get('GITHUB_WORKFLOW_SHA') == sha and os.environ.get('GITHUB_REPOSITORY_ID') == '1426153186',
                      'Wrong coherent workflow source/repository identity')
              repository_id = os.environ['GITHUB_REPOSITORY_ID']
              supplier_head, head_repository_id = sha, repository_id
              if event == 'pull_request':
                  payload = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
