              subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, sha], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', HISTORICAL_BASE, sha], check=True)
              # Re-enact each historical preflight on its original immutable baseline.
              for base in (ORIGINAL_BASE, UNION_BASE):
