          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git(*args):
              return subprocess.check_output(['git', *args])

          def inventory(commit):
              rows = git('ls-tree', '-r', '-z', commit).split(b'\0')
              result = {}
              for row in filter(None, rows):
                  metadata, name = row.split(b'\t', 1)
                  mode, kind, blob = metadata.decode().split()
                  name = name.decode()
                  if not name.startswith('docs/'):
                      require(kind == 'blob' and mode in ('100644', '100755'), 'Linked source: ' + name)
                      result[name] = (mode, blob)
              return result

          def inventory_all(commit):
              result = {}
              for row in filter(None, git('ls-tree', '-r', '-z', commit).split(b'\0')):
                  metadata, name = row.split(b'\t', 1)
                  mode, kind, blob = metadata.decode().split()
                  require(kind == 'blob' and mode in ('100644', '100755'), 'Linked source: ' + name.decode())
                  result[name.decode()] = (mode, blob)
              return result

          def verify_historical(actual):
              for name, blob in HISTORICAL_PINS.items():
                  require(actual.get(name, ('', ''))[1] == blob,
                          'Original Native/AOT selected source assertion failed: ' + name)

          def verify_selected(actual, adapted=False, coherent=False):
              pins = UNION_PINS | NATIVE_PINS
              if adapted:
                  pins = pins | {name: SOURCE_PINS[name] for name in ('tests/native3-locks/command_oracle.py', 'tests/native3-locks/command_worker.cc')}
                  # Only this reviewed font-path adaptation supersedes a Native
                  # selected leaf. The historical baseline above stays exact.
                  name = 'compat/posix/src/path.cc'
                  require(name in (UNION_PINS | NATIVE_PINS) and SOURCE_PINS[name] == FONTS_PINS[name],
                          'Font path adaptation lacks exact independent pins')
                  pins[name] = FONTS_PINS[name]
                  # Preserve historical selected proof; adapt this one exact current logger overlap.
                  name = '.github/workflows/native3-locks-commands.yml'
                  require(name in (UNION_PINS | NATIVE_PINS) and SOURCE_PINS[name] == RECEIPT_PINS[name],
                          'Receipt selected adaptation lacks exact independent pins')
                  pins[name] = RECEIPT_PINS[name]
              if coherent:
                  require(adapted and all(name in (pins | PREVIOUS_SOURCE_PINS | SOURCE_PINS) for name in COHERENT_TCP_PINS),
                          'Coherent overlay requires historical selected or source pins')
                  pins.update(COHERENT_TCP_PINS)
              for name, blob in pins.items():
                  require(actual.get(name, ('', ''))[1] == blob, 'Union/Native selected source assertion failed: ' + name)


          def verify_tree(actual, expected):
              require(actual == expected, 'Unreviewed full source delta: ' + repr(sorted(
                  path for path in actual.keys() | expected.keys() if actual.get(path) != expected.get(path))))

          def verify_checkout(expected):
              for name, (mode, blob) in expected.items():
                  path = Path(name)
                  require(path.is_file() and not path.is_symlink(), 'Missing/linked checkout: ' + name)
                  data = path.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  require(actual == blob, 'Dirty checkout: ' + name)

          def caller_identity(value):
              require(bool(re.fullmatch('[0-9a-f]{40}', value)), 'Missing/malformed external caller authority')
              require(git('cat-file', '-t', value).strip() == b'commit', 'Caller authority is not a commit')
              return git('show', value + ':' + CALLER)

          def verify_external_authority(reviewed, sha):
              require(reviewed == sha, 'External caller authority must equal exact checkout commit')

          def reject(label, action):
              try:
                  action()
              except RuntimeError:
                  print('COMBINED_TRUST_NEGATIVE ' + label + '=rejected', flush=True)
              else:
                  raise RuntimeError('Negative control accepted: ' + label)

          def isolated_import_controls():
              # Deliberately hostile candidate-root modules must never be imported.
              # Run only isolated trusted code; the sentinel modules are never executed.
              paths = [Path('json.py'), Path('hashlib.py')]
              require(all(not p.exists() for p in paths), 'Shadow control path already exists')
              try:
                  for path in paths:
                      path.write_text("raise RuntimeError('candidate shadow module executed')\n")
                  code = ("import sys, json, hashlib; from pathlib import Path; "
                          "assert sys.flags.isolated == 1; "
                          "assert all(Path(m.__file__).resolve().parent != Path.cwd() for m in (json, hashlib)); "
                          "print('COMBINED_TRUST_ISOLATED_IMPORTS json=stdlib hashlib=stdlib isolated=1')")
                  output = subprocess.check_output([sys.executable, '-I', '-c', code], text=True).strip()
                  require(output == 'COMBINED_TRUST_ISOLATED_IMPORTS json=stdlib hashlib=stdlib isolated=1',
                          'Actual isolated stdlib import control differs')
                  print(output, flush=True)
                  reject('actual_candidate_shadow_modules', lambda: require(
                      not git('status', '--porcelain', '--untracked-files=all').strip(),
                      'Candidate shadow modules are unreviewed source'))
              finally:
                  for path in paths:
                      path.unlink(missing_ok=True)
              require(not git('status', '--porcelain', '--untracked-files=all').strip(),
                      'Isolated import controls did not restore checkout')

          def verify_run_identity(run, event, source_head, head_repository_id, run_id, attempt, repository_id):
              require(event in ('workflow_dispatch', 'push', 'pull_request'), 'Unsupported CI event')
              require(str(run['id']) == run_id and str(run['run_attempt']) == attempt,
                      'Wrong actual run/attempt')
              require(run['repository']['full_name'] == REPO and
                      str(run['repository']['id']) == repository_id and
                      run['head_repository']['full_name'] == REPO and
                      str(run['head_repository']['id']) == head_repository_id and
                      run['head_sha'] == source_head, 'Wrong actual run repository/head/source')
              require(run['event'] == event and run['path'] == CALLER and run['name'] == 'ci',
                      'Wrong actual workflow/event')
              require(run['actor']['login'] == run['triggering_actor']['login'] == 'palmoni5',
                      'Wrong actual run actor')

