name: Services geocoder worker component
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [wip/services3-cancel-current]
    paths: [.github/workflows/services-geocoder-worker-component.yml]
jobs:
  controlled-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared controller source identities
        shell: pwsh
        run: |
          $expected = @{
            'tools/windows4/TsfJobSupervisor.cs' = 'd1cf9319268df1bccf03177e7f8dde52a7f55510'
            'tools/windows4/TsfJobWorker.cs' = '08f29f78f56195825d96de2f2f6632bf91133e1e'
            'tools/windows4/test-tsf-job-supervisor.ps1' = '91e6946c4ab05a42ffbf6917166193c3dad07872'
            'tools/windows4/run-tsf-component.ps1' = '4474bae13d5fe73038e8569be454753cdb21df43'
          }
          foreach ($path in $expected.Keys) {
            $actual = git hash-object $path
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected[$path]) { throw "Shared source mismatch: $path" }
            Write-Host "SHARED_SOURCE origin=8ad629ccb1edc86b9f701e83f01838ab9eaa1e94 path=$path blob=$actual"
          }
      - name: Verify canonical TSF workflow identity
        shell: pwsh
        run: |
          $actual = git hash-object .github/workflows/tsf-format-component.yml
          if ($LASTEXITCODE -ne 0 -or $actual -cne '6d3925f22d0a4b0f9f2fc4292e45c2a0f122cc46') { throw 'TSF routing adaptation mismatch' }
          Write-Host "SERVICES_TSF_CANONICAL source=$env:GITHUB_SHA blob=$actual canonical_origin=8ad629ccb1edc86b9f701e83f01838ab9eaa1e94"
      - name: Qualify shared job controller
        shell: pwsh
        run: ./tools/windows4/test-tsf-job-supervisor.ps1
      - name: Exercise owned worker and child containment
        shell: pwsh
        run: ./tests/windows/tracks/geocoder-operation-fixture.ps1
