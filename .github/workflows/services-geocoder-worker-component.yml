name: Services geocoder worker component
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [wip/services3-cancel-current, wip/services-real-winrt]
    paths: [.github/workflows/services-geocoder-worker-component.yml]
jobs:
  controlled-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared controller source identities
        shell: pwsh
        run: |
          $expected = @{
            'tools/windows4/TsfJobSupervisor.cs' = '625be4d5906bb48dd02d6103382fd2e85ac88738'
            'tools/windows4/TsfJobWorker.cs' = 'e4392ea9ee4e8faf6d2f4b28424f8e05fe692ce1'
            'tools/windows4/test-tsf-job-supervisor.ps1' = 'e290479e7b81fbd8f9d8705687c84fb084b789e9'
            'tools/windows4/diagnose-pwsh-job.ps1' = '6956c0d1714f17761dc756c17f72cb8d119fe306'
            'tools/windows4/run-tsf-component.ps1' = '4474bae13d5fe73038e8569be454753cdb21df43'
          }
          foreach ($path in $expected.Keys) {
            $actual = git hash-object $path
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected[$path]) { throw "Shared source mismatch: $path" }
            Write-Host "SHARED_SOURCE source=$env:GITHUB_SHA historical_baseline=8ad629ccb1edc86b9f701e83f01838ab9eaa1e94 path=$path blob=$actual"
          }
      - name: Verify canonical TSF workflow identity
        shell: pwsh
        run: |
          $actual = git hash-object .github/workflows/tsf-format-component.yml
          if ($LASTEXITCODE -ne 0 -or $actual -cne 'a3b2021a2df42316a46d4849eb499fb5b1842a7e') { throw 'TSF routing adaptation mismatch' }
          Write-Host "SERVICES_TSF_CANONICAL source=$env:GITHUB_SHA blob=$actual canonical_origin=8ad629ccb1edc86b9f701e83f01838ab9eaa1e94"
      - name: Qualify shared job controller
        shell: pwsh
        run: ./tools/windows4/test-tsf-job-supervisor.ps1
      - name: Characterize PowerShell process startup
        shell: pwsh
        run: ./tools/windows4/diagnose-pwsh-job.ps1
      - name: Exercise owned worker and child containment
        shell: pwsh
        run: ./tests/windows/tracks/geocoder-operation-fixture.ps1
      - name: Verify actual WinRT probe source identities
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0) { throw 'WinRT checkout identity mismatch' }
          $expected = @{
            'tests/windows/tracks/geocoder-operation.ps1' = '75eb4cf6f9537c61ff27ec49d2a3a938c81b1618'
            'tests/windows/tracks/geocoder-probe-exit.cs' = '4927e87a71c41069bbed24be748cfd0b771583d5'
            'tests/windows/tracks/geocoder-winrt-supplier.cs' = '11da9f04efdbb98de30006b0c26e169bec6d8b19'
            'tests/windows/helpers/geocoder-provider-probe.ps1' = 'd02fc316ccaca1ac856eaeae64df6e4053da569c'
            'tests/windows/helpers/geocoder-winrt-fixture.ps1' = 'cbde2ac48b603f3cc12e544a3e42d744d9b58864'
            'tests/windows/helpers/geocoder-roslyn-worker.ps1' = '31491e2cb20bf72e78c49476c9ab874649fee6c9'
            'tests/windows/helpers/geocoder-compiler-host.ps1' = '43f5fc28e1c0a19e8d8c5e1df1a3d823f734f16f'
            'tests/windows/helpers/geocoder-compile.ps1' = '90fceedc449a2ec11dfa80809e05163c89bcf2fa'
            'tests/windows/helpers/run-geocoder-winrt-component.ps1' = '1277bcc858c9c52eb8b24476831aadb286831418'
            'tests/windows/tracks/58-devices.ps1' = '5c85b08ff4d5920b5cd838e47d0b39417a96722c'
          }
          foreach ($path in $expected.Keys) {
            $actual = git hash-object $path
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected[$path]) { throw "WinRT source mismatch: $path" }
            Write-Host "WINRT_SOURCE base=f0f52116 source=$env:GITHUB_SHA path=$path blob=$actual sha256=$((Get-FileHash $path -Algorithm SHA256).Hash)"
          }
      - name: Exercise actual WinRT adapter and real Maps provider in owned children
        shell: pwsh
        run: ./tests/windows/helpers/run-geocoder-winrt-component.ps1
