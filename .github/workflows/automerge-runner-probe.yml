name: automerge runner probe

on:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      group: gesher-automerge
      labels: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify isolated runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -un)" = gesher-runner
          test ! -d /mnt/c
          test "$(nproc)" -le 2
          test "$(nproc)" -ge 1
          systemd-detect-virt
          free -h
          df -h /
          test ! -r /home/gesher-control/.ssh/authorized_keys
          if sudo -n true 2>/dev/null; then echo 'Unexpected sudo access'; exit 1; fi
      - uses: actions/checkout@v4
        with:
          # Exercise only the existing trusted controller and isolated fixtures.
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Exercise production controller with isolated API fixtures
        uses: actions/github-script@v7
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const result = spawnSync(process.execPath,
              ['--test', '.github/scripts/label-automerge.test.js'], {stdio: 'inherit'});
            if (result.error) throw result.error;
            if (result.status !== 0) core.setFailed('Controller fixture tests failed');
