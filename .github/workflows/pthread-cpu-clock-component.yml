name: pthread CPU clock component
on:
  workflow_dispatch:
  push:
    branches: [wip/pthread-foreign-cpu-clock]
    paths:
      - '.github/workflows/pthread-cpu-clock-component.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: pthread-cpu-clock-component-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
  DYNARMIC_COMMIT: 9d4582339990d4eae53f1dc7160686920fc2075c
  FMT_VERSION: '11.0.2'
  BOOST_VERSION: '1.83.0'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 tools/pthread-cpu-clock/payload.py preflight
          python3 tools/pthread-cpu-clock/payload.py selftest
          python3 tools/surface/test-verified-artifact.py
  compile:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert Linux clock lifetime on this exact source and attempt
        shell: bash
        run: |
          set -euo pipefail
          mkdir cpu-clock-fixture
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread tests/native/pthread_cpu_clock_linux_reference.c -o /tmp/cpu-clock-reference
          /tmp/cpu-clock-reference | tee cpu-clock-fixture/linux-reference.log
      - name: Fetch verified compiler and exact source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW_NAME.tar.xz" -o compiler.tar.xz
          printf '%s  compiler.tar.xz\n' "$LLVM_MINGW_SHA256" | sha256sum --check --strict
          mkdir toolchain
          tar -xJf compiler.tar.xz -C toolchain
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          tools/fetch-aosp.sh
          python3 tools/pthread-cpu-clock/payload.py deps
          bash cpu-clock-arm64-deps.sh
          test "$(git -C deps/dynarmic rev-parse HEAD)" = "$DYNARMIC_COMMIT"
          python3 compat/arm64/dll/patch-dynarmic-fpsr.py deps/dynarmic
      - name: Build production native host, actual bionic core and matching translator
        shell: bash
        run: |
          set -euo pipefail
          llvm="$PWD/toolchain/$LLVM_MINGW_NAME"
          cmake -S . -B out -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw.cmake -DLLVM_MINGW="$llvm" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=
          ninja -C out gesher-exec pthread_cpu_clock_target_test
          cmake -S compat/arm64/dll -B out-arm64 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-llvm-mingw.cmake" -DLLVM_MINGW="$llvm" -DCMAKE_BUILD_TYPE=Release -DDYNARMIC_DIR="$PWD/deps/dynarmic" -DBoost_INCLUDE_DIR="$PWD/deps/boost" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C out-arm64 gesher_arm64 arm64_smoke_test
          cp out/gesher-exec.exe out/pthread_cpu_clock_target_test.exe out-arm64/gesher_arm64.dll out-arm64/arm64_smoke_test.exe cpu-clock-fixture/
          "$llvm/bin/llvm-readobj" --coff-imports out/gesher-exec.exe > cpu-clock-fixture/imports-host.txt
          "$llvm/bin/llvm-readobj" --coff-imports out/pthread_cpu_clock_target_test.exe > cpu-clock-fixture/imports-core.txt
          "$llvm/bin/llvm-readobj" --coff-imports out-arm64/gesher_arm64.dll > cpu-clock-fixture/imports-arm64.txt
      - name: Compile actual NDK callers for both ABIs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o ndk.zip
          # Publisher's r27c Linux identity from android/ndk release metadata.
          printf '%s  ndk.zip\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e | sha1sum --check --strict
          test "$(stat -c %s ndk.zip)" = 663987688
          unzip -q ndk.zip
          python3 tools/pthread-cpu-clock/payload.py guests
      - name: Seal exact host, translator, guest and Linux roles
        run: |
          python3 tools/pthread-cpu-clock/payload.py record
          python3 tools/pthread-cpu-clock/payload.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: pthread-cpu-clock-core
          path: cpu-clock-fixture/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strict actual ZIP producer and complete typed member verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/artifact_receipt.py --name pthread-cpu-clock-core --producer compile --destination cpu-clock-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Actual ZIP source/attempt/digest receipt failed' }
          python tools/pthread-cpu-clock/payload.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Whole source/role/compiler/member verification failed' }
      - name: Actual bounded native and both NDK ABI callers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function InvokeClockFixture([string] $Name, [string[]] $Arguments, [string] $Required) {
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.cpu-clock.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name.cpu-clock.stderr"
            $exe = if ($Name -eq 'guest-x86_64' -or $Name -eq 'guest-arm64') { 'gesher-exec.exe' } else { "$Name.exe" }
            $process = $null
            try {
              $start = @{ FilePath = (Join-Path $pwd "cpu-clock-fixture/$exe"); WorkingDirectory = (Join-Path $pwd 'cpu-clock-fixture'); WindowStyle = 'Hidden'; PassThru = $true; RedirectStandardOutput = $stdout; RedirectStandardError = $stderr }
              if ($Arguments.Count -gt 0) { $start.ArgumentList = $Arguments }
              $process = Start-Process @start
              if (-not $process.WaitForExit(180000)) { throw "Owned fixture timeout: $Name" }
              $process.Refresh()
              if ($process.ExitCode -ne 0) { throw "Actual fixture $Name exit=$($process.ExitCode)" }
              if (-not (Select-String -LiteralPath $stdout -SimpleMatch -Pattern $Required -Quiet)) { throw "Missing actual fixture verdict: $Name" }
            } finally {
              $cleanupProblems = @()
              if ($null -ne $process) {
                try {
                  if (-not $process.HasExited) {
                    $process.Kill($true)
                    if (-not $process.WaitForExit(5000)) { $cleanupProblems += "Owned fixture cleanup failed: $Name" }
                  }
                } catch { $cleanupProblems += "Owned fixture cleanup exception: $_" }
                try { $process.Dispose() } catch { $cleanupProblems += "Owned fixture disposal exception: $_" }
              }
              if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
              if ($cleanupProblems.Count -gt 0) { throw ($cleanupProblems -join '; ') }
            }
          }
          InvokeClockFixture 'arm64_smoke_test' @() 'arm64_smoke_test all passed'
          InvokeClockFixture 'pthread_cpu_clock_target_test' @() '0 test(s) failed'
          InvokeClockFixture 'guest-x86_64' @('--elf', 'cpu-clock-x86_64', 'cpu-clock-x86_64') 'PASS guest CPU clock: retained identity, busy target, errors and replacement lifecycle'
          InvokeClockFixture 'guest-arm64' @('--elf', 'cpu-clock-arm64', 'cpu-clock-arm64') 'PASS guest CPU clock: retained identity, busy target, errors and replacement lifecycle'
