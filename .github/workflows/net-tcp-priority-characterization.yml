name: net-tcp-priority-characterization
on:
  workflow_dispatch:
  push:
    branches: [wip/net-tcp-priority, wip/net-tcp-error-state]
    paths: [.github/workflows/net-tcp-priority-characterization.yml, tests/net-tcp-priority/winsock_oracle.cc, tests/net-tcp-priority/connectex_oracle.cc, tests/net-tcp-priority/connect_lifecycle_oracle.cc, tests/net-tcp-priority/connect_owner_module.h, tests/net-tcp-priority/connect_owner_module.cc, tests/net-tcp-priority/connect_owner_driver.cc, tests/net-tcp-priority/contract.cc]
permissions:
  contents: read
jobs:
  linux-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute independent Linux loopback reference
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pthread tests/net-tcp-priority/contract.cc -o /tmp/tcp-priority-reference
          timeout 20 /tmp/tcp-priority-reference
          g++ -std=c++20 -Wall -Wextra -Werror tests/net-tcp-priority/connect_lifecycle_oracle.cc -o /tmp/connect-lifecycle-reference
          timeout 20 /tmp/connect-lifecycle-reference
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile independent WinSDK oracle in CI
        shell: cmd
        run: cl /nologo /std:c++20 /W4 /WX tests\net-tcp-priority\winsock_oracle.cc /Fe:urgent-oracle.exe /link ws2_32.lib
      - name: Observe actual queued and consumed urgent marks
        shell: pwsh
        run: |
          & ./urgent-oracle.exe
          if ($LASTEXITCODE -ne 0) { throw 'Urgent characterization failed' }
      - name: Compile independent overlapped-connect owner oracle
        shell: cmd
        run: cl /nologo /std:c++20 /W4 /WX tests\net-tcp-priority\connectex_oracle.cc /Fe:connectex-oracle.exe /link ws2_32.lib
      - name: Observe actual modes, context, owned completion and cancellation
        shell: pwsh
        run: |
          & ./connectex-oracle.exe
          if ($LASTEXITCODE -ne 0) { throw 'ConnectEx characterization failed' }
      - name: Compile independent module ownership and unload oracle
        shell: cmd
        run: |
          cl /nologo /std:c++20 /MD /W4 /WX /LD tests\net-tcp-priority\connect_owner_module.cc /Fe:connect-owner-module.dll /link ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /MD /W4 /WX tests\net-tcp-priority\connect_owner_driver.cc /Fe:connect-owner-driver.exe /link ws2_32.lib
      - name: Observe repeated actual module pin, TLS exit, close and handle retirement
        shell: pwsh
        run: |
          & ./connect-owner-driver.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native module ownership characterization failed' }
