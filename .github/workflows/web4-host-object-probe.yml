name: web4-host-object-probe
on:
  push:
    branches: ['wip/web4-childframes']
    paths: ['.github/workflows/web4-host-object-probe.yml', 'tests/web4-host-object-probe/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realm:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify pinned SDK and build probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0) { throw 'Probe checkout does not match run source' }
          Write-Host "SOURCE $env:GITHUB_SHA RUN $env:GITHUB_RUN_ID ATTEMPT $env:GITHUB_RUN_ATTEMPT OS $env:RUNNER_OS"
          dotnet --info
          New-Item -ItemType Directory -Force nuget | Out-Null
          $package = Join-Path $PWD 'nuget/Microsoft.Web.WebView2.1.0.4258.31.nupkg'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4258.31/microsoft.web.webview2.1.0.4258.31.nupkg' -OutFile $package
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          if ($digest -cne '56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9') { throw "SDK digest mismatch: $digest" }
          Write-Host "SDK_SHA256 $digest"
          $env:NUGET_PACKAGES = Join-Path $PWD 'nuget-cache'
          dotnet restore tests/web4-host-object-probe/Web4HostObjectProbe.csproj --source (Join-Path $PWD 'nuget')
          if ($LASTEXITCODE -ne 0) { throw 'probe restore failed' }
          dotnet build tests/web4-host-object-probe/Web4HostObjectProbe.csproj --no-restore -c Release
          if ($LASTEXITCODE -ne 0) { throw 'probe build failed' }
      - name: Observe actual WebView2 contexts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'tests/web4-host-object-probe/bin/Release/net8.0-windows/Web4HostObjectProbe.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'web4-host-object-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'web4-host-object-stderr.log'
          $p = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          $timedOut = $false
          $cleanupError = $null
          $exitCode = $null
          try {
            $timedOut = -not $p.WaitForExit(100000)
            if ($timedOut) {
              try { $p.Kill($true) } catch { $cleanupError = "kill failed: $($_.Exception.Message)" }
              if (-not $p.WaitForExit(5000)) { $cleanupError = 'probe did not exit within five seconds after kill' }
            }
            if ($p.HasExited) { $exitCode = $p.ExitCode }
          } finally {
            $p.Dispose()
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
          }
          if ($cleanupError) { Write-Host "PROBE_CLEANUP_ERROR $cleanupError" }
          if ($timedOut) { throw 'platform probe exceeded 100 seconds' }
          if ($cleanupError) { throw $cleanupError }
          if ($exitCode -ne 0) { throw "platform probe exited $exitCode" }
          if (-not (Select-String -LiteralPath $stdout -SimpleMatch 'HOST_OBJECT_PROBE_PASS' -Quiet)) { throw 'missing early platform probe verdict' }
