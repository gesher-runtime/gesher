name: web3-query-component
on:
  push:
    branches: ['wip/web3-query-bound']
    paths: ['.github/workflows/web3-query-component.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  framework:
    uses: ./.github/workflows/framework.yml
  ndk:
    uses: ./.github/workflows/native-libs.yml
  translator:
    uses: ./.github/workflows/arm64.yml
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build exact current runtime with CI hook, launcher, compiler and boot jars
        run: |
          cmake -S . -B out -DGESHER_WEB3_QUERY_TESTS=ON
          ninja -C out gesher_web3 gesher_window
          ninja -C out dalvikvm dex2oat profman dexdump gesher-exec
          tools/build-boot-jars.sh out/boot-jars
          tests/build-test-apps.sh out/test-apps
          mkdir -p dist-component
          cp out/dalvikvm.exe out/dex2oat.exe out/profman.exe out/dexdump.exe out/gesher-exec.exe dist-component/
          cp out/dalvikvm.map out/dex2oat.map out/boot-jars/*.jar out/test-apps/hello.dex dist-component/
          printf '%s\n' "$GITHUB_SHA" > dist-component/web3-query-component-source.txt
      - name: Hash exact current host package members
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist-component')
          manifest = dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'],
                          attempt=os.environ['GITHUB_RUN_ATTEMPT'], repository=os.environ['GITHUB_REPOSITORY'],
                          files={path.name:hashlib.sha256(path.read_bytes()).hexdigest()
                                 for path in root.iterdir() if path.is_file()})
          (root/'web3-query-host.json').write_text(json.dumps(manifest, indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: web3-query-host
          path: dist-component/
  test:
    needs: [framework, ndk, translator, host]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact AOT-qualified build sources and download scaffolding inside CI only
        shell: pwsh
        run: |
          $base = gh api repos/${{ github.repository }}/actions/runs/40557661255 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $base.head_sha -cne '4502599386a693cc7673ea8a01f7ec09c915cccc' -or
              $base.name -cne 'ci' -or $base.conclusion -cne 'success' -or $base.run_attempt -ne 1) {
            throw 'Unexpected immutable AOT-qualified run/source/attempt'
          }
          $repository = gh api repos/${{ github.repository }} | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $base.repository.id -ne $repository.id -or
              $base.repository.full_name -cne '${{ github.repository }}') {
            throw 'Immutable scaffold repository identity mismatch'
          }
          $jobs = gh api repos/${{ github.repository }}/actions/runs/40557661255/jobs --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect immutable scaffold jobs' }
          foreach ($name in 'build','framework / framework','boot-image / compile','graphics / build',
                            'angle / build','media / media','webview / build','exec / exec') {
            $job = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($job.Count -ne 1 -or $job[0].conclusion -cne 'success' -or $job[0].run_id -ne $base.id -or
                $job[0].head_sha -cne $base.head_sha -or $job[0].run_attempt -ne $base.run_attempt) {
              throw "Unproved build prerequisite source/attempt $name"
            }
          }
          git diff --exit-code $base.head_sha HEAD -- aosp.lock patches cmake/aosp/art.cmake compat/base
          if ($LASTEXITCODE -ne 0) { throw 'Changed ART/boot-image compatibility source needs separate review' }
          Write-Host "ACTUAL_WEB3_COMPONENT_SCAFFOLD run=$($base.id) source=$($base.head_sha) overall=green build/framework/boot=success"
          $inventory = gh api repos/${{ github.repository }}/actions/runs/40557661255/artifacts --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect immutable scaffold artifacts' }
          foreach ($artifact in 'windows-x64','framework','graphics','angle','media','webview','exec','boot-image') {
            $rows = @($inventory.artifacts | Where-Object name -CEQ $artifact)
            if ($rows.Count -ne 1 -or $rows[0].id -le 0 -or $rows[0].expired -or $rows[0].size_in_bytes -le 0 -or
                $rows[0].workflow_run.id -ne $base.id -or $rows[0].workflow_run.head_sha -cne $base.head_sha -or
                $rows[0].workflow_run.repository_id -ne $repository.id -or $rows[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "Unexpected immutable scaffold artifact identity $artifact"
            }
            Write-Host "ACTUAL_WEB3_COMPONENT_ARTIFACT name=$artifact id=$($rows[0].id) digest=$($rows[0].digest) source=$($rows[0].workflow_run.head_sha) repository=$($repository.id)"
            gh run download 40557661255 -R '${{ github.repository }}' -n $artifact -D dist
            if ($LASTEXITCODE -ne 0) { throw "Missing immutable scaffolding $artifact" }
          }
          New-Item -ItemType Directory -Force old-jars | Out-Null
          foreach ($name in 'core-oj','core-libart','core-icu4j','framework','gesher-app') {
            Copy-Item "dist/$name.jar" "old-jars/$name.jar"
          }
      - name: Verify every exact current producer and artifact before download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $current = gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $current.head_sha -cne '${{ github.sha }}' -or
              $current.run_attempt -ne [int]'${{ github.run_attempt }}' -or $current.name -cne 'web3-query-component' -or
              $current.repository.id -ne $current.head_repository.id -or $current.repository.full_name -cne '${{ github.repository }}') {
            throw 'Current coherent source/run/attempt/repository mismatch'
          }
          $jobs = gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -gt 100) { throw 'Cannot verify current producer jobs' }
          foreach ($name in 'framework / host-tools','framework / framework','ndk / native-libs','translator / build','host') {
            $rows = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($rows.Count -ne 1 -or $rows[0].conclusion -cne 'success' -or $rows[0].head_sha -cne '${{ github.sha }}' -or
                $rows[0].run_id -ne $current.id -or $rows[0].run_attempt -ne $current.run_attempt) {
              throw "Current producer source/attempt is not successful: $name"
            }
          }
          $inventory = gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $inventory.total_count -gt 100) { throw 'Cannot inspect coherent artifact package' }
          foreach ($name in 'framework','native-libs','arm64','web3-query-host') {
            $rows = @($inventory.artifacts | Where-Object name -CEQ $name)
            if ($rows.Count -ne 1 -or $rows[0].id -le 0 -or $rows[0].size_in_bytes -le 0 -or $rows[0].expired -or
                $rows[0].workflow_run.id -ne $current.id -or $rows[0].workflow_run.head_sha -cne '${{ github.sha }}' -or
                $rows[0].workflow_run.repository_id -ne $current.repository.id -or $rows[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "Current artifact provenance mismatch: $name"
            }
            Write-Host "ACTUAL_QUERY_CURRENT_SUPPLIER name=$name id=$($rows[0].id) digest=$($rows[0].digest) source=${{ github.sha }} run=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          }
      - uses: actions/download-artifact@v4
        with:
          name: framework
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: web3-query-host
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: dist
      - name: Guard all five actual boot jars and rebuild image on any byte difference
        shell: pwsh
        run: |
          if ((Get-Content dist/web3-query-component-source.txt -Raw).Trim() -cne '${{ github.sha }}') {
            throw 'Current native runtime provenance mismatch'
          }
          $hostManifest = Get-Content -LiteralPath dist/web3-query-host.json -Raw | ConvertFrom-Json
          if ($hostManifest.source -cne '${{ github.sha }}' -or $hostManifest.run -ne '${{ github.run_id }}' -or
              $hostManifest.attempt -ne '${{ github.run_attempt }}' -or $hostManifest.repository -cne '${{ github.repository }}') {
            throw 'Fresh host manifest supplier mismatch'
          }
          foreach ($member in $hostManifest.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path dist $member.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $member.Value) {
              throw "Fresh host package copy mismatch $($member.Name)"
            }
            Write-Host "ACTUAL_QUERY_HOST_MEMBER name=$($member.Name) sha256=$($member.Value) source=$($hostManifest.source)"
          }
          foreach ($member in 'dalvikvm.exe','dex2oat.exe','profman.exe','dexdump.exe','gesher-exec.exe',
                             'core-oj.jar','core-libart.jar','core-icu4j.jar') {
            if ($member -cnotin $hostManifest.files.PSObject.Properties.Name) { throw "Missing current host producer member $member" }
          }
          foreach ($member in 'web3-query-tests.dex','web3app.apk','framework.jar','gesher-app.jar',
                             'gesher_arm64.dll','web3_network.so','web3_network_arm64.so') {
            if (-not (Test-Path -LiteralPath (Join-Path dist $member))) { throw "Missing exact component supplier member $member" }
          }
          $same = $true
          foreach ($name in 'core-oj','core-libart','core-icu4j','framework','gesher-app') {
            $old = (Get-FileHash "old-jars/$name.jar" -Algorithm SHA256).Hash
            $new = (Get-FileHash "dist/$name.jar" -Algorithm SHA256).Hash
            Write-Host "ACTUAL_WEB3_COMPONENT_JAR name=$name old=$old current=$new identical=$($old -ceq $new)"
            if ($old -cne $new) { $same = $false }
          }
          if ($same) {
            Write-Host 'ACTUAL_WEB3_COMPONENT_BOOT reused immutable AOT-qualified image: all five current jars byte-identical'
          } else {
            $workspace = $PWD.Path
            $profiles = @("$workspace/rebuilt-boot/profiles/art-boot-image-profile.txt",
                          "$workspace/rebuilt-boot/profiles/framework-boot-image-profile.txt",
                          "$workspace/tools/boot-image/gesher-startup-profile.txt")
            & "$workspace/tools/boot-image/fetch-profiles.ps1" -Out "$workspace/rebuilt-boot/profiles"
            try {
              & "$workspace/tools/boot-image/compile.ps1" -Dist "$workspace/dist" -Out "$workspace/rebuilt-boot" -Filter speed-profile -ExtensionFilter speed-profile -AppFilter speed -BootProfiles $profiles -TimeoutMinutes 15
            } finally {
              Set-Location -LiteralPath $workspace
            }
            Copy-Item -Recurse -Force "$workspace/rebuilt-boot/framework/*" "$workspace/dist/framework/"
            foreach ($image in 'boot','boot-core-libart','boot-core-icu4j','boot-framework','boot-gesher-app') {
              foreach ($extension in 'art','oat','vdex') {
                $member = "$image.$extension"
                $produced = (Get-FileHash "$workspace/rebuilt-boot/framework/x86_64/$member" -Algorithm SHA256).Hash
                $consumed = (Get-FileHash "$workspace/dist/framework/x86_64/$member" -Algorithm SHA256).Hash
                if ($produced -cne $consumed) { throw "Rebuilt boot image copy identity mismatch $member" }
                Write-Host "ACTUAL_WEB3_COMPONENT_IMAGE member=$member sha256=$consumed rebuilt-copy-identical=True"
              }
            }
            Write-Host 'ACTUAL_WEB3_COMPONENT_BOOT rebuilt from current native compiler and all five current jars'
          }
      - name: Actual held-global-lock and mapped cancellation plus original14 Web3 cases
        shell: pwsh
        run: tests/windows/run-web3-query-component.ps1 -Dir "$PWD/dist"
      - name: Component process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web3-query-component-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/web3-query-component-${{ github.run_id }}/**
          if-no-files-found: ignore
