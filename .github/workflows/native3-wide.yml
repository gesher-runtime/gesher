name: native3-wide

on:
  workflow_dispatch:
  push:
    branches: ['wip/native3-wide']
    paths:
      - 'probes/native3/wide/**'
      - 'tests/native2/native3_wide*'
      - 'compat/bionic/locale_bionic.cc'
      - '.github/workflows/native3-wide.yml'

permissions:
  contents: read

concurrency:
  group: native3-wide-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_TAG: '20261006'
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check source digests and prepare include-only adapters
        run: python3 probes/native3/wide/prepare.py /tmp/wide-reference.cpp
      - name: Compile and execute the pinned bionic reference
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-unused-parameter \
            -I tests/native2 /tmp/wide-reference.cpp -o /tmp/wide-reference
          /tmp/wide-reference

  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: ${{ env.LLVM_MINGW_NAME }}
      - name: Fetch llvm-mingw
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" | tar -xJ -C ~/toolchain
      - name: Compile the production locale implementation with the pinned Windows toolchain
        run: |
          "$HOME/toolchain/$LLVM_MINGW_NAME/bin/x86_64-w64-mingw32-clang++" \
            -std=c++20 -O2 -Wall -Wextra -Werror \
            -I compat/bionic/include -c compat/bionic/locale_bionic.cc -o /tmp/wide-locale.o

  ndk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r27c
          key: ndk-27.2.12479018
      - name: Fetch NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip
      - name: Compile both NDK library ABIs
        run: |
          llvm="$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64"
          for triple in x86_64-linux-android aarch64-linux-android; do
            "$llvm/bin/${triple}29-clang++" -std=c++20 -shared -fPIC -O2 \
              -fstack-protector-strong -Wall -Werror -Wl,-soname,libnative2.so \
              -o "/tmp/$triple.so" tests/native2/native2_test.cpp \
              -lz -lEGL -lOpenSLES -laaudio -landroid -llog -ldl
          done
