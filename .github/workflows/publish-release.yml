name: Publish Gesher release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'gesher-runtime/gesher' &&
      github.workflow_ref == 'gesher-runtime/gesher/.github/workflows/publish-release.yml@refs/heads/main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gesher-release-publish
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tools/ci
            tools/surface
      - name: Verify and publish the exact tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/publish_release.py
