name: binder-registry-controlled
on:
  push:
    branches: [wip/binder-peer-identity-current]
    paths: [.github/workflows/binder-registry-controlled.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: binder-registry-controlled-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - name: Build actual registry fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ninja -C out -t commands binder_launch_registry_fixture
          ninja -C out -v binder_launch_registry_fixture
          compiler="$HOME/toolchain/$LLVM_MINGW_NAME/bin/x86_64-w64-mingw32-clang++"
          test -x "$compiler"
          python3 -c 'import os,shlex,subprocess; c=os.environ["HOME"]+"/toolchain/"+os.environ["LLVM_MINGW_NAME"]+"/bin/x86_64-w64-mingw32-clang++"; rows=subprocess.check_output(["ninja","-C","out","-t","commands","binder_launch_registry_fixture"],text=True).splitlines(); matches=[shlex.split(r) for r in rows if "binder-launch-registry-fixture.cc" in r and " -c " in r]; assert len(matches)==1 and c in matches[0], "fixture compiler mismatch"; print("ACTUAL_FIXTURE_COMPILER",c,flush=True)'
          sha256sum "$compiler"
          "$compiler" --version
          mkdir registry-artifact
          cp out/binder_launch_registry_fixture.exe registry-artifact/
          printf '%s\n' "$GITHUB_SHA" > registry-artifact/source.sha
          (cd registry-artifact && sha256sum binder_launch_registry_fixture.exe > executable.sha256)
          cat registry-artifact/source.sha registry-artifact/executable.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: binder-registry-${{ github.sha }}
          path: registry-artifact/
          if-no-files-found: error
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify current-run producer and archive receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/artifact_receipt.py --name "binder-registry-${{ github.sha }}" --producer build --destination registry-artifact
          if ($LASTEXITCODE -ne 0) { throw "artifact receipt failed" }
          $names = @(Get-ChildItem registry-artifact -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path registry-artifact).Path.Length + 1).Replace("\", "/") } | Sort-Object)
          if (($names -join ",") -cne "binder_launch_registry_fixture.exe,executable.sha256,source.sha") { throw "unexpected artifact members: $names" }
      - name: Verify source and executable identity, run bounded real-process controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'checkout source mismatch' }
          if ((Get-Content registry-artifact/source.sha -Raw).Trim() -cne $env:GITHUB_SHA) { throw 'producer source mismatch' }
          $expected = ((Get-Content registry-artifact/executable.sha256 -Raw).Trim() -split '\s+')[0]
          $exe = (Resolve-Path registry-artifact/binder_launch_registry_fixture.exe).Path
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'executable digest mismatch' }
          Write-Host "REGISTRY_SOURCE $env:GITHUB_SHA EXE_SHA256 $expected"
          . "$pwd/tests/windows/helpers/CloseProcessReaders.ps1"
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tests/windows/tracks/50-services.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw $errors[0] }
          $definition = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $false) | Where-Object Name -eq 'RunTimed')
          if ($definition.Count -ne 1) { throw 'missing qualified RunTimed' }
          . ([scriptblock]::Create($definition[0].Extent.Text))
          $output = RunTimed $exe @() 60
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { throw "registry fixture failed or timed out: $code" }
          if ($output -notmatch 'REGISTRY_WAIT_FAILED replacement=0 lookup=0 recovered_same_lease=1') { throw 'missing failed-wait observations' }
          if ($output -notmatch 'REGISTRY_CHILD termination=signaled owned_job=atomic') { throw 'missing owned child termination' }
          if ($output -notmatch 'PASS registry real-child, failed-wait retention, revoke and authority death') { throw 'missing fixture success marker' }
          Write-Host 'Registry fixture only; no legacy bootstrap or Binder runtime qualification.'
# Trigger after pipe handle initialization correction.
