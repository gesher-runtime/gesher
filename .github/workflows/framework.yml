          cp out/framework-res/framework-res.apk out/app/gesher-app.jar out/app/build.prop \
            out/app/lifecycle.apk out/app/components.apk out/app/peer.apk out/app/uiapp.apk out/app/dbapp.apk out/app/devsvc.apk out/app/devices.apk out/app/nodevices.apk out/app/gmsapp.apk dist-framework/
          cp out/framework-res-after/framework-res.apk dist-framework/framework-res-after.apk
          cp out/app/popupapp.apk dist-framework/
          cp out/app/split-package-fixtures.zip dist-framework/
          cp out/app/gesher-camera.apk dist-framework/
          cp out/app/rtlapp.apk dist-framework/
          cp out/app/imeapp.apk dist-framework/
          cp out/app/lifeapp.apk dist-framework/
          cp out/app/localeapp.apk dist-framework/
          cp out/app/locale2app.apk out/app/locale2other.apk dist-framework/
          cp out/app/surfaceapp.apk dist-framework/
          cp out/app/winapp.apk dist-framework/
          cp out/app/winlegacy.apk dist-framework/
          cp out/app/netapp.apk out/app/nonetapp.apk dist-framework/
          cp out/app/nsdregistration.apk dist-framework/
          cp out/app/web3app.apk dist-framework/
          cp out/app/services-tests.dex dist-framework/
          cp out/app/microgprobe.apk dist-framework/
          cp out/app/windowpromotion-target.apk out/app/windowpromotion-source.apk out/app/windowpromotion-control.dex dist-framework/
          cp out/app/orderedbroadcast-source.apk out/app/orderedbroadcast-target.apk dist-framework/
          cp out/app/webviewlifecycle.apk dist-framework/
          cp out/app/namedprocesslauncher.apk dist-framework/
          cp out/app/packageevents-target-v1.apk out/app/packageevents-target-v2.apk \
            out/app/packageevents-observer.apk out/app/packageevents-control.dex dist-framework/
          cp out/app/icon-base.apk out/app/icon-density.apk out/app/icon-bundle.apks out/app/icon-bundle.xapk dist-framework/
          cp out/app/exitstatusapp.apk dist-framework/
          cp out/app/crashnotice.apk dist-framework/
          cp out/app/sharedlibraryapp.apk out/app/sharedlibrarydlc.apk out/app/sharedlibraryafter.apk out/app/sharedlibraryafterdlc.apk out/app/sharedlibrarybad.apk out/app/shared-base-v1.jar out/app/shared-base-v2.jar out/app/shared-entry.jar dist-framework/
          cp out/app/graphics-tests.dex out/app/web3-query-tests.dex dist-framework/
          ls -la dist-framework

      - uses: actions/upload-artifact@v4
        with:
          name: framework
          path: dist-framework/

      # The framework's classes and the coremod, to compile gesher-app's Java
      # against off CI (app/build.sh --framework-classes/--core-classes).
      - name: Pack the framework's classes
        run: |
          (cd out/framework/classes && zip -qr "$GITHUB_WORKSPACE/framework-classes.zip" .)
          (cd out/coremod && zip -qr "$GITHUB_WORKSPACE/coremod.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: framework-classes
          path: |
            framework-classes.zip
            coremod.zip
          retention-days: 3
          compression-level: 0

      - name: Save the framework's JVM tools
        if: always() && steps.jvm.outputs.cache-hit != 'true' && hashFiles('out/framework/jvm-tools/kotlinc/bin/kotlinc') != ''
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: out/framework/jvm-tools
          key: ${{ steps.jvm.outputs.cache-primary-key }}

      - name: Sparse sets after the build
        if: always() && !cancelled()
        id: after
        run: |
          python3 tools/aosp_cache.py snapshot "$PWD/third_party/aosp"
          echo "sparse=$(tools/sparse-bp.sh --hash)" >> "$GITHUB_OUTPUT"

      - name: Save AOSP sources
        if: always() && !cancelled() && steps.after.outputs.sparse != '' && (steps.aosp.outputs.cache-matched-key != format('{0}-{1}', env.AOSP_KEY, steps.after.outputs.sparse))
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: third_party/aosp
          key: ${{ env.AOSP_KEY }}-${{ steps.after.outputs.sparse }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-logs
          path: |
            build-framework.log
            build-http-legacy.log
            framework-res.log
            out/framework/javac.log
            out/framework/*.sources.txt
          if-no-files-found: ignore
