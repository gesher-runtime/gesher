name: framework

# framework.jar's pipeline on its own: the host tools (cached), the boot
# class path as javac's java.base (the "coremod"), framework-res, and
# tools/framework/build.py's generators and javac.
#
#   gh workflow run framework --ref <branch> [-f javac-memory=10g]
#
# ci.yml calls this workflow too. Every input is cached, so a run after a
# tools/framework change goes straight to the build. Caches are per branch
# (plus main's): the first run on a new branch builds the host tools.
on:
  # Pushes to the framework branches that touch its inputs run it too.
  push:
    branches: ['phase2/**', 'wip/ci-framework']
    paths:
      - 'tools/framework/**'
      - 'tools/gen/**'
      - 'tools/host/**'
      - 'tools/host-tools-ci.cmake'
      - 'tools/build-boot-jars.sh'
      - 'tools/build-framework-res.sh'
      - 'tools/make-coremod.sh'
      - 'tools/sparse-bp.sh'
      - 'tools/fetch-aosp.sh'
      - 'aosp.lock'
      - 'patches/**'
      - '.github/workflows/framework.yml'
  workflow_dispatch:
    inputs:
      javac-memory:
        description: javac's heap (-J-Xmx)
        default: 10g
  workflow_call:
    inputs:
      local-runner:
        description: Use the restricted runner for eligible owner PRs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # to find the host tools another branch built

# A newer push to a branch supersedes its running framework build.
concurrency:
  # github.workflow is the caller's ("ci") when ci.yml runs this one.
  group: ${{ github.workflow }}-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: gesher-runtime/gesher/.github/actions/runner-route@5d76cae649c2257c376aaf87a5283099c99f111c
        id: route
        with:
          requested: ${{ inputs.local-runner }}
          enabled: ${{ vars.GESHER_SELF_HOSTED_PRS }}
  # aidl, hidl-gen, protoc and its Java plugins, stats-log-api-gen,
  # expresscatalog-codegen, sysprop_java: tools/host, built natively for the
  # Linux build host from the pinned AOSP sources.
  host-tools:
    needs: runner-route
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runner) }}
    timeout-minutes: 75
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize local build inputs
        if: runner.environment == 'self-hosted'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: initialize

      # Keyed on what the tools are built from: tools/host, the blueprint
      # reader its bp_srcs.py uses, and the aosp.lock lines and patches of
      # the projects it compiles.
      - name: Host tools' sources
        id: key
        run: |
          projects='tag|system/(libbase|logging|core|libhwbinder)|system/tools/(aidl|hidl|sysprop)'
          projects+='|external/(googletest|abseil-cpp|protobuf|gflags|jsoncpp|libtextclassifier|fmtlib)'
          projects+='|frameworks/(proto_logging|base)'
          lines=$(grep -E "^($projects)(\s|$)" aosp.lock)
          echo "$lines"
          lock=$(echo "$lines" | sha256sum | cut -c1-16)
          # v: the build recipe below (compiler, flags); bump it when it changes.
          key="host-tools-v1-$lock-${{ hashFiles('tools/host/**', 'tools/host-tools-ci.cmake', 'tools/framework/blueprint.py', 'tools/framework/tree.py', 'patches/system/libbase/**', 'patches/system/logging/**') }}"
          key="$key-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Select fresh current-run host tools build
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo 'Build fresh host tools for this exact run and attempt'

      - name: Cache AOSP sources
        if: steps.reuse.outputs.build == 'true'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Fetch AOSP sources
        if: steps.reuse.outputs.build == 'true'
        run: tools/fetch-aosp.sh

      - name: Save fetched AOSP inputs
        if: steps.reuse.outputs.build == 'true'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
      - name: Verify local host tool dependencies
        if: runner.environment == 'self-hosted'
        run: |
          for tool in clang clang++ bison flex ccache; do command -v "$tool"; done
      - name: Install build tools
        if: steps.reuse.outputs.build == 'true' && runner.environment != 'self-hosted'
        run: sudo apt-get install -y --no-install-recommends ninja-build bison flex ccache libc++-18-dev libc++abi-18-dev

      # Restored and saved separately, so a failed build keeps its objects.
      - name: Restore compiler output
        if: steps.reuse.outputs.build == 'true' && runner.environment != 'self-hosted'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: ~/.cache/ccache
          key: ccache-host-tools-${{ github.run_id }}
          restore-keys: ccache-host-tools-

      - name: Build
        if: steps.reuse.outputs.build == 'true'
        run: |
          ccache --set-config=max_size="${CCACHE_LIMIT:-1G}"
          # clang and libc++, as Soong builds them: AOSP host sources use
          # clang-only builtins (__builtin_available) gcc rejects, and rely on
          # libc++'s transitive includes (libpropertyinfoserializer's
          # std::find_if and strcpy). -O1: build time over speed.
          cmake -S tools/host -B out/host -G Ninja -DAOSP_DIR="$PWD/third_party/aosp" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O1 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_PROJECT_gesher_host_tools_INCLUDE="$PWD/tools/host-tools-ci.cmake"
          ninja -C out/host -k 0 ${BUILD_JOBS:+-j$BUILD_JOBS}
          ccache --show-stats | head -5
          mkdir -p dist-host/protobuf
          cp out/host/aidl out/host/hidl-gen out/host/stats-log-api-gen \
             out/host/sysprop_java out/host/expresscatalog-codegen \
             out/host/protoc-gen-javanano out/host/protoc-gen-javastream dist-host/
          cp out/host/protobuf/protoc dist-host/protobuf/
          ls -la dist-host dist-host/protobuf

      - name: Save compiler output
        if: always() && steps.reuse.outputs.build == 'true' && runner.environment != 'self-hosted'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: ~/.cache/ccache
          key: ccache-host-tools-${{ github.run_id }}

      - name: Smoke-test the tools
        if: steps.reuse.outputs.build == 'true'
        run: |
          ls -la dist-host dist-host/protobuf
          dist-host/protobuf/protoc --version

      - name: Publish the build for other branches
        if: steps.reuse.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.key }}
          path: dist-host/
          retention-days: 90

  framework:
    needs: [host-tools, runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runner) }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize local build inputs
        if: runner.environment == 'self-hosted'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: initialize

      - name: Verify framework compiler dependency acquisition
        run: |
          python3 -m unittest discover -s tools/tests -p test_framework_xsdc.py -v
          python3 -m unittest discover -s tools/tests -p test_framework_jvm_tools.py -v

      - name: Cache keys
        run: echo "AOSP_KEY=aosp-framework-${{ hashFiles('aosp.lock', 'patches/**') }}" >> "$GITHUB_ENV"

      - name: Verify fresh current-run host tools archive
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_TOOLS_NAME: ${{ needs.host-tools.outputs.key }}
        run: |
          set -euo pipefail
          python3 tools/ci/artifact_receipt.py --name "$HOST_TOOLS_NAME" --producer 'host-tools' --producer-suffix --destination ci-suppliers/host-tools
          python3 tools/surface/assemble-artifacts.py --source ci-suppliers/host-tools --destination dist-host --ledger ci-owners-host-tools.json --owner host_tools
          find dist-host -type f -exec chmod +x {} +

      # The tools are linked against libc++, as Soong links them.
      - name: Install the host tools' runtime
        run: |
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted ]]; then
            sudo apt-get install -y --no-install-recommends libc++1-18 libc++abi1-18
          fi
          missing=$(for t in $(find dist-host -type f); do ldd "$t" | sed -n "s|^|$t: |; /not found/p"; done)
          if [[ -n $missing ]]; then echo "$missing"; echo "::error::host tools miss shared libraries"; exit 1; fi
          dist-host/protobuf/protoc --version

      # build.py --checkout widens the sparse sets to the files the plan
      # needs (blobless clones fetch them then). The tree is saved again,
      # under a key naming its sparse sets, only when that widened it.
      - name: Verify isolated AOSP cache lifecycle fixtures
        run: python3 -m unittest discover -s tools/tests -p test_aosp_cache.py -v

      - name: Restore AOSP sources
        id: aosp
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: third_party/aosp
          key: ${{ env.AOSP_KEY }}-
          restore-keys: |
            ${{ env.AOSP_KEY }}-
            aosp-framework-
            aosp-

      - name: Prepare restored AOSP sources before Git acquisition
        run: python3 tools/aosp_cache.py prepare "$PWD/third_party/aosp"

      - name: Fetch AOSP sources
        run: |
          tools/fetch-aosp.sh
          tools/sparse-bp.sh

      - uses: actions/setup-java@v4
        if: runner.environment != 'self-hosted'
        with:
          distribution: temurin
          java-version: 21

      # Restored and saved apart (actions/cache saves only when the whole
      # job passes, and the javac step may still fail): each is saved right
      # after it is built.
      - name: Restore the framework's JVM tools (kotlinc, JavaPoet, Guava)
        id: jvm
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: out/framework/jvm-tools
          key: framework-jvm-tools-kotlin-2.1.21

      - name: Restore the coremod
        id: coremod
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: out/coremod
          key: coremod-${{ hashFiles('tools/build-boot-jars.sh', 'tools/make-coremod.sh', 'tools/gen/**', 'config/aconfig/**', 'java/compile-stubs/**', 'aosp.lock', 'patches/libcore/**', 'patches/external/icu/**') }}

      - name: Build the coremod (boot class path classes as java.base)
        if: steps.coremod.outputs.cache-hit != 'true'
        run: |
          WORK_DIR="$PWD/work/boot" tools/build-boot-jars.sh out/boot-jars
          tools/make-coremod.sh work/boot out/coremod

      - name: Save the coremod
        if: steps.coremod.outputs.cache-hit != 'true'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: out/coremod
          key: ${{ steps.coremod.outputs.cache-primary-key }}

      - name: Restore framework-res
        id: res
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: out/framework-res
          key: framework-res-${{ hashFiles('tools/build-framework-res.sh', 'tools/gen/aconfig_values.py', 'aosp.lock') }}

      # aapt2 for framework-res and lifecycle.apk, from Google's build-tools, where
      # tools/build-framework-res.sh looks for it (WORK_DIR); fetched here,
      # with retries, as dl.google.com fails now and then.
      - name: Restore build-tools
        id: bt
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: restore
          path: work/build-tools-36.1
          key: build-tools-36.1-linux

      - name: Fetch build-tools
        if: steps.bt.outputs.cache-hit != 'true'
        run: |
          mkdir -p work
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o work/build-tools.zip \
            https://dl.google.com/android/repository/build-tools_r36.1_linux.zip
          rm -rf work/build-tools.tmp && mkdir work/build-tools.tmp
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            work/build-tools.zip work/build-tools.tmp
          chmod +x work/build-tools.tmp/*/aapt2 work/build-tools.tmp/*/aidl work/build-tools.tmp/*/zipalign
          mv work/build-tools.tmp/* work/build-tools-36.1 && rmdir work/build-tools.tmp
          rm work/build-tools.zip

      - name: Save build-tools
        if: steps.bt.outputs.cache-hit != 'true'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: work/build-tools-36.1
          key: build-tools-36.1-linux

      - name: Build framework-res (R.java, framework-res.apk)
        if: steps.res.outputs.cache-hit != 'true'
        run: WORK_DIR="$PWD/work" tools/build-framework-res.sh out/framework-res > framework-res.log 2>&1 || { tail -50 framework-res.log; exit 1; }

      - name: Save framework-res
        if: steps.res.outputs.cache-hit != 'true'
        uses: gesher-runtime/gesher/.github/actions/local-build-cache@e5eb64d95271bc83c4eb40c9a069a2a45acac11c
        with:
          phase: save
          path: out/framework-res
          key: ${{ steps.res.outputs.cache-primary-key }}

      - name: Build real after-app resource table and require byte-identical internal Java IDs
        run: |
          WORK_DIR="$PWD/work" FRAMEWORK_RES_OVERLAY_DIR="$PWD/tests/shared-libraries/after-res" \
            tools/build-framework-res.sh out/framework-res-after > framework-res-after.log 2>&1 || { tail -50 framework-res-after.log; exit 1; }
          diff -qr out/framework-res/framework-res-java out/framework-res-after/framework-res-java
          test "$(sha256sum out/framework-res/framework-res.apk | cut -d' ' -f1)" != "$(sha256sum out/framework-res-after/framework-res.apk | cut -d' ' -f1)"
          echo 'ACTUAL_AFTER_RESOURCE generated R/Manifest byte-identical; actual resource APK bytes differ'
      - name: Build the framework (generators + javac)
        run: |
          set +e
          python3 tools/framework/build.py --aosp third_party/aosp --out out/framework \
            --core-classes out/coremod --aidl "$PWD/dist-host/aidl" \
            --host-tools "$PWD/dist-host" \
            --framework-res-java out/framework-res/framework-res-java \
            --checkout --javac-memory "${{ inputs.javac-memory || '10g' }}" --show 20 \
            2>&1 | grep -v '^warning:' | tee build-framework.log
          code=${PIPESTATUS[0]}
          javac=$(grep -E '^javac exit ' build-framework.log | tail -1)
          {
            echo "### framework build"
            echo
            echo "**${javac:-javac not reached (build.py exit $code)}**"
            echo
            echo '```'
            grep -E '^(plan:|generated:|sources left out:|javac:|javac exit)' build-framework.log
            grep -E '^  (unsupported|skipped)' build-framework.log
            sed -n '/^javac exit /,$p' build-framework.log | sed -n '2,16p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z $javac ]]; then
            echo "::error::build.py failed before javac (exit $code)"
            exit 1
          fi
          errors=$(sed -E 's/^javac exit (-?[0-9]+), ([0-9]+) errors.*/\2/' <<<"$javac")
          jcode=$(sed -E 's/^javac exit (-?[0-9]+),.*/\1/' <<<"$javac")
          if [[ $jcode != 0 ]]; then
            echo "::error::javac: $errors errors (exit $jcode); see the step summary and the framework-logs artifact (javac.log)"
            exit 1
          fi
          echo "::notice::javac: no errors"

      # org.apache.http.legacy.jar, the shared library apps name in <uses-library>
      # (external/apache-http's java_sdk_library), against the framework's classes:
      # installed as /system/framework, not on the boot class path.
      - name: Build org.apache.http.legacy
        run: |
          python3 tools/framework/build.py org.apache.http.legacy --aosp third_party/aosp             --out out/http-legacy --core-classes out/coremod --classpath out/framework/classes             --checkout --javac-memory 4g 2>&1 | grep -v '^warning:' | tee build-http-legacy.log
          grep -q '^javac exit 0, 0 errors' build-http-legacy.log
          test -f out/http-legacy/org.apache.http.legacy.jar

      # gesher-app's driver and its test APK compile against the framework's
      # classes, so they are built here, next to them.
      - name: Build gesher-app and lifecycle.apk
        env:
          # Reuse one verified compiler across all app and fixture builders.
          R8_JAR: ${{ runner.temp }}/gesher-r8.jar
          # Retain this exact build dependency for the framework host contracts.
          APKSIG_JAR: ${{ runner.temp }}/gesher-apksig.jar
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$R8_JAR.download" \
            https://dl.google.com/android/maven2/com/android/tools/r8/9.5.26/r8-9.5.26.jar
          printf '%s  %s\n' 3502f087388ce95bbf5254555927f09385dc2636873964d0bd53f3eaf4fb49ad "$R8_JAR.download" | sha256sum --check --strict
          mv "$R8_JAR.download" "$R8_JAR"
          app/build.sh out/app --framework-classes out/framework/classes --core-classes out/coremod
          python3 tools/test_uia_cache.py --java-home "$JAVA_HOME" \
            --framework-classes out/framework/classes --core-classes out/coremod \
            --app-classes out/app/gesher-app-classes.jar
          python3 tools/test_apk_signing.py --apksig-jar "$APKSIG_JAR"
          tests/dex-services/build.sh out/app --framework-classes out/framework/classes --core-classes out/coremod --app-classes out/app/gesher-app-classes.jar
          python3 tools/test_role_manager_contracts.py --framework-classes out/framework/classes --app-classes out/app/gesher-app-classes.jar
          tests/dex-graphics/build.sh out/app --framework-classes out/framework/classes --core-classes out/coremod --app-classes out/app/gesher-app-classes.jar
          tests/web3-query/build.sh out/app --framework-classes out/framework/classes --core-classes out/coremod
          chmod +x work/build-tools-36.1/zipalign  # a cache saved before zipalign was made executable
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" APP_DIR="$PWD/tests/apps/exitstatusapp" tests/apps/lifecycle/build.sh out/app --framework-res out/framework-res/framework-res.apk --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" APP_DIR="$PWD/tests/apps/crashnotice" tests/apps/lifecycle/build.sh out/app --framework-res out/framework-res/framework-res.apk --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" bash tests/apps/sharedlibraryapp/build.sh out/app --framework-res out/framework-res/framework-res.apk --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/lifecycle/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/uiapp/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/components/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" bash tests/apps/splitpackage/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/peer/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/dbapp/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          # The devices track's test apps (docs/devices.md).
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" APP_DIR="$PWD/tests/apps/devices" tests/apps/lifecycle/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" APP_DIR="$PWD/tests/apps/nodevices" tests/apps/lifecycle/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/devsvc/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          # Offline microG cross-UID account, provider, notification and permission probes.
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" bash tests/apps/microgprobe/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          # Actual service-first foreground delegation and selective background window probes.
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" bash tests/apps/windowpromotion/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod \
            --app-classes out/app/gesher-app-classes.jar
          # Ordinary cross-process ordered broadcast/PendingResult/final-callback probes.
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" bash tests/apps/orderedbroadcast/build.sh out/app \
            --framework-res out/framework-res/framework-res.apk \
            --framework-classes out/framework/classes --core-classes out/coremod
          # Startup disable, first-use ordering and per-process data directory lifecycles.
