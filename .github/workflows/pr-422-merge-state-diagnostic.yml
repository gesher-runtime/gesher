name: pr-422 native merge-state diagnostic

# One-off metadata reads only. This workflow never loads repository or PR code.
on:
  push:
    branches: [palmoni5/pr-422-merge-state-diagnostic]
    paths: [.github/workflows/pr-422-merge-state-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: pr-422-native-state-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'gesher-runtime/gesher' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/palmoni5/pr-422-merge-state-diagnostic' &&
      github.actor == 'palmoni5' && github.triggering_actor == 'palmoni5' &&
      github.event.deleted == false && vars.GESHER_BOT_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Match the production optional-status permission
        id: flag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          APP_QA_STATUS: ${{ vars.GESHER_APP_QA_STATUS }}
        with:
          script: core.setOutput('enabled', process.env.APP_QA_STATUS === 'true');

      - name: Create the production read-only App credential
        id: reader
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GESHER_BOT_APP_ID }}
          private-key: ${{ secrets.GESHER_BOT_PRIVATE_KEY }}
          owner: gesher-runtime
          repositories: gesher
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: ${{ steps.flag.outputs.enabled == 'true' && 'read' || '' }}

      - name: Create the production publication App credential for comparison reads only
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GESHER_BOT_APP_ID }}
          private-key: ${{ secrets.GESHER_BOT_PRIVATE_KEY }}
          owner: gesher-runtime
          repositories: gesher
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-statuses: ${{ steps.flag.outputs.enabled == 'true' && 'write' || '' }}

      - name: Read the fixed PR with reader, publisher, then reader again
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          READER_TOKEN: ${{ steps.reader.outputs.token }}
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          READER_SLUG: ${{ steps.reader.outputs.app-slug }}
          PUBLISHER_SLUG: ${{ steps.publisher.outputs.app-slug }}
        with:
          script: |
            const expectedHead = '6ca4e6b693bc50bfadcef731e193616bbdf68132';
            const expectedBase = '95fab79799f3c7b774590b4937f6e5a96f2d229b';
            const expectedApp = 'gesher-runtime-automation';
            if (process.env.READER_SLUG !== expectedApp ||
                process.env.PUBLISHER_SLUG !== expectedApp) {
              throw new Error('Unexpected App identity; diagnostic stopped.');
            }
            // Separate clients preserve each credential's own authentication hook.
            const reader = new github.constructor({
              auth: process.env.READER_TOKEN, baseUrl: 'https://api.github.com'
            });
            const publisher = new github.constructor({
              auth: process.env.PUBLISHER_TOKEN, baseUrl: 'https://api.github.com'
            });
            // The only API operation below is this literal GraphQL query.
            const query = `query {
              viewer { login }
              repository(owner: "gesher-runtime", name: "gesher") {
                nameWithOwner
                pullRequest(number: 422) {
                  number state isDraft headRefOid baseRefOid baseRefName
                  mergeable mergeStateStatus reviewDecision
                }
              }
            }`;
            async function snapshot(client, credential) {
              let result;
              try {
                result = await client.graphql(query);
              } catch {
                // Do not print request objects, headers, tokens or raw API errors.
                throw new Error('Metadata query failed for ' + credential + '; details suppressed.');
              }
              const pr = result.repository?.pullRequest;
              if (result.repository?.nameWithOwner !== 'gesher-runtime/gesher' ||
                  result.viewer?.login !== expectedApp + '[bot]' || pr?.number !== 422) {
                throw new Error('Unexpected query identity or target; diagnostic stopped.');
              }
              core.info(JSON.stringify({
                credential, actor: context.actor, viewer: result.viewer.login,
                state: pr.state, isDraft: pr.isDraft,
                head: pr.headRefOid, base: pr.baseRefOid, baseRefName: pr.baseRefName,
                mergeable: pr.mergeable, mergeStateStatus: pr.mergeStateStatus,
                reviewDecision: pr.reviewDecision
              }));
              if (pr.state !== 'OPEN' || pr.isDraft !== false ||
                  pr.headRefOid !== expectedHead || pr.baseRefOid !== expectedBase ||
                  pr.baseRefName !== 'main') {
                throw new Error('PR or base changed; diagnostic stopped without any PR mutation.');
              }
            }
            await snapshot(reader, 'reader-before');
            await snapshot(publisher, 'publication-reader');
            await snapshot(reader, 'reader-after');
