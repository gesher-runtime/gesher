name: arm64-windows

on:
  push:
    branches:
      - 'feature/arm64-windows'
      - 'wip/arm64-windows'
  pull_request:
    branches:
      - 'feature/arm64-windows'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  source-identity:
    uses: ./.github/workflows/source-identity.yml
  build:
    needs: [source-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: ${{ env.LLVM_MINGW_NAME }}

      - name: Fetch llvm-mingw
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/toolchain
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" \
            | tar -xJ -C ~/toolchain

      # Normally restores the entry ci.yml saves on main; only a main dispatch saves.
      - name: Cache AOSP sources
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Restore AOSP sources
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Fetch AOSP sources
        shell: bash
        run: tools/fetch-aosp.sh

      - name: Install build tools
        shell: bash
        run: sudo apt-get install -y --no-install-recommends ninja-build ccache

      # This workflow never runs on a main push, so branches keep saving this
      # small (~25 MB) cache (an exception in tools/ci/test_cache_policy.py).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-arm64-windows-${{ github.sha }}
          restore-keys: ccache-arm64-windows-

      - name: Build and verify ARM64 Windows targets
        shell: bash
        run: bash tools/ci/build-arm64-windows.sh

      - name: Upload ARM64 Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-windows-binaries
          path: |
            out-arm64/*.exe
            out-arm64/*.a
          if-no-files-found: warn

  arm64-required:
    name: arm64-required
    if: always()
    needs: [source-identity, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every production CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          PY
