name: automerge

# Records exact-head label approval, rechecks QA after CI and arms auto-merge.
# Only default-branch scripts execute with this workflow's write permissions.

on:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [ci, arm64-windows]
    types: [completed]
  repository_dispatch:
    types: [gesher-automerge-reconcile]
  # Recovery only: reconcile labeled PRs whose CI finished while the QA gate
  # stayed pending, for example after a controller run hit an API quota.
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Recheck one existing approval; leave empty for all open PRs'
        required: false
        default: ''
        type: string

permissions:
  contents: write       # enable native waiting; never call the merge API
  pull-requests: write  # read PRs and manage reviews in other deployments without the App
  issues: read          # read label events and legacy comments
  statuses: write
  actions: read
  checks: read

jobs:
  automerge:
    # Fork review events have read-only tokens. Their QA proof is rechecked by
    # the privileged workflow_run event before the required gate turns green.
    # Skip events emitted by our own writes before they enter the job queue.
    if: >-
      (github.event_name != 'pull_request_review' ||
       (github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id &&
        !(github.event.sender.id == 358279050 &&
          (github.event.action == 'submitted' || github.event.action == 'dismissed')))) &&
      !(github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' &&
        github.event.sender.id == 358279050 && github.event.label.name == 'automerge') &&
      !(github.event_name == 'pull_request_target' && github.event.action == 'edited' &&
        github.event.changes.base == null)
    concurrency:
      # App-mode bulk/fork jobs only enqueue work. Every job that can publish
      # success or arm native waiting has the same per-PR concurrency key.
      group: merge-approval-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pull_request_number || inputs.pull_request_number || github.event.workflow_run.head_sha || github.run_id }}
      queue: max
    # Only the trusted main workflow can use the privileged controller pool.
    # Review-event YAML from a PR remains hosted; the group also pins main.
    runs-on: ${{ fromJSON(vars.GESHER_AUTOMERGE_LOCAL == 'true' && github.workflow_ref == 'gesher-runtime/gesher/.github/workflows/automerge.yml@refs/heads/main' && '{"group":"gesher-automerge","labels":["self-hosted","linux","x64"]}' || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Schedule payloads carry no repository object; derive the name from the
      # always-present GITHUB_REPOSITORY so App tokens stay scoped to this repo.
      - name: Resolve this repository's name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Read App QA status feature flag
        id: app-qa-flag
        uses: actions/github-script@v7
        env:
          GESHER_APP_QA_STATUS: ${{ vars.GESHER_APP_QA_STATUS }}
        with:
          script: core.setOutput('enabled', process.env.GESHER_APP_QA_STATUS === 'true');
      - name: Create repository bot token
        id: gesher-bot
        if: vars.GESHER_BOT_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GESHER_BOT_APP_ID }}
          private-key: ${{ secrets.GESHER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # Empty input is omitted by the pinned action. Phase 1 installations
          # do not need Statuses permission until the shadow gate is enabled.
          permission-statuses: ${{ steps.app-qa-flag.outputs.enabled == 'true' && 'write' || '' }}
      # Evidence reads use the App installation's own API quota. Issue events and
      # comments on PRs are readable with pull-requests access. Without these read
      # permissions the step fails and reads fall back to GITHUB_TOKEN.
      - name: Create read-only bot token
        id: gesher-read
        if: vars.GESHER_BOT_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GESHER_BOT_APP_ID }}
          private-key: ${{ secrets.GESHER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-actions: read
          permission-checks: read
          permission-metadata: read
          permission-pull-requests: read
          permission-statuses: ${{ steps.app-qa-flag.outputs.enabled == 'true' && 'read' || '' }}
      - uses: actions/github-script@v7
        env:
          GESHER_READ_TOKEN: ${{ steps.gesher-read.outputs.token }}
          GESHER_BOT_TOKEN: ${{ steps.gesher-bot.outputs.token }}
          GESHER_BOT_SLUG: ${{ steps.gesher-bot.outputs.app-slug }}
          GESHER_BOT_APP_ID: ${{ vars.GESHER_BOT_APP_ID }}
          GESHER_BOT_INSTALLATION_ID: ${{ steps.gesher-bot.outputs.installation-id }}
          GESHER_APP_QA_STATUS: ${{ steps.app-qa-flag.outputs.enabled }}
          AUTOMERGE_WORKFLOWS_TOKEN: ${{ secrets.AUTOMERGE_WORKFLOWS_TOKEN }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/label-automerge.js`);
            const appToken = process.env.GESHER_BOT_TOKEN;
            if (appToken && process.env.GESHER_BOT_SLUG !== run.APP_SLUG)
              throw new Error('Unexpected GitHub App for pull request updates');
            const token = appToken || process.env.AUTOMERGE_WORKFLOWS_TOKEN;
            // A separate Octokit instance is essential: changing request headers
            // on github.graphql would still run the original token's auth hook.
            const mergeGithub = token ? new github.constructor({
              auth: token, baseUrl: process.env.GITHUB_API_URL
            }) : github;
            const readToken = process.env.GESHER_READ_TOKEN;
            if (appToken && !readToken)
              core.notice('Gesher App read token unavailable; evidence reads use GITHUB_TOKEN');
            const readGithub = readToken ? new github.constructor({
              auth: readToken, baseUrl: process.env.GITHUB_API_URL
            }) : undefined;
            await run({github, readGithub, context, core, mergeGithub, prGithub: appToken ? mergeGithub : undefined,
              appQaStatus: process.env.GESHER_APP_QA_STATUS === 'true',
              appId: Number(process.env.GESHER_BOT_APP_ID),
              appInstallationId: Number(process.env.GESHER_BOT_INSTALLATION_ID),
              repositoryId: Number(process.env.GITHUB_REPOSITORY_ID)});
