name: automerge

# Records exact-head label/QA approval and enables native merge-queue waiting.
# Only default-branch scripts execute with this workflow's write permissions.

on:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # enable native waiting; never call the merge API
  pull-requests: write  # read PRs, submit/dismiss bot approval reviews
  issues: write         # remove labels; read events and legacy opening receipts
  statuses: write

concurrency:
  group: merge-approval-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/native-merge-queue.js`);
            await run({github, context, core});
