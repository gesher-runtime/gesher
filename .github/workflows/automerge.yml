name: automerge

# Squash-merges a PR labelled `automerge` once CI is green on its current head.
# Rules live in .github/scripts/automerge.js. This workflow only ever runs the
# default branch's copy of that script; it never checks out PR code.

on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [ci, arm64-windows]
    types: [completed]
  # External checks and manually dispatched workflows may finish after both
  # watched workflows. Re-evaluate their recorded approvals without new labels.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write       # merge
  pull-requests: write  # read PRs, submit/dismiss bot approval reviews
  issues: write         # remove labels; read events and legacy opening receipts
  actions: write        # read workflow runs, dispatch ci.yml after merge
  checks: read
  statuses: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'automerge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge.js`);
            await run({github, context, core});
