name: Application storage contracts

on:
  pull_request:
    paths:
      - 'app/java/com/gesher/server/AppDataStorage.java'
      - 'app/java/com/gesher/server/PackageRemovalStorage.java'
      - 'tests/package/AppDataStorageHostTest.java'
      - 'tools/test_app_data_storage.py'
      - '.github/workflows/app-data-storage-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/java/com/gesher/server/AppDataStorage.java'
      - 'app/java/com/gesher/server/PackageRemovalStorage.java'
      - 'tests/package/AppDataStorageHostTest.java'
      - 'tools/test_app_data_storage.py'
      - '.github/workflows/app-data-storage-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify actual layout, migration and uninstall code
        run: python3 tools/test_app_data_storage.py
