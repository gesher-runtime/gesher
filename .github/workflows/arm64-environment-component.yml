name: arm64-environment-component
on:
  push:
    branches: ['wip/arm64-env']
    paths:
      - '.github/workflows/arm64-environment-component.yml'
      - 'tests/windows/run-arm64-environment-component.ps1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  prerequisite:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact verified coherent API3 prerequisite and reviewed environment delta
        shell: pwsh
        run: |
          $source = '942f2c16b1219cd25bcb1c1ca4215f41639cc88f'
          $proof = gh api repos/${{ github.repository }}/actions/runs/40556015168 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $proof.head_sha -cne $source -or $proof.name -cne 'arm64-varargs-component' -or
              $proof.conclusion -cne 'success' -or $proof.run_attempt -ne 1) { throw 'Unverified coherent API3 prerequisite' }
          $jobs = gh api repos/${{ github.repository }}/actions/runs/40556015168/jobs --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs).Count -ne 9 -or
              @($jobs.jobs | Where-Object { $_.conclusion -notin 'success','skipped' }).Count -ne 0) {
            throw 'Unexpected coherent prerequisite job set'
          }
          foreach ($name in 'test (windows-2022)','test (windows-2025)') {
            $job = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($job.Count -ne 1 -or $job[0].head_sha -cne $source -or $job[0].run_attempt -ne 1 -or
                $job[0].conclusion -cne 'success') { throw "Unverified coherent runtime $name" }
          }
          $allowed = @('.github/workflows/arm64-environment-component.yml', '.github/workflows/arm64-varargs-component.yml',
            '.github/workflows/arm64.yml', 'compat/arm64/dll/guest_libc.cc', 'tests/native/arm64_env_contracts.h',
            'tests/native/arm64_env_exec.c', 'tests/native2/native2_test.cpp', 'tests/windows/run-arm64-component.ps1',
            'tests/windows/run-arm64-environment-component.ps1', 'tests/windows/tracks/85-arm64-environment.ps1')
          $changed = @(git diff --name-only $source HEAD -- . ':!docs/**')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare coherent prerequisite source' }
          foreach ($path in $changed) {
            if ($path -cnotin $allowed) { throw "Unreviewed source difference from coherent prerequisite $path" }
          }
          Write-Host "ACTUAL_ENVIRONMENT_PREREQUISITE run=$($proof.id) source=$source attempt=1 coherentWindows=success reviewed-files=$($changed.Count)"
  framework:
    needs: prerequisite
    uses: ./.github/workflows/framework.yml
  ndk:
    needs: prerequisite
    uses: ./.github/workflows/native2.yml
  translator:
    needs: prerequisite
    uses: ./.github/workflows/arm64.yml
  host:
    needs: prerequisite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build current API3 runtime, launcher, compiler and boot jars
        run: |
          ninja -C out dalvikvm dex2oat profman dexdump gesher-exec arm64_elf_test
          tools/build-boot-jars.sh out/boot-jars
          tests/build-test-apps.sh out/test-apps
          mkdir -p dist-component
          cp out/dalvikvm.exe out/dex2oat.exe out/profman.exe out/dexdump.exe out/gesher-exec.exe out/arm64_elf_test.exe dist-component/
          cp out/dalvikvm.map out/dex2oat.map out/boot-jars/*.jar out/test-apps/hello.dex dist-component/
          printf '%s\n' "$GITHUB_SHA" > dist-component/arm64-component-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-api3-host
          path: dist-component/
  test:
    needs: [framework, ndk, translator, host]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact Locale build sources and download scaffolding inside CI only
        shell: pwsh
        run: |
          $base = gh api repos/${{ github.repository }}/actions/runs/40516054280 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $base.head_sha -cne 'ca4ed3cfff46d4843485d89859370dc5b86a4146' -or
              $base.name -cne 'ci' -or $base.conclusion -cne 'failure' -or $base.run_attempt -ne 1) {
            throw 'Unexpected immutable Locale run/source/attempt'
          }
          $repository = gh api repos/${{ github.repository }} | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $base.repository.id -ne $repository.id -or
              $base.repository.full_name -cne '${{ github.repository }}') {
            throw 'Immutable scaffold repository identity mismatch'
          }
          $jobs = gh api repos/${{ github.repository }}/actions/runs/40516054280/jobs --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect immutable scaffold jobs' }
          foreach ($name in 'build','framework / framework','boot-image / compile','graphics / build',
                            'angle / build','media / media','webview / build','exec / exec') {
            $job = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($job.Count -ne 1 -or $job[0].conclusion -cne 'success' -or $job[0].run_id -ne $base.id -or
                $job[0].head_sha -cne $base.head_sha -or $job[0].run_attempt -ne $base.run_attempt) {
              throw "Unproved build prerequisite source/attempt $name"
            }
          }
          git diff --exit-code $base.head_sha HEAD -- aosp.lock patches cmake/aosp/art.cmake compat/base
          if ($LASTEXITCODE -ne 0) { throw 'Changed ART/boot-image compatibility source needs separate review' }
          Write-Host "ACTUAL_COMPONENT_SCAFFOLD run=$($base.id) source=$($base.head_sha) overall=red-Web3 build/framework/boot=success"
          $inventory = gh api repos/${{ github.repository }}/actions/runs/40516054280/artifacts --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect immutable scaffold artifacts' }
          foreach ($artifact in 'windows-x64','framework','graphics','angle','media','webview','exec','boot-image') {
            $rows = @($inventory.artifacts | Where-Object name -CEQ $artifact)
            if ($rows.Count -ne 1 -or $rows[0].id -le 0 -or $rows[0].expired -or $rows[0].size_in_bytes -le 0 -or
                $rows[0].workflow_run.id -ne $base.id -or $rows[0].workflow_run.head_sha -cne $base.head_sha -or
                $rows[0].workflow_run.repository_id -ne $repository.id -or $rows[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "Unexpected immutable scaffold artifact identity $artifact"
            }
            Write-Host "ACTUAL_COMPONENT_ARTIFACT name=$artifact id=$($rows[0].id) digest=$($rows[0].digest) source=$($rows[0].workflow_run.head_sha) repository=$($repository.id)"
            gh run download 40516054280 -R '${{ github.repository }}' -n $artifact -D dist
            if ($LASTEXITCODE -ne 0) { throw "Missing immutable scaffolding $artifact" }
          }
          New-Item -ItemType Directory -Force old-jars | Out-Null
          foreach ($name in 'core-oj','core-libart','core-icu4j','framework','gesher-app') {
            Copy-Item "dist/$name.jar" "old-jars/$name.jar"
          }
      - uses: actions/download-artifact@v4
        with:
          name: framework
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arm64-api3-host
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: native2
          path: dist/native2
      - name: Guard all five actual boot jars and rebuild image on any byte difference
        shell: pwsh
        run: |
          if ((Get-Content dist/arm64-component-source.txt -Raw).Trim() -cne '${{ github.sha }}') {
            throw 'Current native runtime provenance mismatch'
          }
          $same = $true
          foreach ($name in 'core-oj','core-libart','core-icu4j','framework','gesher-app') {
            $old = (Get-FileHash "old-jars/$name.jar" -Algorithm SHA256).Hash
            $new = (Get-FileHash "dist/$name.jar" -Algorithm SHA256).Hash
            Write-Host "ACTUAL_COMPONENT_JAR name=$name old=$old current=$new identical=$($old -ceq $new)"
            if ($old -cne $new) { $same = $false }
          }
          if ($same) {
            Write-Host 'ACTUAL_COMPONENT_BOOT reused immutable Locale image: all five current jars byte-identical'
          } else {
            $workspace = $PWD.Path
            $profiles = @("$workspace/rebuilt-boot/profiles/art-boot-image-profile.txt",
                          "$workspace/rebuilt-boot/profiles/framework-boot-image-profile.txt",
                          "$workspace/tools/boot-image/gesher-startup-profile.txt")
            & "$workspace/tools/boot-image/fetch-profiles.ps1" -Out "$workspace/rebuilt-boot/profiles"
            try {
              & "$workspace/tools/boot-image/compile.ps1" -Dist "$workspace/dist" -Out "$workspace/rebuilt-boot" -Filter speed-profile -ExtensionFilter speed-profile -AppFilter speed -BootProfiles $profiles -TimeoutMinutes 15
            } finally {
              Set-Location -LiteralPath $workspace
            }
            Copy-Item -Recurse -Force "$workspace/rebuilt-boot/framework/*" "$workspace/dist/framework/"
            foreach ($image in 'boot','boot-core-libart','boot-core-icu4j','boot-framework','boot-gesher-app') {
              foreach ($extension in 'art','oat','vdex') {
                $member = "$image.$extension"
                $produced = (Get-FileHash "$workspace/rebuilt-boot/framework/x86_64/$member" -Algorithm SHA256).Hash
                $consumed = (Get-FileHash "$workspace/dist/framework/x86_64/$member" -Algorithm SHA256).Hash
                if ($produced -cne $consumed) { throw "Rebuilt boot image copy identity mismatch $member" }
                Write-Host "ACTUAL_COMPONENT_IMAGE member=$member sha256=$consumed rebuilt-copy-identical=True"
              }
            }
            Write-Host 'ACTUAL_COMPONENT_BOOT rebuilt from current native compiler and all five current jars'
          }
      - name: Actual both-ABI Native2 ART/APK, copied JNI V, FPCR/FPSR and variadic contracts
        shell: pwsh
        run: tests/windows/run-arm64-environment-component.ps1 -Dir "$PWD/dist"
      - name: Component process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-component-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/gesher-arm64-component/logs-*/**
          if-no-files-found: ignore
