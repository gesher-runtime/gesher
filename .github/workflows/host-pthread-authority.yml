# Separate fault supplier/host roles prove production hooks OFF by object/export.
# Retirement inventory correlates controller bookkeeping with kernel identities.
name: host pthread authority initial controls
on:
  workflow_dispatch:
  push:
    branches: [wip/pthread-retirement-provenance]
    paths: ['.github/workflows/host-pthread-authority.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: host-pthread-authority-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_TAG: '20261006'
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Supplier import inventory rejection controls
        run: python3 tools/host-pthread-authority/receipt.py selftest
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: host-pthread-authority
      - name: Build actual POSIX library and both supplier linkage roles
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B out -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C out host_pthread_authority_test
          mkdir host-authority-fixture
          cp out/host_pthread_authority_test.exe host-authority-fixture/
          llvm="$GESHER_AUTHORITY_LLVM"
          python3 tools/host-pthread-authority/bundle.py compile-client "$llvm"
          cp "$llvm/x86_64-w64-mingw32/bin/libwinpthread-1.dll" host-authority-fixture/
          cp "$llvm/x86_64-w64-mingw32/share/mingw32/COPYING.winpthreads.txt" host-authority-fixture/
          cp "$llvm/gesher-winpthreads-authority.json" host-authority-fixture/supplier.json
          "$llvm/bin/llvm-readobj" --coff-imports out/host_pthread_authority_test.exe > host-authority-fixture/imports-host.txt
          "$llvm/bin/llvm-readobj" --coff-imports host-authority-fixture/host_pthread_supplier_test.exe > host-authority-fixture/imports-dynamic.txt
          python3 tools/host-pthread-authority/receipt.py host-role out "$llvm" production host-authority-fixture/host-production-role.json
      - name: Build separately patched supplier and host fault fixture
        shell: bash
        run: |
          set -euo pipefail
          fault_root="$RUNNER_TEMP/gesher-authority-fault-toolchain"
          test ! -e "$fault_root"
          mkdir "$fault_root"
          cp -a --reflink=auto "$GESHER_AUTHORITY_LLVM" "$fault_root/$LLVM_MINGW_NAME"
          cp --reflink=auto "$(dirname "$GESHER_AUTHORITY_LLVM")/compiler.tar.xz" "$fault_root/compiler.tar.xz"
          llvm="$fault_root/$LLVM_MINGW_NAME"
          bash tools/host-pthread-authority/build-supplier.sh "$llvm" fault
          cmake -S . -B out-host-fault -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-llvm-mingw.cmake" -DLLVM_MINGW="$llvm" -DGESHER_HOST_CPU_CLOCK_TEST_FAULTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C out-host-fault host_pthread_authority_fault_test
          cp out-host-fault/host_pthread_authority_fault_test.exe host-authority-fixture/
          cp "$llvm/gesher-winpthreads-authority.json" host-authority-fixture/fault-supplier.json
          python3 tools/host-pthread-authority/receipt.py host-role out-host-fault "$llvm" fault host-authority-fixture/host-fault-role.json
          python3 tools/host-pthread-authority/bundle.py compile-retirement "$llvm"
          cp "$llvm/x86_64-w64-mingw32/bin/libwinpthread-1.dll" host-authority-fixture/fault-libwinpthread-1.dll
          python3 tools/host-pthread-authority/bundle.py record
          python3 tools/host-pthread-authority/bundle.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: host-pthread-authority-initial
          path: host-authority-fixture/
          if-no-files-found: error
  windows:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact producer ZIP and same-source complete member verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/artifact_receipt.py --name host-pthread-authority-initial --producer compile --destination host-authority-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Producer ZIP validation failed' }
          python tools/host-pthread-authority/bundle.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Host supplier identity failed' }
      - name: Real initial host target and dynamic export controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-Content -Raw -LiteralPath host-authority-fixture/bundle.json | ConvertFrom-Json
          $expectedSha = $bundle.members.'libwinpthread-1.dll'
          $problems = [System.Collections.Generic.List[string]]::new()
          foreach ($case in @(@{Name='host_pthread_authority_test';Sha=$null;Exit=0}, @{Name='host_pthread_supplier_test';Sha=$expectedSha;Exit=0}, @{Name='host_pthread_supplier_test';Sha=('0' * 64);Exit=3}, @{Name='host_pthread_authority_fault_test';Sha=$null;Exit=0})) {
            $name = $case.Name
            $stdout = Join-Path $env:RUNNER_TEMP "$name.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "$name.stderr"
            $process = $null
            try {
              $start = @{ FilePath = (Join-Path $pwd "host-authority-fixture/$name.exe"); WorkingDirectory = (Join-Path $pwd 'host-authority-fixture'); WindowStyle = 'Hidden'; PassThru = $true; RedirectStandardOutput = $stdout; RedirectStandardError = $stderr }
              if ($name -eq 'host_pthread_supplier_test') { $start.ArgumentList = @($case.Sha) }
              $process = Start-Process @start
              if (-not $process.WaitForExit(180000)) { throw "Owned fixture timeout $name" }
              $process.Refresh()
              if ($process.ExitCode -ne $case.Exit) { throw "Actual fixture exit $name=$($process.ExitCode) expected=$($case.Exit)" }
              if ($case.Exit -eq 3) { Write-Host "Loaded supplier wrong-digest control rejected with actual exit=$($process.ExitCode)" }
            } catch {
              $problems.Add("$name expected=$($case.Exit): $_")
            } finally {
              if ($null -ne $process) {
                if (-not $process.HasExited) { $process.Kill($true); if (-not $process.WaitForExit(5000)) { throw 'Owned fixture cleanup failed' } }
                $process.Dispose()
              }
              if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            }
          }
          $retirementDir = Join-Path $env:RUNNER_TEMP 'retirement-fixture'
          New-Item -ItemType Directory -Path $retirementDir | Out-Null
          Copy-Item host-authority-fixture/retirement-*.exe $retirementDir
          Copy-Item host-authority-fixture/fault-libwinpthread-1.dll (Join-Path $retirementDir 'libwinpthread-1.dll')
          foreach ($case in @(@{Name='retirement-static';Arg=$null;Exit=0}, @{Name='retirement-dynamic';Arg=$null;Exit=0}, @{Name='retirement-static';Arg='--tls-clear-failure';Exit=3}, @{Name='retirement-dynamic';Arg='--tls-clear-failure';Exit=3})) {
            $name = $case.Name
            $tag = $name + $(if ($case.Arg) { '-failure' } else { '-normal' })
            $start = @{ FilePath = (Join-Path $retirementDir "$name.exe"); WorkingDirectory = $retirementDir; WindowStyle = 'Hidden'; PassThru = $true; RedirectStandardOutput = (Join-Path $retirementDir "$tag.out"); RedirectStandardError = (Join-Path $retirementDir "$tag.err") }
            if ($case.Arg) { $start.ArgumentList = @($case.Arg) }
            $process = Start-Process @start
            try {
              if (-not $process.WaitForExit(180000)) { throw "Owned retirement fixture timeout $name" }
              $process.Refresh()
              if ($process.ExitCode -ne $case.Exit) { throw "Retirement fixture $tag exited $($process.ExitCode) expected=$($case.Exit)" }
              $output = Get-Content -Raw (Join-Path $retirementDir "$tag.out")
              if ($case.Exit -eq 0) {
                foreach ($proof in @('PASS retirement 64 actual registry mutex contentions destructor-before-publication retired-ESRCH', 'PASS retirement user-destructor outside registry lock', 'PASS retirement valid join reached live controller-held target', 'PASS retirement 256 concurrent-live detach join ended-detach reuse original-capability', 'PASS retirement all 338 destructors owned=0 handles=')) {
                  if (-not $output.Contains($proof)) { throw "Missing actual retirement result $tag $proof" }
                }
              } else {
                if (($output.Trim() -ne 'CONTROL TLS-clear-failure destructor exactly once before abort') -or $output.Contains('survived')) { throw "Missing fail-safe TLS clear proof $tag" }
                Write-Host "Actual TLS-clear-failure fail-safe $tag exit=$($process.ExitCode)"
              }
              Write-Host "$name $output"
            } finally {
              if (-not $process.HasExited) { $process.Kill($true); if (-not $process.WaitForExit(5000)) { throw 'Retirement cleanup failed' } }
              $process.Dispose()
              if (Test-Path -LiteralPath (Join-Path $retirementDir "$tag.out")) { Get-Content -LiteralPath (Join-Path $retirementDir "$tag.out") }
              if (Test-Path -LiteralPath (Join-Path $retirementDir "$tag.err")) { Get-Content -LiteralPath (Join-Path $retirementDir "$tag.err") }
            }
          }
          if ($problems.Count -gt 0) { throw ($problems -join '; ') }
