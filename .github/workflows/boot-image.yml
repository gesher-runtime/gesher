name: boot-image

# Gesher's boot image (docs/boot-image.md, ADR 0031): dex2oat.exe, built
# with the runtime by ci.yml's build job, compiles the boot class path on a
# Windows runner (tools/boot-image/compile.ps1) into framework/x86_64/: the
# primary image for core-oj, core-libart and core-icu4j, and extensions for
# framework.jar and gesher-app.jar. ci.yml calls it after the build and
# framework jobs; its artifact "boot-image" goes into the dist of the test
# and package jobs.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/boot-image
            tools/ci
            tools/surface
            tools/symbolize.py
            aosp.lock

      - name: Strict current windows-x64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name windows-x64 --producer "build" --destination ci-suppliers/windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/windows_x64 --destination dist --ledger ci-owners-dist.json --owner windows_x64

      - name: Strict current framework artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name framework --producer "framework" --producer-suffix --destination ci-suppliers/framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/framework --destination dist --ledger ci-owners-dist.json --owner framework

      # AOSP's boot image profiles, at aosp.lock's tag (ADR 0054).
      - name: Fetch the boot image profiles
        shell: pwsh
        run: pwsh -NoProfile -File tools/boot-image/fetch-profiles.ps1 -Out boot-image/profiles

      - name: Compile the boot image
        shell: pwsh
        # BOOT_IMAGE_VERBOSE: compiler logs dex2oat's phases; a dex2oat that
        # hangs is stopped after the timeout, with its threads' stacks.
        # speed-profile with AOSP's boot image profiles, as Android compiles
        # its boot image: the primary image (core-oj, core-libart, core-icu4j)
        # and framework.jar's extension get AOT code for the profile's methods
        # and hold the profile's classes (docs/compiled-code.md, ADR 0054);
        # gesher-app.jar, which no AOSP profile covers, is compiled `speed`.
        # gesher-base maps the oat files' code as views (ADR 0036).
        run: >-
          pwsh -NoProfile -File tools/boot-image/compile.ps1 -Dist dist -Out boot-image
          -Filter speed-profile -ExtensionFilter speed-profile -AppFilter speed
          -BootProfiles boot-image/profiles/art-boot-image-profile.txt,boot-image/profiles/framework-boot-image-profile.txt,tools/boot-image/gesher-startup-profile.txt
          -TimeoutMinutes 15

      # A first look before the test jobs: Hello runs on the image.
      - name: Hello on the boot image
        shell: pwsh
        run: |
          function NoDrive([string] $p) { ($p -replace '\\', '/') -replace '^[A-Za-z]:', '' }
          $root = Join-Path $env:RUNNER_TEMP 'gesher-root'
          foreach ($d in 'system/framework', 'art', 'data', 'i18n/etc/icu', 'tzdata') { New-Item -ItemType Directory -Force (Join-Path $root $d) | Out-Null }
          Copy-Item dist/icudt*l.dat (Join-Path $root 'i18n/etc/icu')
          $env:ANDROID_ROOT = NoDrive "$root/system"
          $env:ANDROID_ART_ROOT = NoDrive "$root/art"
          $env:ANDROID_DATA = NoDrive "$root/data"
          $env:ANDROID_I18N_ROOT = NoDrive "$root/i18n"
          $env:ANDROID_TZDATA_ROOT = NoDrive "$root/tzdata"
          $env:GESHER_REQUIRE_BOOT_IMAGE = '1'
          $env:GESHER_TRACE_FAULTS = '1'
          $bcp = (('core-oj', 'core-libart', 'core-icu4j') | ForEach-Object { NoDrive "$PWD/dist/$_.jar" }) -join ':'
          $out = & dist/dalvikvm.exe "-Xbootclasspath:$bcp" "-Ximage:$(NoDrive "$PWD/boot-image/framework/boot.art")" `
            -Xint '-Xusejit:false' -cp (NoDrive "$PWD/dist/hello.dex") gesher.Hello 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path dist/dalvikvm.map)) {
            $out | python tools/symbolize.py dist/dalvikvm.map | Out-Host
          }
          Write-Host $out
          if ($code -ne 0 -or -not $out.Contains('Hello from ART on Windows') -or $out -notmatch 'gesher: boot image loaded') {
            throw ('Hello did not run on the boot image (exit 0x{0:X8})' -f $code)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: boot-image/
