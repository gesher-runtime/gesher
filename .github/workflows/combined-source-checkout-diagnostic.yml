name: Combined source checkout diagnostic
on:
  workflow_dispatch:
  push:
    branches: [wip/combined-source-cleanliness]
    paths: [.github/workflows/combined-source-checkout-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6649188c63d75d4831e107ee21623849a8a773c
          path: measured
          persist-credentials: false
          sparse-checkout: |
            tests
            tools/ci
            tools/surface
            tools/symbolize.py
            tools/boot-image
            tools/web3
            tools/package
            tools/windows4
            tools/net-udp
            tools/net-udp-component
            tools/net-dns
            tools/net-dns-component
            probes/native3/unicode
      - name: Measure exact fresh checkout without modifying it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location measured
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne 'd6649188c63d75d4831e107ee21623849a8a773c') { throw 'Wrong measured source' }
          $expected = (git rev-parse HEAD:overrides.json).Trim()
          $blob = (git hash-object -- overrides.json).Trim()
          $raw = (Get-FileHash -LiteralPath overrides.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $rawBlob = (git hash-object --no-filters -- overrides.json).Trim()
          $headRawSha = (python -c "import hashlib,subprocess;print(hashlib.sha256(subprocess.check_output(['git','cat-file','blob','HEAD:overrides.json'])).hexdigest())").Trim()
          if ($LASTEXITCODE -ne 0 -or $headRawSha -notmatch '^[0-9a-f]{64}$') { throw 'Cannot hash raw HEAD blob bytes' }
          $size = (Get-Item -LiteralPath overrides.json).Length
          $attrs = (git check-attr -a -- overrides.json | Out-String).Trim().Replace("`r", '').Replace("`n", ';')
          $auto = (git config --show-origin --get core.autocrlf | Out-String).Trim()
          $status = (git status --porcelain -- overrides.json | Out-String).Trim()
          Write-Host "FRESH_CHECKOUT source=$source expected=$expected actual=$blob raw_sha256=$raw head_raw_sha256=$headRawSha no_filters_blob=$rawBlob size=$size autocrlf=$auto attrs=$attrs status=$status"
          if ($blob -cne $expected) { throw 'Fresh checkout tracked blob differs from HEAD' }
  prior-run-staging:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fad0eff2f73215235769566b4c0304c844598195
          persist-credentials: false
          sparse-checkout: |
            tests
            tools/ci
            tools/surface
            tools/symbolize.py
            tools/boot-image
            tools/web3
            tools/package
            tools/windows4
            tools/net-udp
            tools/net-udp-component
            tools/net-dns
            tools/net-dns-component
            probes/native3/unicode
      - name: Reproduce prior run staging with exact prior producer receipts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRun = $env:GITHUB_RUN_ID
          $measuredSource = 'fad0eff2f73215235769566b4c0304c844598195'
          if ((git rev-parse HEAD).Trim() -cne $measuredSource) { throw 'Wrong staging checkout' }
          Write-Host "PRIOR_RUN_DIAGNOSTIC current_run=$actualRun measured_run=40865138716 attempt=1 source=$measuredSource; historical artifacts only, not current-run qualification"
          $env:GITHUB_RUN_ID = '40865138716'
          $env:GITHUB_RUN_ATTEMPT = '1'
          $env:GITHUB_SHA = $measuredSource
          $env:GITHUB_WORKFLOW = 'ci'
          $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
          function Observe([string] $phase) {
            $blob = (git hash-object -- overrides.json).Trim()
            $expected = (git rev-parse HEAD:overrides.json).Trim()
            $raw = (Get-FileHash -LiteralPath overrides.json -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) { throw 'Source measurement failed' }
            Write-Host "STAGING_SOURCE phase=$phase blob=$blob expected=$expected raw_sha256=$raw"
          }
          Observe 'fresh-checkout'
          $roles = @(
            @('windows-x64','build','windows_x64','windows_x64',''),
            @('framework','framework / framework','framework','framework',''),
            @('native-libs','native-libs / native-libs','native_libs','native_libs',''),
            @('arm64','arm64 / build','arm64','arm64',''),
            @('libs-tests','libs / build','libs_tests','libs_tests','libs-tests'),
            @('art-gtests','posix / build','art_gtests','art_gtests','art-gtests'),
            @('graphics','graphics / build','graphics','graphics',''),
            @('angle','angle / probe-build','angle','angle',''),
            @('boot-image','boot-image / compile','boot_image','boot_image',''),
            @('webview','webview / build','webview','webview',''),
            @('exec','exec / exec','exec','exec',''),
            @('media','media / media','media','media',''),
            @('surfaces','surfaces / apps','surfaces','surfaces',''),
            @('native2','native2 / native2','native2','native2','native2')
          )
          foreach ($role in $roles) {
            $destination = "ci-suppliers/$($role[2])"
            python tools/ci/artifact_receipt.py --name $role[0] --producer $role[1] --destination $destination
            if ($LASTEXITCODE -ne 0) { throw "Prior receipt failed: $($role[0])" }
            Observe "receipt-$($role[0])"
            $params = @('tools/surface/assemble-artifacts.py','--source',$destination,'--destination','dist','--ledger','ci-owners.json','--owner',$role[3])
            if ($role[4]) { $params += @('--prefix',$role[4]) }
            python @params
            if ($LASTEXITCODE -ne 0) { throw "Prior assembly failed: $($role[0])" }
            Observe "assembly-$($role[0])"
          }
          python tools/web3/host_roles.py verify --dist dist
          if ($LASTEXITCODE -ne 0) { throw 'Prior role verification failed' }
          Observe 'after-role-verification'
      - name: Checkout reviewed diagnostic runner separately
        uses: actions/checkout@v4
        with:
          ref: 7fefa7ab
          path: diagnostic-source
          persist-credentials: false
          sparse-checkout: tests/windows/run-tests.ps1
          sparse-checkout-cone-mode: false
      - name: Run historical normal suite with diagnostic-only observations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRun = $env:GITHUB_RUN_ID
          $source = 'fad0eff2f73215235769566b4c0304c844598195'
          if ((git rev-parse HEAD).Trim() -cne $source) { throw 'Wrong historical checkout' }
          $diagnostic = 'diagnostic-source/tests/windows/run-tests.ps1'
          $expectedDiagnostic = '5cd7114fb3199259bbccbb1f71a75bd7546d6470'
          if ((git hash-object -- $diagnostic).Trim() -cne $expectedDiagnostic) { throw 'Diagnostic runner blob mismatch' }
          Copy-Item -LiteralPath $diagnostic -Destination tests/windows/diagnostic-run-tests.ps1
          if ((git hash-object -- tests/windows/diagnostic-run-tests.ps1).Trim() -cne $expectedDiagnostic) { throw 'Diagnostic runner copy mismatch' }
          if ((git hash-object -- tests/windows/run-tests.ps1).Trim() -cne (git rev-parse HEAD:tests/windows/run-tests.ps1).Trim()) { throw 'Original tracked runner changed' }
          Write-Host "HISTORICAL_SUITE_DIAGNOSTIC current_run=$actualRun supplier_run=40865138716 attempt=1 source=$source runner_blob=$expectedDiagnostic; diagnostic only, not current qualification"
          $env:GITHUB_RUN_ID = '40865138716'
          $env:GITHUB_RUN_ATTEMPT = '1'
          $env:GITHUB_SHA = $source
          $env:GITHUB_WORKFLOW = 'ci'
          $env:GITHUB_EVENT_NAME = 'workflow_dispatch'
          pwsh -NoProfile -File tests/windows/diagnostic-run-tests.ps1 dist -Web3Observer dist/web3_process_waits.exe
          exit $LASTEXITCODE
