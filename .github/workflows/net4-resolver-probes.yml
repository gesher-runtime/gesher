name: net4-resolver-probes
on:
  workflow_dispatch:
  push:
    branches: ['wip/net4-resolver']
    paths:
      - '.github/workflows/net4-resolver-probes.yml'
      - 'compat/posix/src/netdb.cc'
      - 'compat/posix/src/winsock.cc'
      - 'compat/posix/src/socket_internal.h'
      - 'compat/posix/include/netdb.h'
      - 'compat/bionic/socket_bionic.cc'
      - 'tests/windows/net/LegacyResolverOracle.ps1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LLVM_MINGW_TAG: '20261006'
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: ~/toolchain
          key: ${{ env.LLVM_MINGW_NAME }}
      - name: Fetch the pinned toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" | tar -xJ -C ~/toolchain
      - name: Compile the actual resolver and System V bridge with production flags
        run: |
          set -euo pipefail
          cxx="$HOME/toolchain/$LLVM_MINGW_NAME/bin/x86_64-w64-mingw32-clang++"
          flags=(-std=c++20 -mno-ms-bitfields -fno-exceptions -fsized-deallocation -Wall -Wextra -Werror
            -DGESHER -DUSE_MINGW -DWIN32_LEAN_AND_MEAN -DNOMINMAX -DNOGDI -D_USE_MATH_DEFINES
            -D__STDC_FORMAT_MACROS -D__STDC_CONSTANT_MACROS -D__STDC_LIMIT_MACROS
            -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00 -D_FILE_OFFSET_BITS=64 -D_POSIX_THREAD_SAFE_FUNCTIONS
            -Icompat/posix/include -Icompat/bionic/include)
          mkdir -p out
          for source in compat/posix/src/netdb.cc compat/posix/src/winsock.cc compat/bionic/socket_bionic.cc; do
            "$cxx" "${flags[@]}" -c "$source" -o "out/$(basename "$source").obj"
            echo "PASS net4 resolver compile: $source; llvm-mingw; Werror; exceptions disabled"
          done
  oracle:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run only the independent WinSDK oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oracle = Join-Path $env:RUNNER_TEMP 'net4-resolver-oracle.txt'
          & ./tests/windows/net/LegacyResolverOracle.ps1 -Destination $oracle
          if (@(Get-Content -LiteralPath $oracle).Count -ne 8) { throw 'incomplete WinSDK rows' }
          Write-Host 'PASS net4 resolver oracle: actual WinSDK host/service decoding; no Gesher runtime loaded'
