name: binder2-sg-compile

# Early compile-only feedback, not a runtime/leaf/full acceptance workflow.
# This path trigger permits first registration from the owned work branch.
on:
  push:
    branches: ['wip/binder2-sg']
    paths: ['.github/workflows/binder2-sg-compile.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
  NDK_VERSION: "27.2.12479018"
  NDK_ZIP: android-ndk-r27c-linux.zip
  NDK_DIR: android-ndk-r27c

concurrency:
  group: binder2-sg-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - name: Compile actual client, broker and independent host actors under Werror
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          ninja -C out CMakeFiles/gesher_posix.dir/compat/posix/src/binder.cc.obj
          ninja -C out binderd binder_sg_actor binder_sg_wire_peer
          echo 'Compile-only: no native fixture has executed; runtime and full gates remain pending.'
  android-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: ndk
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Fetch pinned Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/$NDK_ZIP"
          unzip -q ndk.zip
          test -d "$NDK_DIR"
      - name: Compile shared actor for both actual Android ABIs under Werror
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          bin="$PWD/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out-sg-compile
          for triple in x86_64-linux-android aarch64-linux-android; do
            "$bin/${triple}29-clang++" -std=c++20 -Wall -Wextra -Werror -O2 \
              -c tests/binder/sg-actor.cc -o "out-sg-compile/$triple.o"
          done
          echo 'Compile-only: no ART/APK/ELF fixture has executed; all semantic gates remain pending.'
