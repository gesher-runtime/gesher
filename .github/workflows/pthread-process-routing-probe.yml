          if ($LASTEXITCODE -ne 0) { throw 'Original-recheck producer ZIP verification failed' }
          python tools/host-pthread-authority/probe_legacy_bundle.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Original-recheck role verification failed' }
      - name: Forced original recheck control
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stdout=Join-Path $env:RUNNER_TEMP 'legacy-rw.out'; $stderr=Join-Path $env:RUNNER_TEMP 'legacy-rw.err'
          $start=@{FilePath=(Join-Path $pwd 'routing-probe-legacy/sync-init-gate.exe'); WorkingDirectory=(Join-Path $pwd 'routing-probe-legacy'); WindowStyle='Hidden'; PassThru=$true; RedirectStandardOutput=$stdout; RedirectStandardError=$stderr; ArgumentList=@('--original-recheck')}
          $process=Start-Process @start
