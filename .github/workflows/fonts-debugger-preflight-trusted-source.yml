name: fonts-debugger-preflight-trusted-source
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FONTS_DEBUGGER_PREFLIGHT_CALLER_COMMIT: ${{ vars.FONTS_DEBUGGER_PREFLIGHT_CALLER_COMMIT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve full CORE ENV HOST and verify exact bounded preflight source authority
        shell: bash
        run: |
          python3 -I - <<'PY'
          """Immutable supported-tool prerequisite; never host/font/runtime acceptance."""
          import ast,copy,hashlib,json,os,re,subprocess,sys,textwrap,urllib.request
          from pathlib import Path
          BASE='78ff47fadc8ff3d15133a892ca6dbb45bdca2264'
          HOST_GUARD='267bb2f7868dd85405e9336d3ec29a131535d7eb'
          HOST_TRUST='.github/workflows/fonts-owner-host-trusted-source.yml'
          HOST_GUARD_BLOB='399d2ffdf430dce00634021ddd4d21553ee7d262'
          TEMPLATE='833f29c0e80e17383ced0ee7940cfaba56a153d0'
          CALLER='.github/workflows/fonts-debugger-preflight-component.yml'
          TRUST='.github/workflows/fonts-debugger-preflight-trusted-source.yml'
          REPO='gesher-runtime/gesher'
          EXTRA_PINS={'tests/fonts-debugger-preflight/probe.cc': 'b658a210b5e0abfd30e0bcb102c50e0ea4bc2cc2', 'tools/fonts/debugger-probe.py': '91f338af75ac02add2c8b4ce190c676c25fcb050', 'tools/fonts/test-debugger-probe.py': 'd47940b6e2e72cf632c15bec7bc93a6de4be67fb', 'tools/fonts/debugger-preflight.ps1': '8603d7f93d3e0cbc7106f1d36b357f008abe8c2e', 'tools/fonts/test-debugger-preflight.ps1': '649049f2684cf5b94dd9c127b28649dd4ac36050'}
          def require(value,message):
           if not value:raise RuntimeError(message)
          def git(*args):return subprocess.check_output(['git',*args])
          def reject(label,fn):
           try:fn()
           except (RuntimeError,KeyError):print('FONT_DEBUGGER_NEGATIVE '+label+'=rejected',flush=True)
           else:raise RuntimeError('Negative accepted: '+label)
          def frozen_host():
           raw=git('show',HOST_GUARD+':'+HOST_TRUST)
           require(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==HOST_GUARD_BLOB and raw==git('show',BASE+':'+HOST_TRUST),'Immutable host guard differs')
           code=textwrap.dedent(raw.decode().split("          python3 -I - <<'PY'\n",1)[1].rsplit('\n          PY',1)[0]);tree=ast.parse(code)
           defs=[n for n in tree.body if not(isinstance(n,ast.Expr) and isinstance(n.value,ast.Call) and isinstance(n.value.func,ast.Name) and n.value.func.id=='main')]
           host={};exec(compile(ast.Module(body=defs,type_ignores=[]),'immutable-host-guard','exec'),host)
           full=host['frozen_environment']();inventory=full['inventory'];expected=inventory(host['BASE']);actual=inventory(BASE)
           for p,b in host['EXTRA_PINS'].items():expected[p]=(expected.get(p,('100644',''))[0],b)
           for p in (host['CALLER'],host['TRUST']):expected[p]=actual[p]
           full['verify_tree'](actual,expected)
           for p in host['EXTRA_PINS']:
            bad=copy.deepcopy(actual);bad[p]=('100644','0'*40);reject('frozen_host_blob_'+p,lambda:full['verify_tree'](bad,expected))
           bad=copy.deepcopy(actual);bad['tools/fonts/forged-debugger.py']=('100644','0'*40);reject('frozen_host_unknown',lambda:full['verify_tree'](bad,expected))
           template=git('show',host['TEMPLATE']+':'+host['CALLER']);needle=b'fonts-owner-host-trusted-source.yml@'+b'0'*40
           require(template.count(needle)==1 and git('show',BASE+':'+host['CALLER'])==template.replace(needle,b'fonts-owner-host-trusted-source.yml@'+HOST_GUARD.encode()),'Frozen host producer/five-mode/WCT DAG differs')
           print('FONT_DEBUGGER_FROZEN_SOURCE full_CORE_ENV_HOST=UNCHANGED base='+BASE+' host_pins='+str(len(host['EXTRA_PINS']))+' host_WCT_Windows2025_qualified=false',flush=True)
           return full

          def run_identity(run,source,run_id,attempt,event):
           require(run['repository']['full_name']==run['head_repository']['full_name']==REPO and run['repository']['id']==run['head_repository']['id']==1426153186,'Wrong preflight repositories')
           require(str(run['id'])==run_id and str(run['run_attempt'])==attempt and run['head_sha']==source,'Wrong preflight source/run/attempt')
           require(run['name']=='fonts-debugger-preflight-component' and run['path']==CALLER and run['event']==event and event in ('push','workflow_dispatch') and run['head_branch']=='wip/fonts-debugger-preflight','Wrong preflight workflow/event/ref')
           require(run['actor']['login']==run['triggering_actor']['login']=='palmoni5','Wrong preflight actor')
          def caller_authority(value):
           require(bool(re.fullmatch('[0-9a-f]{40}',value)),'Missing dedicated preflight caller authority')
           require(git('cat-file','-t',value).strip()==b'commit','Preflight authority is not a commit')
           return git('show',value+':'+CALLER)
          def main():
           require(os.environ.get('GITHUB_ACTIONS')=='true' and os.environ['GITHUB_REPOSITORY']==REPO,'CI repository only')
           source=os.environ['GITHUB_SHA'];run_id=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT'];event=os.environ['GITHUB_EVENT_NAME']
           require(os.environ['GITHUB_REF']=='refs/heads/wip/fonts-debugger-preflight' and git('rev-parse','HEAD').decode().strip()==source,'Wrong preflight source/ref')
           request=urllib.request.Request('https://api.github.com/repos/'+REPO+'/actions/runs/'+run_id,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(request,timeout=60) as response:run=json.load(response)
           print('FONT_DEBUGGER_RUN_IDENTITY '+json.dumps({'expected':{'source':source,'run':run_id,'attempt':attempt,'workflow':'fonts-debugger-preflight-component','path':CALLER,'repository':REPO,'actor':'palmoni5'},'received':{key:run.get(key) for key in ('id','run_attempt','head_sha','name','path','head_branch','event','actor','triggering_actor')}},sort_keys=True),flush=True)
           run_identity(run,source,run_id,attempt,event)
           for field,value in (('id',-1),('run_attempt',-1),('head_sha','0'*40),('name','ci'),('path','forged.yml'),('event','schedule'),('head_branch','main')):
            bad=copy.deepcopy(run);bad[field]=value;reject('actual_run_'+field,lambda:run_identity(bad,source,run_id,attempt,event))
           for field in ('repository','head_repository'):
            bad=copy.deepcopy(run);bad[field]['id']=-1;reject('actual_run_'+field,lambda:run_identity(bad,source,run_id,attempt,event))
           for field in ('actor','triggering_actor'):
            bad=copy.deepcopy(run);bad[field]['login']='wrong';reject('actual_run_'+field,lambda:run_identity(bad,source,run_id,attempt,event))
           reviewed=os.environ.get('FONTS_DEBUGGER_PREFLIGHT_CALLER_COMMIT','');approved=caller_authority(reviewed)
           require(git('show',source+':'+CALLER)==approved,'Preflight caller differs from independent authority')
           for value in ('','x'*40,source+':policy'):reject('malformed_preflight_authority',lambda:caller_authority(value))
           reject('unapproved_template',lambda:require(caller_authority(TEMPLATE)==approved,'Unpinned preflight template not approved'))
           refs=re.findall(rb'(?m)^    uses: gesher-runtime/gesher/\.github/workflows/fonts-debugger-preflight-trusted-source\.yml@([0-9a-f]{40})$',approved)
           require(len(refs)==1,'One immutable preflight guard required');guard=refs[0].decode()
           require(git('show',guard+':'+TRUST)==git('show',reviewed+':'+TRUST),'Preflight immutable guard differs')
           template=git('show',TEMPLATE+':'+CALLER);needle=b'fonts-debugger-preflight-trusted-source.yml@'+b'0'*40
           require(template.count(needle)==1 and approved==template.replace(needle,b'fonts-debugger-preflight-trusted-source.yml@'+guard.encode()),'Preflight exact role/producer/tool-only DAG differs')
           full=frozen_host();inventory=full['inventory'];expected=inventory(BASE)
           subprocess.run(['git','merge-base','--is-ancestor',BASE,source],check=True)
           for p,b in EXTRA_PINS.items():expected[p]=(expected.get(p,('100644',''))[0],b)
           for p in (CALLER,TRUST):expected[p]=inventory(reviewed)[p]
           actual=inventory(source);full['verify_tree'](actual,expected);full['verify_checkout'](expected)
           for p in EXTRA_PINS:
            bad=copy.deepcopy(actual);bad[p]=('100644','0'*40);reject('preflight_blob_'+p,lambda:full['verify_tree'](bad,expected))
           bad=copy.deepcopy(actual);bad['tools/fonts/forged.py']=('100644','0'*40);reject('unknown_preflight_path',lambda:full['verify_tree'](bad,expected))
           retained=('.github/workflows/ci.yml',HOST_TRUST,'.github/workflows/fonts-owner-host-component.yml','.github/workflows/fonts-environment-trusted-source.yml','.github/workflows/fonts-environment-characterization.yml','.github/workflows/fonts-core-trusted-source.yml','.github/workflows/fonts-core-component.yml','tools/native3-locks/union_payload.py','tools/native3-locks/union_blocking_guard.py')
           for p in retained:
            bad=copy.deepcopy(actual);bad[p]=('100644','0'*40);reject('retained_policy_'+p,lambda:full['verify_tree'](bad,expected))
           require(sys.flags.isolated==1 and all(Path(m.__file__).resolve().parent!=Path.cwd() for m in (json,hashlib)),'Candidate shadow module imported')
           originals={p:Path(p).read_bytes() for p in (CALLER,TRUST,*retained)}
           try:
            for p in originals:Path(p).write_bytes(b'pass\n')
            reject('actual_noop_preflight_all_prior_callers_guards',lambda:full['verify_checkout'](expected))
           finally:
            for p,raw in originals.items():Path(p).write_bytes(raw)
           full['verify_checkout'](expected);full['isolated_import_controls']()
           require(not git('status','--porcelain','--untracked-files=all').strip(),'Dirty preflight checkout')
           print('FONT_DEBUGGER_TRUSTED_SOURCE '+json.dumps({'source':source,'run':run_id,'attempt':attempt,'immutable_guard':guard,'caller_authority':reviewed,'frozen_host_source':BASE,'extra_pins':EXTRA_PINS,'roles':{'probe':'CURRENT_SOURCE_CURRENT_ATTEMPT_HARMLESS_CRT_CHILD','Windows':'STAGED_SIGNED_COPY_FROM_REGISTERED_SDK_OBSERVATION_AND_SAME_CHILD_QD_ONLY'},'font_owner_qualified':False,'host_WCT_Windows2025_qualified':False,'private_CRT_owner_symbols_qualified':False,'full_qualification':False},sort_keys=True),flush=True)
          main()
          PY
      - name: Retain all existing compiler and artifact ownership metadata controls
        shell: bash
        run: |
          python3 tools/fonts/test-core-assembly.py
          python3 tools/fonts/test-cli-link-evidence.py
          python3 tools/fonts/test-environment-metadata.py
          python3 tools/fonts/test-owner-host-evidence.py
          python3 tools/fonts/test-debugger-probe.py
      - name: Retain old argument contracts and verify preflight metadata without processes
        shell: pwsh
        run: |
          tools/fonts/test-dex-arguments.ps1
          tools/fonts/test-environment-arguments.ps1
          tools/fonts/test-owner-host-arguments.ps1
          tools/fonts/test-debugger-preflight.ps1
