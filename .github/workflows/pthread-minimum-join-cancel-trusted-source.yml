name: pthread-minimum-join-cancel-trusted-source
on:
  workflow_call:
    outputs:
      source:
        value: ${{ jobs.verify.outputs.source }}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.gate.outputs.source }}
    env:
      GH_TOKEN: ${{ github.token }}
      PTHREAD_MINIMUM_JOIN_CANCEL_CALLER_COMMIT: ${{ vars.PTHREAD_MINIMUM_JOIN_CANCEL_CALLER_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Immutable isolated collector source gate
        id: gate
        shell: bash
        run: |
          python3 -I -B - <<'PYCODE'
          import hashlib, subprocess, types
          pins = {'.github/workflows/pthread-minimum-join-cancel-component.yml': '7a185ee3dde22979e1d822d1920670fccb00756f', 'docs/handoff/tracks/pthread-minimum-join-cancellation-candidate.md': 'b759b9af53276db0b14999ea169c51218dd71d57', 'tests/native/host_pthread_minimum_join_cancel_candidate.c': 'f2b98089501d10e68f87fbea1d0bc8b078b1c421', 'tools/host-pthread-authority/audit-minimum-join-witness-source.py': 'c37807322d9e39b072b4db062fe5db693f4d6c34', 'tools/host-pthread-authority/collect-minimum-join-object-wip.sh': 'aeea25a46e7b6d2b43c1ca26f8daf17e86ef80a3', 'tools/host-pthread-authority/minimum-join-wait-diagnostic.patch': 'a2fd3b530c2cb0cd8738103a974cf99fe2f31c23', 'tools/host-pthread-authority/minimum_join_identity_candidate.py': 'cbfd303eda3a0b1d827ebc28bea0c6fae6a96a59', 'tools/host-pthread-authority/run-minimum-join-cancel-candidate.ps1': 'd0b5f35c06e11289f12594e29e03a6693d39e663', 'tools/host-pthread-authority/test_minimum_join_identity_candidate.py': '4cfa840d4a48dae49685631486b09fd4d0179d4f', 'tools/host-pthread-authority/minimum_join_collector_policy.py': '69be465ceed3d3f02583d0bfdace49e01bd1f952'}
          policy = '69be465ceed3d3f02583d0bfdace49e01bd1f952'
          raw = subprocess.check_output(['git','cat-file','blob',policy])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==policy
          module=types.ModuleType('immutable_collector_gate')
          exec(compile(raw,'immutable-collector-gate','exec'),module.__dict__)
          module.gate(pins)
          PYCODE
