        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name web3-query-hook --producer "build" --destination ci-suppliers/web3_query_hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/web3_query_hook --destination dist --ledger ci-owners.json --owner web3_query_hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact same-source compiler roles, source boundaries and coherent payload
        shell: pwsh
        run: |
          python tools/web3/host_roles.py verify --dist dist --hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'core-oj.jar','core-libart.jar','core-icu4j.jar','framework.jar','gesher-app.jar',
                             'web3-query-tests.dex','web3app.apk','gesher_arm64.dll','web3_network.so','web3_network_arm64.so') {
            if (-not (Test-Path -LiteralPath (Join-Path dist $name))) { throw "Missing current full query payload $name" }
            Write-Host "ACTUAL_WEB3_FULL_MEMBER name=$name sha256=$((Get-FileHash -LiteralPath (Join-Path dist $name) -Algorithm SHA256).Hash) source=${{ github.sha }}"
          }
          foreach ($image in 'boot','boot-core-libart','boot-core-icu4j','boot-framework','boot-gesher-app') {
            foreach ($extension in 'art','oat','vdex') {
              $file = "dist/framework/x86_64/$image.$extension"
              if (-not (Test-Path -LiteralPath $file)) { throw "Missing current full image $file" }
              Write-Host "ACTUAL_WEB3_FULL_IMAGE member=$image.$extension sha256=$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash) source=${{ github.sha }}"
            }
          }
      - name: Actual unwrapped failure and corrected monitor owner join, cancellation, VM and original14 gates
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows/run-web3-query-component.ps1 -Dir "$PWD/dist" -RuntimeExe "$PWD/dist/dalvikvm-web3-query-test.exe" | Tee-Object -FilePath web3-query-results.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web3-query-full-logs-${{ matrix.os }}
          path: |
            web3-query-results.txt
            ${{ runner.temp }}/web3-query-component-${{ github.run_id }}/**
          if-no-files-found: warn

