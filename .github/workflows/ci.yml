name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # framework.yml finds host tools other branches built

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  dns-full-preflight:
    uses: gesher-runtime/gesher/.github/workflows/net-dns-full-preflight.yml@30ec423526a34a11f1adebd1f060f6c374e04ac8

  artifact-preflight:
    needs: [dns-full-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strict archive adversarial controls
        run: |
          python3 tools/ci/receipt_identity.py
          python3 tools/surface/test-verified-artifact.py

  # Everything is cross-compiled on Linux with llvm-mingw, then executed on
  # real Windows runners.
  build:
    needs: [artifact-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          # The former runtime-port job's cache already holds the runtime.
          ccache-key: runtime

      - name: Build the separate bounded native teardown observer
        run: bash tools/web3/build-teardown-probe.sh "$HOME/toolchain/$LLVM_MINGW_NAME"

      - name: Build
        run: |
          # Canonical suite/package/e2e always receive the production role.
          cmake -S . -B out -DGESHER_WEB3_QUERY_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Compile/link ordered spawn setup and its actual no-console caller first.
          ninja -C out exec4_no_console_probe gesher-exec
          # Check the new native format ABI bridge before the full AOSP graph.
          ninja -C out CMakeFiles/gesher_media_format.dir/compat/media/ndk/media_format.cc.obj
          ninja -C out surface_invalidation_test
          ninja -C out CMakeFiles/gesher_media_muxer.dir/compat/media/ndk/media_muxer.cc.obj
          ninja -C out media_muxer_verify
          ninja -C out CMakeFiles/oatdump.dir/third_party/aosp/art/oatdump/oatdump.cc.obj
          # Validate changed after-app shared-library matching before the full graph.
          ninja -C out CMakeFiles/art_runtime.dir/third_party/aosp/art/runtime/class_loader_context.cc.obj
          # Compile the new bridge before the full runtime to expose its
          # header/ABI errors without waiting for every AOSP object.
          ninja -C out CMakeFiles/gesher_native_fonts.dir/compat/bionic/native_fonts.cc.obj
          ninja -C out CMakeFiles/gesher_bionic_unicode.dir/compat/bionic/unicode_bionic.cc.obj
          ninja -C out CMakeFiles/gesher_bionic_unicode.dir/compat/bionic/unicode_width.cc.obj
          ninja -C out native3_unicode_test
          ninja -C out native3_cpu_clock_test
          ninja -C out

      - name: Build and isolate ordinary Binder host actor under production OFF
        run: |
          ninja -C out binder_sg_actor
          mkdir -p dist-binder-sg-host
          mv out/binder_sg_actor.exe dist-binder-sg-host/
          test ! -e out/binder_sg_wire_peer.exe
          printf '%s\n' "$GITHUB_SHA" > dist-binder-sg-host/binder-sg-runtime-source.txt

      - name: Build and isolate bounded Native lock fixtures under production OFF
        run: |
          ninja -C out native3_lock_command_worker native3_lock_duplicate_test
          mkdir dist-native3-locks
          mv out/native3_lock_command_worker.exe out/native3_lock_duplicate_test.exe dist-native3-locks/
          cp out/binderd.exe dist-native3-locks/
          for target in native3_lock_command_worker native3_lock_duplicate_test binderd; do
            "$HOME/toolchain/$LLVM_MINGW_NAME/bin/llvm-readobj" --coff-imports "dist-native3-locks/$target.exe" > "dist-native3-locks/$target.imports.txt"
          done
          test ! -e out/native3_lock_command_worker.exe
          test ! -e out/native3_lock_duplicate_test.exe

      - name: Check assembly boundaries use the System V ABI
        run: python3 tools/abi-check.py out third_party/aosp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test apps
        run: tests/build-test-apps.sh out/test-apps

      - name: Build boot class path (core-oj, core-libart)
        run: tools/build-boot-jars.sh out/boot-jars

      - name: Build the framework's resources (framework-res.apk)
        run: tools/build-framework-res.sh out/framework-res

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/*.exe out/dalvikvm.map out/dex2oat.map out/test-apps/* out/boot-jars/*.jar dist/
          cp dist-web3-observer/web3_process_waits.exe dist/
          # ICU's data, which the runtime maps from $ANDROID_I18N_ROOT/etc/icu.
          cp third_party/aosp/external/icu/icu4c/source/stubdata/icudt*l.dat dist/
          # The system fonts and fonts.xml, for $ANDROID_ROOT (docs/fonts.md).
          tools/fonts/collect-fonts.sh third_party/aosp dist
          # Time zone data, for $ANDROID_TZDATA_ROOT (docs/posix.md).
          compat/libcore/collect-tzdata.sh third_party/aosp dist
          # Android's CA certificates and the networking libraries' licenses (docs/network.md).
          tools/net/collect.sh third_party/aosp dist
          ls -la dist

      - name: Freeze default-OFF production role and unchanged shared-code boundary
        run: python3 tools/web3/host_roles.py capture-production --build out --dist dist --state out/web3-production-state.json

      - name: Bind isolated ordinary Binder actor to exact production compiler and source
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,sys,shutil
          from pathlib import Path
          sys.path.insert(0,str(Path('tools/web3').resolve()))
          import host_roles
          root=Path('dist-binder-sg-host')
          production=json.loads(Path('dist/web3-production-role.json').read_text())
          manifest=host_roles.context()
          assert host_roles.cache(Path('out'))['GESHER_WEB3_QUERY_TESTS']=='OFF'
          assert production['role']=='production' and production['test_hook_compiled'] is False
          manifest.update(role='binder-ordinary-actor', compiler=production['compiler'],
                          production_runtime_sha256=production['executable_sha256'])
          actor_source=Path('tests/binder/sg-actor.cc').resolve()
          actor_commands=[argv for key,argv in host_roles.commands(Path('out')).items() if Path(key[1]).resolve()==actor_source]
          assert len(actor_commands)==1, 'Missing or ambiguous actual actor compile command'
          argv=actor_commands[0]
          configured=production['compiler']['configured_driver']
          actor_launcher=None
          if argv[0]!=configured:
              actual_launcher=shutil.which(argv[0])
              assert len(argv)>1 and argv[1]==configured and actual_launcher and production['compiler']['launcher'], 'Actor compiler differs from production'
              actor_launcher=str(Path(actual_launcher).resolve())
              assert actor_launcher==production['compiler']['launcher'], 'Actor launcher differs from production'
          manifest['actor_compile_command']=argv
          manifest['actor_launcher']=actor_launcher
          manifest['files']={p.name:host_roles.sha(p) for p in root.iterdir() if p.is_file()}
          manifest['sources']={p:host_roles.sha(p) for p in (
              'compat/posix/src/binder.cc','compat/posix/src/binder_sg.h','compat/posix/src/binder_wire.h',
              'compat/binder/binderd.cc','cmake/aosp/servicemanager.cmake','tests/binder/sg-actor.cc',
              'tests/binder/sg-actor.h','tests/binder/run-modes.ps1','tests/binder/OutputPageObserver.cs')}
          (root/'binder-host-source.json').write_text(json.dumps(manifest,sort_keys=True))
          assert not Path('dist/binder_sg_actor.exe').exists() and not Path('dist/binder_sg_wire_peer.exe').exists()
          PYCODE

      - name: Bind isolated Native fixtures to the actual current production compiler and source
        run: python3 tools/native3-locks/current_payload.py host

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binder2-sg-host
          path: dist-binder-sg-host/

      - uses: actions/upload-artifact@v4
        with:
          name: native3-locks-host
          path: dist-native3-locks/
          if-no-files-found: error

      - name: Build separately named same-source query-hook runtime after production package is sealed
        run: |
          cmake -S . -B out -DGESHER_WEB3_QUERY_TESTS=ON
          ninja -C out dalvikvm
          python3 tools/web3/host_roles.py capture-hook --build out --dist dist --state out/web3-production-state.json --out dist-web3-query
      - uses: actions/upload-artifact@v4
        with:
          name: web3-query-hook
          path: dist-web3-query/
          if-no-files-found: error

  native3-locks-reference:
    needs: [artifact-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Actual Linux161 reference from the identical current worker/controller
        run: python3 tools/native3-locks/current_payload.py reference
      - uses: actions/upload-artifact@v4
        with:
          name: native3-locks-reference
          path: native3-reference/
          if-no-files-found: error

  native3-locks-regression:
    needs: [build, native3-locks-reference]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Strict current Native host and independent Linux reference suppliers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/artifact_receipt.py --name native3-locks-host --producer build --destination ci-suppliers/native3_host
          if ($LASTEXITCODE -ne 0) { throw 'Current typed Native host archive failed' }
          python tools/ci/artifact_receipt.py --name native3-locks-reference --producer native3-locks-reference --destination ci-suppliers/native3_reference
          if ($LASTEXITCODE -ne 0) { throw 'Current Linux reference archive failed' }
      - name: Actual Native whole-member source and role rejection controls
        shell: pwsh
        run: |
          python tools/native3-locks/current_payload.py controls --host ci-suppliers/native3_host --reference ci-suppliers/native3_reference
          if ($LASTEXITCODE -ne 0) { throw 'Current Native supplier controls failed' }
      - name: Verify and assemble exact current Native production-compiler fixture roles
        shell: pwsh
        run: |
          python tools/native3-locks/current_payload.py verify --host ci-suppliers/native3_host --reference ci-suppliers/native3_reference
          if ($LASTEXITCODE -ne 0) { throw 'Current Native payload/source/compiler manifest failed' }
      - name: Mandatory161 strict rows all4 actual evidence routes and13 resource modes
        shell: pwsh
        run: tests/windows/run-native3-locks-current.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native3-locks-full-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/commands.stdout.txt
            ${{ runner.temp }}/commands.stderr.txt
            command-fixture/windows-actual.json
            command-fixture/windows-duplicates.json
            command-fixture/stdio-evidence.json
            ci-suppliers/native3_host/provenance.json
            ci-suppliers/native3_reference/provenance.json
          if-no-files-found: warn

  # framework.jar's pipeline (host tools, coremod, framework-res, then
  # tools/framework/build.py): .github/workflows/framework.yml, which also
  # runs on its own (gh workflow run framework --ref <branch>).
  framework:
    needs: [artifact-preflight]
    uses: ./.github/workflows/framework.yml

  # Phase 6 (native libraries): the Android NDK test .so files, built on the
  # Linux runner. .github/workflows/native-libs.yml, which also runs on its own.
  native-libs:
    needs: [artifact-preflight]
    uses: ./.github/workflows/native-libs.yml

  # Android ELF executables run as processes (docs/exec.md): the NDK test
  # executable and gesher.ExecTest's dex: .github/workflows/exec.yml.
  exec:
    needs: [artifact-preflight]
    uses: ./.github/workflows/exec.yml

  # The core libraries' own unit tests (AOSP's cc_test modules), built for
  # the test job: .github/workflows/libs.yml.
  libs:
    needs: [artifact-preflight]
    uses: ./.github/workflows/libs.yml

  # Phase 7 (arm64 translation): gesher_arm64.dll, the arm64 translator
  # (dynarmic) dalvikvm LoadLibrary()s for arm64-v8a apps (docs/arm64.md,
  # ADR 0047). .github/workflows/arm64.yml, which also runs on its own.
  arm64:
    needs: [artifact-preflight]
    uses: ./.github/workflows/arm64.yml

  # The native2 track's NDK test programs (shim extras, platform dlopen,
  # popular NDK libraries' self-tests): .github/workflows/native2.yml.
  native2:
    needs: [artifact-preflight]
    uses: ./.github/workflows/native2.yml

  # ART's own gtests for libartbase and libdexfile (docs/posix.md):
  # .github/workflows/posix.yml, which also runs on its own.
  posix:
    needs: [artifact-preflight]
    uses: ./.github/workflows/posix.yml

  # Skia, hwui and the graphics probes (docs/graphics.md):
  # .github/workflows/graphics.yml, which also runs on its own.
  graphics:
    needs: [artifact-preflight]
    uses: ./.github/workflows/graphics.yml

  # ANGLE's libEGL.dll and libGLESv2.dll (GLES over Direct3D 11) and their
  # probe (docs/angle.md): .github/workflows/angle.yml, which also runs on its own.
  angle:
    needs: [artifact-preflight]
    uses: ./.github/workflows/angle.yml

  # android.webkit.WebView on WebView2 (docs/webview.md): the WebView2 probes
  # and webapp.apk (built from the framework job's artifacts):
  # .github/workflows/webview.yml, which also runs on its own.
  webview:
    needs: [framework]
    uses: ./.github/workflows/webview.yml
    with:
      apk: true

  # Gesher's boot image (docs/boot-image.md): dex2oat.exe from the build job
  # compiles the boot class path on Windows: .github/workflows/boot-image.yml.
  boot-image:
    needs: [build, framework]
    uses: ./.github/workflows/boot-image.yml

  # Media (docs/media.md): the media track's test apps, built against this
  # run's framework classes: .github/workflows/media.yml.
  media:
    needs: [framework]
    uses: ./.github/workflows/media.yml

  # The surfaces track's NDK test app (surfacegl.apk: EGL into a SurfaceView):
  # .github/workflows/surfaces.yml.
  surfaces:
    needs: [artifact-preflight]
    uses: ./.github/workflows/surfaces.yml

  # What is left of porting ART's x86-64 assembly to Windows; informational.
  asm-port:
    needs: [artifact-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache AOSP sources
        uses: actions/cache@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Fetch AOSP sources
        run: tools/fetch-aosp.sh

      - name: Report
        run: |
          python3 tools/asm-port-report.py third_party/aosp | tee asm-report.md
          cat asm-report.md >> "$GITHUB_STEP_SUMMARY"

  # The Windows installer (tools/package/gesher.iss), installed and tried on a
  # clean runner: Hello through the installed `gesher` command, then uninstall.
  package:
    needs: [build, framework, graphics, angle, boot-image, media, arm64]
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/package
            tools/ci
            tools/surface
            tools/web3
            tests/windows/shell
            tests/windows/graphics

      - name: Verify and assemble windows-x64 artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name windows-x64 --producer "build" --destination ci-suppliers/windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/windows_x64 --destination dist --ledger ci-owners.json --owner windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble framework artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name framework --producer "framework / framework" --destination ci-suppliers/framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/framework --destination dist --ledger ci-owners.json --owner framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble graphics artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name graphics --producer "graphics / build" --destination ci-suppliers/graphics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/graphics --destination dist --ledger ci-owners.json --owner graphics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble angle artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name angle --producer "angle / probe-build" --destination ci-suppliers/angle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/angle --destination dist --ledger ci-owners.json --owner angle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble arm64 artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name arm64 --producer "arm64 / build" --destination ci-suppliers/arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/arm64 --destination dist --ledger ci-owners.json --owner arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble boot-image artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name boot-image --producer "boot-image / compile" --destination ci-suppliers/boot_image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/boot_image --destination dist --ledger ci-owners.json --owner boot_image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Gesher's default sounds (docs/media.md): dist/media/audio.
      - name: Verify and assemble media artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name media --producer "media / media" --destination ci-suppliers/media
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/media --destination dist --ledger ci-owners.json --owner media
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer input is production-only and excludes the query fixture
        shell: pwsh
        run: |
          python tools/web3/host_roles.py verify --dist dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = "0.1.${{ github.run_number }}"
          & $iscc /Qp "/DBuildDir=$PWD\dist" "/DAppVersion=$version" "/O$PWD\installer" tools\package\gesher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      # Uploaded before the checks below: the e2e job tests this installer even when one
      # of them fails.
      - name: Upload tested installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesher-setup
          path: installer/*.exe

      - name: Install, run Hello, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\gesher-setup-*.exe).FullName
          # Every run of the installed Gesher below must load the installed boot
          # image (docs/boot-image.md): without it the runtime fails instead of
          # falling back to imageless running, and it says what it loaded.
          $env:GESHER_REQUIRE_BOOT_IMAGE = '1'
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Gesher'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' -contains $app)) { throw "PATH lacks $app" }
          $out = & "$app\gesher.cmd" "$app\hello.dex" gesher.Hello 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or -not $out.Contains('Hello from ART on Windows')) {
            throw "Hello through the installed gesher failed (exit $code)"
          }
          if ($out -notmatch 'gesher: boot image loaded: 3 spaces') { throw 'The installed gesher did not load the installed boot image' }
          # gesher-app and the framework it runs on are installed, and the
          # installed copy takes the bundled app to onResume.
          foreach ($f in 'gesher-app.cmd', 'framework.jar', 'framework-res.apk', 'gesher-app.jar', 'libEGL.dll', 'libGLESv2.dll', 'licenses\ANGLE-NOTICES.txt', 'gesher-exec.exe', 'dex2oat.exe', 'profman.exe', 'oatdump.exe',
                      'tzdata\etc\tz\versioned\9\tzdata', 'tzdata\etc\tz\versioned\9\icu\zoneinfo64.res', 'licenses\TZDATA-NOTICES.txt', 'gesher-camera.apk') {
            if (-not (Test-Path "$app\$f")) { throw "The installer left out $f" }
          }
          $oatdumpOutput = & "$app\oatdump.exe" "--oat-file=$app/framework/x86_64/boot-framework.oat" --header-only --no-disassemble 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $oatdumpOutput -notmatch 'speed-profile') { throw "Installed oatdump could not inspect the installed framework: $oatdumpOutput" }
          'PASS  installer: the installed oatdump inspects the installed speed-profile framework oat' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The system fonts (docs/fonts.md): fonts.xml, every font it names, their licenses.
          foreach ($f in 'fonts\fonts.xml', 'licenses\FONTS-NOTICES.txt') {
            if (-not (Test-Path "$app\$f")) { throw "The installer left out $f" }
          }
          foreach ($f in [regex]::Matches((Get-Content -Raw "$app\fonts\fonts.xml"), '[A-Za-z0-9_-]+\.ttf') | ForEach-Object Value | Sort-Object -Unique) {
            if (-not (Test-Path "$app\fonts\$f")) { throw "The installer left out fonts\$f, which fonts.xml names" }
          }
          $out = & "$app\gesher-app.cmd" "$app\lifecycle.apk" --single-process 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "gesher-app lifecycle.apk --single-process (exit $code):"
          Write-Host (($out -split "`n" | Select-Object -Last 15) -join "`n")
          if ($code -ne 0 -or $out -notmatch 'gesher-app: done' -or $out -notmatch 'stand-in services in this process') {
            throw "The installed gesher-app --single-process did not take lifecycle.apk to onResume (exit $code)"
          }
          $fonts = $out -split "`n" | Select-String -Pattern 'gesher-app: system fonts' | Select-Object -First 1
          Write-Host $fonts
          if ($out -notmatch 'gesher-app: system fonts: \d+ typefaces') { throw 'The installed gesher-app did not load the system fonts' }
          if ($out -notmatch 'gesher: boot image loaded: 5 spaces') { throw 'The installed gesher-app did not load the installed boot image with its extensions' }
          'PASS  installer: the installed boot image loads (gesher: the primary image, 3 spaces; gesher-app: with the framework and gesher-app extensions, 5 spaces)' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          'PASS  installer: gesher-app loads the installed system fonts' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The default: the Gesher device (binderd, servicemanager and a
          # persistent system server, detached), the APK installed, its
          # process started by the system server (docs/services.md).
          $device = "$env:LOCALAPPDATA\Gesher\data\system\gesher-device"
          function DevicePids {
            if (-not (Test-Path $device)) { return @() }
            $pids = @()
            foreach ($line in Get-Content $device) {
              if ($line -match '^(system_server|servicemanager|binderd)=(\d+)$') { $pids += [int]$Matches[2] }
            }
            return @($pids | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          }
