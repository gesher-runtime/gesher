  # End-to-end with real apps (docs/e2e.md): the installer from the package job on a
  # clean runner runs real, unmodified open-source apps from F-Droid
  # (tests/e2e/apps.json, pinned by SHA-256), each in an off-desktop window that is
  # read back, given input and closed: tests/e2e/run-e2e.ps1.
  e2e:
    needs: [package]
    # The package job uploads the installer before its own checks.
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/e2e
            tools/ci
            tools/surface
            tests/windows/graphics

      - name: Verify and assemble gesher-setup artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name gesher-setup --producer "package" --destination ci-suppliers/gesher_setup --allow-failed-producer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/gesher_setup --destination installer --ledger ci-owners.json --owner gesher_setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate APK cache on Gesher's drive
        id: apk-cache
        shell: pwsh
        run: '"path=$(Join-Path $env:TEMP gesher-e2e)" >> $env:GITHUB_OUTPUT'

      # run-e2e checks every SHA-256 again, including cache hits.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.apk-cache.outputs.path }}
          key: e2e-apks-v1-${{ hashFiles('tests/e2e/apps.json') }}

      - name: Run real apps
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/test-apks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem installer\gesher-setup-*.exe).FullName
          $env:GESHER_TRACE_MISSING_BOOT_CLASSES = '1'
          pwsh -NoProfile -File tests/e2e/run-e2e.ps1 -Setup $setup -Out e2e-results
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}
          path: e2e-results/

  test:
    needs: [build, framework, native-libs, libs, graphics, angle, boot-image, webview, exec, media, posix, arm64, surfaces, native2]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung app or check fails the job instead of running for six hours.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            tools/ci
            tools/surface
            tools/symbolize.py
            tools/boot-image
            tools/web3
            tools/package
            probes/native3/unicode
            tools/net-dns
            tools/net-dns-component

      - name: Verify and assemble windows-x64 artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name windows-x64 --producer "build" --destination ci-suppliers/windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/windows_x64 --destination dist --ledger ci-owners.json --owner windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble framework artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name framework --producer "framework / framework" --destination ci-suppliers/framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/framework --destination dist --ledger ci-owners.json --owner framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble native-libs artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name native-libs --producer "native-libs / native-libs" --destination ci-suppliers/native_libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/native_libs --destination dist --ledger ci-owners.json --owner native_libs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble arm64 artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name arm64 --producer "arm64 / build" --destination ci-suppliers/arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/arm64 --destination dist --ledger ci-owners.json --owner arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble libs-tests artifact
