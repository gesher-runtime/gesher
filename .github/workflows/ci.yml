# Temporary branch-only evidence. Never merge this reduced workflow into PR199/main.
name: pr199-restart-resource-audit
on:
  push:
    branches: [qa/diagnostic-pr199-restart-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr199-restart-resource-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app-identity-restart:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Record diagnostic source
        shell: pwsh
        run: |
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
      - name: Build actual app identity restart implementation
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /D_WIN32_WINNT=0x0A00 compat\framework\services_zygote.cc tests\clipboard\standalone_restart_windows_test.cc /Fe:app-identity-restart.exe user32.lib
      - name: Build isolated restart resource diagnostics
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /D_WIN32_WINNT=0x0A00 /DGESHER_RESTART_AUDIT compat\framework\services_zygote.cc tests\clipboard\standalone_restart_windows_test.cc /Fe:app-identity-restart-audit.exe user32.lib
      - name: Check UID re-entry, inherited I/O, exact exit and parent-death cleanup
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & .\app-identity-restart.exe
          $originalExit = $LASTEXITCODE
          & .\app-identity-restart-audit.exe
          $auditExit = $LASTEXITCODE
          if ($originalExit -ne 0 -or $auditExit -ne 0) {
            throw "Native application identity restart gate failed (original=$originalExit audit=$auditExit)"
          }
