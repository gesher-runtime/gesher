      - name: Correlate selected host supplier between full build and TCP component
        run: python3 tools/toolchain/coherent_supplier_correlation.py
  windows:
    needs: [union-trusted-source, compile, linux-reference, supplier-correlation]
    strategy:
      fail-fast: false
