name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  # Everything is cross-compiled on Linux with llvm-mingw, then executed on
  # real Windows runners.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          # The former runtime-port job's cache already holds the runtime.
          ccache-key: runtime

      - name: Build
        run: ninja -C out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test apps
        run: tests/build-test-apps.sh out/test-apps

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/*.exe out/test-apps/* dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/

  # What is left of porting ART's x86-64 assembly to Windows; informational.
  asm-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache AOSP sources
        uses: actions/cache@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Fetch AOSP sources
        run: tools/fetch-aosp.sh

      - name: Report
        run: |
          python3 tools/asm-port-report.py third_party/aosp | tee asm-report.md
          cat asm-report.md >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - name: Run tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows/run-tests.ps1 dist | Tee-Object -FilePath results.txt
          $code = $LASTEXITCODE
          "### Tests — ${{ matrix.os }}" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content results.txt | Select-String -Pattern '^(PASS|FAIL)|failed' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          exit $code
