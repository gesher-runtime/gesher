      GESHER_COHERENT_TCP_POLICY_REF: ${{ needs.union-trusted-source.outputs.policy_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify coherent selected TCP receiver role
        shell: pwsh
        run: |
          python tools/toolchain/coherent_tcp_context.py
          if ($LASTEXITCODE -ne 0) { throw 'Coherent TCP receiver role rejected' }
      - name: Check exact qualified controller helper hashes and source-only pin negatives
        shell: pwsh
        run: tools/net-tcp-priority/test-helper-metadata.ps1
      - name: Reject incomplete expected-exit retirement metadata without native execution
        shell: pwsh
        run: tools/net-tcp-priority/test-retirement-metadata.ps1
      - name: Prove unchanged receipt predicates and complete diagnostic observations without native execution
        shell: pwsh
        run: tools/net-tcp-priority/test-receipt-metadata.ps1
      - name: Verify raw archive and exact producer, then run actual host and both ABI paths
        shell: pwsh
        run: tools/net-tcp-priority/run-component.ps1
