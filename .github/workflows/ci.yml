name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  # Everything is cross-compiled on Linux with llvm-mingw, then executed on
  # real Windows runners.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          ccache-key: build

      - name: Build
        run: ninja -C out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test apps
        run: tests/build-test-apps.sh out/test-apps

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/*.exe out/test-apps/* dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/

  # The ART runtime does not fully compile for Windows yet. This job compiles
  # every file it can and publishes a report; it fails only if the build
  # setup itself breaks.
  runtime-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime

      - name: Compile ART runtime
        run: ninja -C out -k 0 art_runtime 2>&1 | tee runtime.log || true

      - name: Report
        run: |
          python3 tools/compile-report.py runtime.log cmake/aosp/libart_srcs.cmake \
            "ART runtime port status" | tee runtime-report.md
          cat runtime-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-port-report
          path: |
            runtime-report.md
            runtime.log

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - name: Run tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows/run-tests.ps1 dist | Tee-Object -FilePath results.txt
          $code = $LASTEXITCODE
          "### Tests — ${{ matrix.os }}" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content results.txt | Select-String -Pattern '^(PASS|FAIL)|failed' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          exit $code
