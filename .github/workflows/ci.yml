          [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
          public static extern IntPtr SHGetFileInfo(string path, uint attributes, ref SHFILEINFO info, uint size, uint flags);
          '@
          $info = New-Object GesherShell.Info+SHFILEINFO
          [void][GesherShell.Info]::SHGetFileInfo("$app\lifecycle.apk", 0, [ref]$info, [Runtime.InteropServices.Marshal]::SizeOf($info), 0x1000)
          if ($info.szDisplayName -eq $lifecycleIco) {
            'PASS  installer: Explorer shows the installed lifecycle.apk with its app''s icon (the icon handler names its .ico)' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "INFO  installer: the shell names '$($info.szDisplayName)' as lifecycle.apk's icon (expected $lifecycleIco)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          # The device outlives the console that started it.
          $running = DevicePids
          if ($running.Count -ne 3) { throw "The Gesher device did not outlive the .apk open command's console: $running" }
          'PASS  installer: the Gesher device started by a double-click keeps running after its console is gone' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # An app's window on the device (docs/graphics.md, ADR 0029): the
          # installed gesher-app launches uiapp.apk with a hidden window; the
          # app process the system server starts draws its UI into a Win32
          # window of its own (read back with PrintWindow), with the
          # Activity's label, the package's AppUserModelID and its shortcut's
          # icon; input reaches its views (a click, keys, a WM_CHAR, the wheel,
          # resizing: WindowChecks.ps1's UiAppInput); WM_CLOSE finishes the
          # Activity and the process ends.
          . tests\windows\graphics\WindowChecks.ps1
          $uiapp = Join-Path $env:TEMP 'uiapp.apk'  # on Gesher's drive
          Copy-Item dist\uiapp.apk $uiapp
          $uiLog = Join-Path $env:TEMP 'uiapp-launch.log'
          $psi = [Diagnostics.ProcessStartInfo]::new('cmd.exe', "/d /s /c `"`"$app\gesher-app.cmd`" `"$uiapp`" --hidden-window > `"$uiLog`" 2>&1`"")
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $hwnd = [IntPtr]::Zero
          $deadline = (Get-Date).AddSeconds(400)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            $m = [regex]::Match("$(Get-Content -Raw $uiLog -ErrorAction SilentlyContinue)", 'first frame drawn \(\d+ presented\), \w+, hwnd 0x([0-9a-f]+)')
            if ($m.Success) { $hwnd = [IntPtr][Convert]::ToInt64($m.Groups[1].Value, 16); break }
            Start-Sleep -Milliseconds 250
          }
          $problems = @()
          if ($hwnd -eq [IntPtr]::Zero) { $problems += 'no first frame' } else {
            Start-Sleep 3
            $px = [GesherWin32]::Capture($hwnd)
            if ($null -eq $px) { $problems += 'PrintWindow failed' } else { $problems += @(UiAppPixels $px) }
            $text = Get-Content -Raw $uiLog
            $m = [regex]::Match($text, 'app process for com\.gesher\.uiapp: pid (\d+)')
            $owner = [GesherWin32]::ProcessId($hwnd)
            if (-not $m.Success -or [int]$m.Groups[1].Value -ne $owner) { $problems += "the window is process $owner's, not the app process's" }
            $title = [GesherWin32]::Title($hwnd); $id = [GesherWin32]::AppUserModelId($hwnd)
            Write-Host "uiapp's window: title '$title', process $owner, AppUserModelID '$id', icon: $([GesherWin32]::HasIcon($hwnd))"
            if ($title -ne 'Gesher UI test') { $problems += "title '$title'" }
            if ($id -ne 'Gesher.App.com.gesher.uiapp') { $problems += "AppUserModelID '$id'" }
            if (-not [GesherWin32]::HasIcon($hwnd)) { $problems += 'no window icon' }
            $inputProblems = @(UiAppInput $hwnd { Get-Content -Raw $uiLog -ErrorAction SilentlyContinue })
            $problems += $inputProblems
            [void][GesherWin32]::PostMessageW($hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          }
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); $problems += 'did not end after WM_CLOSE' }
          elseif ($p.ExitCode -ne 0) { $problems += "exit $($p.ExitCode)" }
          $text = Get-Content -Raw $uiLog -ErrorAction SilentlyContinue
          foreach ($want in 'UiActivity onDestroy', 'the process of com.gesher.uiapp ended (exit code 0)', 'gesher-app: done') {
            if (-not "$text".Contains($want)) { $problems += "missing '$want'" }
          }
          if ($problems) {
            Write-Host $text
            Get-Content "$env:LOCALAPPDATA\Gesher\logs\system_server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40 | Out-Host
            throw "uiapp.apk's window on the Gesher device: $($problems -join '; ')"
          }
          'PASS  installer: gesher-app runs uiapp.apk on the Gesher device in a Win32 window of its app process (hwui''s frame read back with PrintWindow; the Activity''s label, AppUserModelID Gesher.App.com.gesher.uiapp, its icon); closing it ends the app' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          'PASS  installer: input reaches uiapp.apk''s views on the Gesher device (a click runs the Button''s onClick, keys and a WM_CHAR type into its EditText, the wheel scrolls, the resized window redraws at 600x700)' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # gesher-launch's splash (compat/shell/gesher_launch.cc, docs/installer.md):
          # `gesher-launch install` shows none; `gesher-launch launch com.gesher.uiapp`
          # (the shortcut's command, the app's window shown) shows a GesherSplash
          # window with the app's label and AppUserModelID at once, which goes once
          # the app's own window (GesherWindow, the same AppUserModelID) is visible.
          if (-not ('GesherSplashCi' -as [type])) {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class GesherSplashCi {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern IntPtr FindWindowExW(IntPtr parent, IntPtr after, string cls, string title);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            // The visible windows of class `cls` (of process `pid`, unless 0).
            public static IntPtr[] Find(string cls, uint pid) {
              var found = new System.Collections.Generic.List<IntPtr>();
              IntPtr h = IntPtr.Zero;
              while ((h = FindWindowExW(IntPtr.Zero, h, cls, null)) != IntPtr.Zero) {
                uint owner;
                GetWindowThreadProcessId(h, out owner);
                if ((pid == 0 || owner == pid) && IsWindowVisible(h)) found.Add(h);
              }
              return found.ToArray();
            }
          }
          '@
          }
          $problems = @()
          $psi = [Diagnostics.ProcessStartInfo]::new("$app\gesher-launch.exe", "install `"$uiapp`"")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [Diagnostics.Process]::Start($psi)
          $errors = $p.StandardError.ReadToEndAsync()
          $outs = $p.StandardOutput.ReadToEndAsync()
          $sawSplash = $false
          while (-not $p.WaitForExit(100)) { if ([GesherSplashCi]::Find('GesherSplash', [uint32]$p.Id).Count -gt 0) { $sawSplash = $true } }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { $problems += "gesher-launch install exit $($p.ExitCode): $($outs.Result)$($errors.Result)" }
          if ($sawSplash) { $problems += 'gesher-launch install showed a splash' }
          $psi = [Diagnostics.ProcessStartInfo]::new("$app\gesher-launch.exe", 'launch com.gesher.uiapp')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables['GESHER_APP_WINDOW'] = 'window'
          $p = [Diagnostics.Process]::Start($psi)
          $errors = $p.StandardError.ReadToEndAsync()
          $outs = $p.StandardOutput.ReadToEndAsync()
          $splash = [IntPtr]::Zero; $appWindow = [IntPtr]::Zero; $splashGone = $false
          $deadline = (Get-Date).AddSeconds(400)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            if ($splash -eq [IntPtr]::Zero) {
              $s = @([GesherSplashCi]::Find('GesherSplash', [uint32]$p.Id))
              if ($s.Count -gt 0) {
                $splash = $s[0]
                Write-Host "splash: title '$([GesherWin32]::Title($splash))', AppUserModelID '$([GesherWin32]::AppUserModelId($splash))', icon: $([GesherWin32]::HasIcon($splash))"
                if ([GesherWin32]::AppUserModelId($splash) -ne 'Gesher.App.com.gesher.uiapp') { $problems += "the splash's AppUserModelID is '$([GesherWin32]::AppUserModelId($splash))'" }
                if ([GesherWin32]::Title($splash) -ne 'Gesher UI') { $problems += "the splash's title is '$([GesherWin32]::Title($splash))', not the app's label" }
                if (-not [GesherWin32]::HasIcon($splash)) { $problems += 'the splash has no icon' }
              }
            }
            $w = @([GesherSplashCi]::Find('GesherWindow', 0) | Where-Object { [GesherWin32]::AppUserModelId($_) -eq 'Gesher.App.com.gesher.uiapp' })
            if ($w.Count -gt 0) {
              $appWindow = $w[0]
              # The splash looks every 200 ms.
              for ($i = 0; $i -lt 50 -and -not $splashGone; $i++) {
                $splashGone = $splash -ne [IntPtr]::Zero -and -not [GesherWin32]::IsWindow($splash)
                if (-not $splashGone) { Start-Sleep -Milliseconds 100 }
              }
              break
            }
            Start-Sleep -Milliseconds 100
          }
          if ($splash -eq [IntPtr]::Zero) { $problems += 'no splash window' }
          if ($appWindow -eq [IntPtr]::Zero) { $problems += 'the app''s window was not shown' }
          elseif (-not $splashGone) { $problems += 'the splash was still up 5 s after the app''s window was shown' }
          if ($appWindow -ne [IntPtr]::Zero) { [void][GesherWin32]::PostMessageW($appWindow, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) }  # WM_CLOSE
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); $problems += 'gesher-launch did not end after the app''s window was closed' }
          elseif ($p.ExitCode -ne 0) { $problems += "gesher-launch launch exit $($p.ExitCode)" }
          if ($problems) {
            Write-Host "$($outs.Result)$($errors.Result)"
            throw "gesher-launch's splash: $($problems -join '; ')"
          }
          'PASS  installer: gesher-launch launch com.gesher.uiapp shows a splash (GesherSplash: the app''s label, icon and AppUserModelID) until the app''s window is up; gesher-launch install shows none' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # An update while a program has the .apk icon handler loaded (Explorer always
          # has): Setup must not close that program (it took the desktop away), and
          # the update must still succeed: the loaded copy is moved aside.
          # Encoded: Start-Process passes a -Command's inner quotes unescaped.
          $holdCmd = "Add-Type -Name K -Namespace Ci -MemberDefinition '[DllImport(`"kernel32.dll`", CharSet = CharSet.Unicode)] public static extern System.IntPtr LoadLibraryW(string p);'; if ([Ci.K]::LoadLibraryW('$app\gesher_shellext.dll') -eq [IntPtr]::Zero) { exit 3 }; Start-Sleep 600"
          $holder = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-EncodedCommand',
            ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($holdCmd)))
          $loaded = $false
          for ($i = 0; $i -lt 30 -and -not $loaded; $i++) {
            $loaded = [bool]((Get-Process -Id $holder.Id -ErrorAction SilentlyContinue).Modules | Where-Object ModuleName -eq 'gesher_shellext.dll')
            if (-not $loaded) { Start-Sleep 1 }
          }
          if ($holder.HasExited) { throw "The process holding gesher_shellext.dll ended before the update (exit $($holder.ExitCode))" }
          if (-not $loaded) { Stop-Process -Id $holder.Id -Force; throw 'The holder process never had gesher_shellext.dll loaded' }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          $problems = @()
          if ($p.ExitCode -ne 0) { $problems += "Setup exit $($p.ExitCode)" }
          if ($holder.HasExited) { $problems += 'Setup closed the process that had gesher_shellext.dll loaded' }
          if (-not (Test-Path "$app\gesher_shellext.dll")) { $problems += 'no gesher_shellext.dll after the update' }
          if (-not (Get-ChildItem "$app\gesher_shellext.*.old" -ErrorAction SilentlyContinue)) { $problems += 'the loaded copy was not moved aside' }
          Stop-Process -Id $holder.Id -Force -ErrorAction SilentlyContinue
          if ($problems) { throw "Updating with the icon handler loaded: $($problems -join '; ')" }
          'PASS  installer: an update with gesher_shellext.dll loaded in another process leaves that process running (Explorer is not closed) and moves the loaded copy aside' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # Something of the Start menu that is not Gesher's, which uninstalling must keep.
          $sentinel = Join-Path $programs 'gesher-ci-sentinel.txt'
          Set-Content $sentinel 'not Gesher''s'
          # An app id as the system server registers one for an app's toasts (ADR 0038), which uninstalling must remove.
          $null = New-Item 'HKCU:\Software\Classes\AppUserModelId\Gesher.App.com.gesher.ci' -Force
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          # The uninstaller hands over to a copy of itself and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep 1 }
          $left = @($running | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          if ($left) { throw "Uninstall left the Gesher device's processes running: $left" }
          if (Test-Path "$env:LOCALAPPDATA\Gesher") { throw "Uninstall left $env:LOCALAPPDATA\Gesher" }
          'PASS  installer: uninstall stops the Gesher device and removes its data' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -split ';' -contains $app) { throw 'Uninstall left Gesher on PATH' }
          if (Test-Path "$app\dalvikvm.exe") { throw 'Uninstall left dalvikvm.exe' }
          if (Test-Path "$cls\Gesher.Apk") { throw 'Uninstall left the Gesher.Apk ProgID' }
          if ((Get-ItemProperty "$cls\.apk" -ErrorAction SilentlyContinue).'(default)' -eq 'Gesher.Apk') { throw "Uninstall left .apk's default on Gesher.Apk" }
          if ($null -ne (Get-ItemProperty "$cls\.apk\OpenWithProgids" -ErrorAction SilentlyContinue).'Gesher.Apk') { throw 'Uninstall left Gesher.Apk in OpenWithProgids' }
          'PASS  installer: uninstall removes the .apk association' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$cls\CLSID\{C18D9445-A7F0-472E-985F-AC354EBEB660}") { throw 'Uninstall left the toast activator' }
          $appIds = @(Get-ChildItem "$cls\AppUserModelId" -ErrorAction SilentlyContinue | Where-Object PSChildName -like 'Gesher.App.*')
          if ($appIds) { throw "Uninstall left app ids: $($appIds.PSChildName -join ', ')" }
          # components.apk was still installed: its URL protocol goes with Gesher.
          if (Test-Path "$cls\gesher-components") { throw 'Uninstall left the URL protocol gesher-components' }
          'PASS  installer: uninstall removes the toast activator and the apps'' AppUserModelIDs and URL protocols' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if (Test-Path $appsFolder) { throw "Uninstall left $appsFolder" }
          if (-not (Test-Path $sentinel)) { throw "Uninstall removed $sentinel" }
          Remove-Item $sentinel
          'PASS  installer: uninstall removes the Gesher Apps Start menu folder with the apps'' shortcuts, and nothing else of the Start menu' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          'PASS  installer: installs, runs Hello and gesher-app, uninstalls' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

  # End-to-end with real apps (docs/e2e.md): the installer from the package job on a
  # clean runner runs real, unmodified open-source apps from F-Droid
  # (tests/e2e/apps.json, pinned by SHA-256), each in an off-desktop window that is
  # read back, given input and closed: tests/e2e/run-e2e.ps1.
  e2e:
    needs: [package]
    # The package job uploads the installer before its own checks.
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/e2e
            tools/ci
            tools/surface
            tests/windows/graphics

      - name: Verify and assemble gesher-setup artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name gesher-setup --producer "package" --destination ci-suppliers/gesher_setup --allow-failed-producer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/gesher_setup --destination installer --ledger ci-owners.json --owner gesher_setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate APK cache on Gesher's drive
        id: apk-cache
        shell: pwsh
        run: '"path=$(Join-Path $env:TEMP gesher-e2e)" >> $env:GITHUB_OUTPUT'

      # run-e2e checks every SHA-256 again, including cache hits.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.apk-cache.outputs.path }}
          key: e2e-apks-v1-${{ hashFiles('tests/e2e/apps.json') }}

      - name: Run real apps
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/test-apks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem installer\gesher-setup-*.exe).FullName
          $env:GESHER_TRACE_MISSING_BOOT_CLASSES = '1'
          pwsh -NoProfile -File tests/e2e/run-e2e.ps1 -Setup $setup -Out e2e-results
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}
          path: e2e-results/

  test:
    needs: [build, framework, native-libs, libs, graphics, angle, boot-image, webview, exec, media, posix, arm64, surfaces, native2, supplier-correlation]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung app or check fails the job instead of running for six hours.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            tools/ci
            tools/surface
            tools/symbolize.py
            tools/boot-image
            tools/web3
            tools/package
            tools/windows4
            tools/net-udp
            tools/net-udp-component
            tools/net-dns
            tools/net-dns-component
            probes/native3/unicode
            tools/toolchain
            tools/host-pthread-authority
            .github/workflows
            tools/fonts
            tools/binder

      - name: Verify and assemble windows-x64 artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name windows-x64 --producer "build" --destination ci-suppliers/windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/windows_x64 --destination dist --ledger ci-owners.json --owner windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble framework artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name framework --producer "framework / framework" --destination ci-suppliers/framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/framework --destination dist --ledger ci-owners.json --owner framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble native-libs artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name native-libs --producer "native-libs / native-libs" --destination ci-suppliers/native_libs
