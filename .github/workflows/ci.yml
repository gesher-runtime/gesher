      - name: Verify and assemble graphics artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name graphics --producer "graphics / build" --destination ci-suppliers/graphics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/graphics --destination dist --ledger ci-owners.json --owner graphics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble angle artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name angle --producer "angle / probe-build" --destination ci-suppliers/angle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/angle --destination dist --ledger ci-owners.json --owner angle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble boot-image artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name boot-image --producer "boot-image / compile" --destination ci-suppliers/boot_image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/boot_image --destination dist --ledger ci-owners.json --owner boot_image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble webview artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name webview --producer "webview / build" --destination ci-suppliers/webview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source ci-suppliers/webview --destination dist --ledger ci-owners.json --owner webview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and assemble exec artifact
        shell: pwsh
        run: |
          python tools/ci/artifact_receipt.py --name exec --producer "exec / exec" --destination ci-suppliers/exec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
