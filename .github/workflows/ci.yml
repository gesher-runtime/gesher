name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # framework.yml finds host tools other branches built

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  # Everything is cross-compiled on Linux with llvm-mingw, then executed on
  # real Windows runners.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          # The former runtime-port job's cache already holds the runtime.
          ccache-key: runtime

      - name: Build
        run: ninja -C out

      - name: Check assembly boundaries use the System V ABI
        run: python3 tools/abi-check.py out third_party/aosp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test apps
        run: tests/build-test-apps.sh out/test-apps

      - name: Build boot class path (core-oj, core-libart)
        run: tools/build-boot-jars.sh out/boot-jars

      - name: Build the framework's resources (framework-res.apk)
        run: tools/build-framework-res.sh out/framework-res

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/*.exe out/dalvikvm.map out/test-apps/* out/boot-jars/*.jar dist/
          # ICU's data, which the runtime maps from $ANDROID_I18N_ROOT/etc/icu.
          cp third_party/aosp/external/icu/icu4c/source/stubdata/icudt*l.dat dist/
          # The system fonts and fonts.xml, for $ANDROID_ROOT (docs/fonts.md).
          tools/fonts/collect-fonts.sh third_party/aosp dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/

  # framework.jar's pipeline (host tools, coremod, framework-res, then
  # tools/framework/build.py): .github/workflows/framework.yml, which also
  # runs on its own (gh workflow run framework --ref <branch>).
  framework:
    uses: ./.github/workflows/framework.yml

  # Phase 6 (native libraries): the Android NDK test .so files, built on the
  # Linux runner. .github/workflows/native-libs.yml, which also runs on its own.
  native-libs:
    uses: ./.github/workflows/native-libs.yml

  # The core libraries' own unit tests (AOSP's cc_test modules), built for
  # the test job: .github/workflows/libs.yml.
  libs:
    uses: ./.github/workflows/libs.yml

  # Skia, hwui and the graphics probes (docs/graphics.md):
  # .github/workflows/graphics.yml, which also runs on its own.
  graphics:
    uses: ./.github/workflows/graphics.yml

  # ANGLE's libEGL.dll and libGLESv2.dll (GLES over Direct3D 11) and their
  # probe (docs/angle.md): .github/workflows/angle.yml, which also runs on its own.
  angle:
    uses: ./.github/workflows/angle.yml

  # What is left of porting ART's x86-64 assembly to Windows; informational.
  asm-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache AOSP sources
        uses: actions/cache@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp.lock', 'patches/**') }}
          restore-keys: aosp-

      - name: Fetch AOSP sources
        run: tools/fetch-aosp.sh

      - name: Report
        run: |
          python3 tools/asm-port-report.py third_party/aosp | tee asm-report.md
          cat asm-report.md >> "$GITHUB_STEP_SUMMARY"

  # The Windows installer (tools/package/gesher.iss), installed and tried on a
  # clean runner: Hello through the installed `gesher` command, then uninstall.
  package:
    needs: [build, framework, graphics, angle]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/package

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: framework
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: graphics
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: angle
          path: dist

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = "0.1.${{ github.run_number }}"
          & $iscc /Qp "/DBuildDir=$PWD\dist" "/DAppVersion=$version" "/O$PWD\installer" tools\package\gesher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      - name: Install, run Hello, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\gesher-setup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Gesher'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' -contains $app)) { throw "PATH lacks $app" }
          $out = & "$app\gesher.cmd" "$app\hello.dex" gesher.Hello 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0 -or -not $out.Contains('Hello from ART on Windows')) {
            throw "Hello through the installed gesher failed (exit $code)"
          }
          # gesher-app and the framework it runs on are installed, and the
          # installed copy takes the bundled app to onResume.
          foreach ($f in 'gesher-app.cmd', 'framework.jar', 'framework-res.apk', 'gesher-app.jar', 'libEGL.dll', 'libGLESv2.dll', 'licenses\ANGLE-NOTICES.txt') {
            if (-not (Test-Path "$app\$f")) { throw "The installer left out $f" }
          }
          # The system fonts (docs/fonts.md): fonts.xml, every font it names, their licenses.
          foreach ($f in 'fonts\fonts.xml', 'licenses\FONTS-NOTICES.txt') {
            if (-not (Test-Path "$app\$f")) { throw "The installer left out $f" }
          }
          foreach ($f in [regex]::Matches((Get-Content -Raw "$app\fonts\fonts.xml"), '[A-Za-z0-9_-]+\.ttf') | ForEach-Object Value | Sort-Object -Unique) {
            if (-not (Test-Path "$app\fonts\$f")) { throw "The installer left out fonts\$f, which fonts.xml names" }
          }
          $out = & "$app\gesher-app.cmd" "$app\lifecycle.apk" --single-process 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "gesher-app lifecycle.apk --single-process (exit $code):"
          Write-Host (($out -split "`n" | Select-Object -Last 15) -join "`n")
          if ($code -ne 0 -or $out -notmatch 'gesher-app: done' -or $out -notmatch 'stand-in services in this process') {
            throw "The installed gesher-app --single-process did not take lifecycle.apk to onResume (exit $code)"
          }
          $fonts = $out -split "`n" | Select-String -Pattern 'gesher-app: system fonts' | Select-Object -First 1
          Write-Host $fonts
          if ($out -notmatch 'gesher-app: system fonts: \d+ typefaces') { throw 'The installed gesher-app did not load the system fonts' }
          'PASS  installer: gesher-app loads the installed system fonts' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The default: the Gesher device (binderd, servicemanager and a
          # persistent system server, detached), the APK installed, its
          # process started by the system server (docs/services.md).
          $device = "$env:LOCALAPPDATA\Gesher\data\system\gesher-device"
          function DevicePids {
            if (-not (Test-Path $device)) { return @() }
            $pids = @()
            foreach ($line in Get-Content $device) {
              if ($line -match '^(system_server|servicemanager|binderd)=(\d+)$') { $pids += [int]$Matches[2] }
            }
            return @($pids | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          }
          $out = & "$app\gesher-app.cmd" "$app\lifecycle.apk" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "gesher-app lifecycle.apk (exit $code):"
          Write-Host (($out -split "`n" | Select-Object -Last 15) -join "`n")
          if ($code -ne 0 -or $out -notmatch 'gesher-app: done' -or $out -notmatch 'started the Gesher device' -or
              $out -notmatch 'installed com\.gesher\.lifecycle' -or $out -notmatch 'LifecycleActivity onResume') {
            Get-Content "$env:LOCALAPPDATA\Gesher\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 60 | Out-Host
            throw "The installed gesher-app did not run lifecycle.apk on the Gesher device (exit $code)"
          }
          if ((DevicePids).Count -ne 3) { throw "The Gesher device is not running after the launch: $(DevicePids)" }
          $list = & "$app\gesher-app.cmd" list 2>&1 | Out-String
          Write-Host $list
          if ($list -notmatch 'connected to the running Gesher device' -or $list -notmatch 'package:com\.gesher\.lifecycle ') {
            throw "gesher-app list does not show the installed lifecycle.apk"
          }
          'PASS  installer: gesher-app installs lifecycle.apk and runs it on the Gesher device (a persistent system server); list shows it' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $out = & "$app\gesher-app.cmd" shutdown 2>&1 | Out-String
          Write-Host $out
          Start-Sleep 1
          if ($LASTEXITCODE -ne 0 -or (DevicePids).Count -ne 0 -or (Test-Path $device)) {
            throw "gesher-app shutdown left the Gesher device running: $(DevicePids)"
          }
          'PASS  installer: gesher-app shutdown stops the Gesher device''s processes' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # Multi-process: binderd, servicemanager and the system server
          # (com.gesher.server.SystemServer) started by the launcher, the app
          # in a process of its own.
          $out = & "$app\gesher-app.cmd" "$app\lifecycle.apk" --system-server 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "gesher-app lifecycle.apk --system-server (exit $code):"
          Write-Host (($out -split "`n" | Select-Object -Last 12) -join "`n")
          if ($code -ne 0 -or $out -notmatch 'gesher-app: done' -or $out -notmatch '\(in another process\)') {
            Get-Content "$env:LOCALAPPDATA\Gesher\logs\run-system_server.*" -ErrorAction SilentlyContinue | Select-Object -Last 40 | Out-Host
            throw "The installed gesher-app --system-server did not take lifecycle.apk to onResume (exit $code)"
          }
          'PASS  installer: gesher-app --system-server runs the app with the services in a system server process' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The .apk association: run the open command the installer registered,
          # with %1 set to the bundled APK, as Explorer would.
          $cls = 'HKCU:\Software\Classes'
          $progId = (Get-ItemProperty "$cls\.apk" -ErrorAction SilentlyContinue).'(default)'
          if ($progId -ne 'Gesher.Apk') { throw ".apk's default ProgID is '$progId', not Gesher.Apk" }
          if ($null -eq (Get-ItemProperty "$cls\.apk\OpenWithProgids").'Gesher.Apk') { throw '.apk OpenWithProgids lacks Gesher.Apk' }
          $open = (Get-ItemProperty "$cls\Gesher.Apk\shell\open\command").'(default)'
          Write-Host "Gesher.Apk open command: $open"
          $cmdLine = $open.Replace('%1', "$app\lifecycle.apk")
          $psi = [Diagnostics.ProcessStartInfo]::new('cmd.exe', "/d /s /c `"$cmdLine 2>&1`"")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $p = [Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEnd()
          $p.WaitForExit()
          Write-Host (($out -split "`n" | Select-Object -Last 5) -join "`n")
          if ($p.ExitCode -ne 0 -or $out -notmatch 'gesher-app: done' -or $out -notmatch 'started the Gesher device') {
            throw "The .apk open command did not take lifecycle.apk to onResume on the Gesher device (exit $($p.ExitCode))"
          }
          'PASS  installer: .apk opens with gesher-app through the registered command' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The device outlives the console that started it.
          $running = DevicePids
          if ($running.Count -ne 3) { throw "The Gesher device did not outlive the .apk open command's console: $running" }
          'PASS  installer: the Gesher device started by a double-click keeps running after its console is gone' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          # The uninstaller hands over to a copy of itself and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep 1 }
          $left = @($running | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          if ($left) { throw "Uninstall left the Gesher device's processes running: $left" }
          if (Test-Path "$env:LOCALAPPDATA\Gesher") { throw "Uninstall left $env:LOCALAPPDATA\Gesher" }
          'PASS  installer: uninstall stops the Gesher device and removes its data' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -split ';' -contains $app) { throw 'Uninstall left Gesher on PATH' }
          if (Test-Path "$app\dalvikvm.exe") { throw 'Uninstall left dalvikvm.exe' }
          if (Test-Path "$cls\Gesher.Apk") { throw 'Uninstall left the Gesher.Apk ProgID' }
          if ((Get-ItemProperty "$cls\.apk" -ErrorAction SilentlyContinue).'(default)' -eq 'Gesher.Apk') { throw "Uninstall left .apk's default on Gesher.Apk" }
          if ($null -ne (Get-ItemProperty "$cls\.apk\OpenWithProgids" -ErrorAction SilentlyContinue).'Gesher.Apk') { throw 'Uninstall left Gesher.Apk in OpenWithProgids' }
          'PASS  installer: uninstall removes the .apk association' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          'PASS  installer: installs, runs Hello and gesher-app, uninstalls' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: gesher-setup
          path: installer/*.exe

  test:
    needs: [build, framework, native-libs, libs, graphics, angle]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            tools/symbolize.py

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: framework
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: libs-tests
          path: dist/libs-tests

      - uses: actions/download-artifact@v4
        with:
          name: graphics
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: angle
          path: dist

      - name: Run tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows/run-tests.ps1 dist | Tee-Object -FilePath results.txt
          $code = $LASTEXITCODE
          "### Tests — ${{ matrix.os }}" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content results.txt | Select-String -Pattern '^(PASS|FAIL|INFO)|failed' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          exit $code
