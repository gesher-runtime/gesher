  # Extra isolated jobs execute the real regression in the SAME canonical
  # full. Only these jobs download the separately named hook artifact.
  web3-query-regression:
    needs: [build, framework, native-libs, graphics, angle, boot-image, webview, exec, media, arm64]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin all current full producers and packages before any download
        id: suppliers
        shell: pwsh
        run: tools/web3/verify_full_suppliers.ps1
      - name: Verify and assemble windows-x64 artifact
