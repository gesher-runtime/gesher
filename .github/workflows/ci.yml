# Temporary branch-only evidence. Never merge this reduced workflow into PR199/main.
name: pr199-restart-resource-audit
on:
  push:
    branches: [qa/diagnostic-pr199-restart-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr199-restart-resource-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app-identity-restart:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Record diagnostic source
        shell: pwsh
        run: |
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
      - name: Build exact repaired fixture and isolated leak negative
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /D_WIN32_WINNT=0x0A00 compat\framework\services_zygote.cc tests\clipboard\standalone_restart_windows_test.cc /Fe:app-identity-restart.exe user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /D_WIN32_WINNT=0x0A00 /DGESHER_RESTART_LEAK_NEGATIVE_CONTROL compat\framework\services_zygote.cc tests\clipboard\standalone_restart_windows_test.cc /Fe:app-identity-restart-leak.exe user32.lib
      - name: Require repaired positive and detected first-call owned-handle leak
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $positive = @(& .\app-identity-restart.exe 2>&1)
          $positiveExit = $LASTEXITCODE
          $positive | ForEach-Object { Write-Host $_ }
          $negative = @(& .\app-identity-restart-leak.exe 2>&1)
          $negativeExit = $LASTEXITCODE
          $negative | ForEach-Object { Write-Host $_ }
          if ($positiveExit -ne 0 -or ($positive -join "`n") -notmatch 'Standalone native restart all passed:') {
            throw "Repaired positive fixture failed (exit=$positiveExit)"
          }
          if ($negativeExit -eq 0 -or ($negative -join "`n") -notmatch 'FAIL restart releases process, thread, job, stdio and attribute resources') {
            throw "Seeded owned input-handle leak was not detected at the original resource assertion (exit=$negativeExit)"
          }
          Write-Host "NEGATIVE_OWNED_HANDLE_LEAK positive=$positiveExit expected-resource-failure=$negativeExit"
          # Both strict guards passed; the negative executable's exit1 is expected.
          exit 0
