name: ephemeral preflight comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: effbbf5e52d1a5596e2bb6855ce066abfaf5cb26
        persist-credentials: false
    - name: Record platform
      run: 'git rev-parse HEAD

        nproc

        free -h

        g++ --version'
    - name: JNI and mixer allocation bounds and surface image-cache lifetime
      run: 'python3 tools/test_symbol_lookup_allocations.py

        python3 tools/test_fnmatch_performance.py --sanitize

        python3 tools/test_virtual_path_classification.py --sanitize

        python3 tools/test_binder_reply_allocations.py --sanitize

        python3 tools/test_camera_capture_allocations.py --sanitize

        python3 tools/test_layered_bitmap_cache.py --sanitize

        python3 tools/test_camera_conversion_allocations.py --sanitize

        python3 tools/test_surface_present_allocations.py --sanitize

        python3 tools/test_jni_argument_storage.py --sanitize

        python3 tools/test_art_jni_dispatch.py --sanitize

        python3 tools/test_audio_mixer_allocations.py --sanitize

        python3 tools/test_audio_capture_allocations.py --sanitize

        python3 tools/test_capture_stream_selection.py --sanitize

        python3 tools/test_audio_file_source.py --sanitize

        python3 tools/test_audio_rate_history.py --sanitize

        python3 tools/test_surface_image_cache.py --sanitize

        '
