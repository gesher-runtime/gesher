name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/cla
            .github/scripts
      - name: Resolve this repository's name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Create repository bot token
        id: gesher-bot
        if: vars.GESHER_BOT_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GESHER_BOT_APP_ID }}
          private-key: ${{ secrets.GESHER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
      - name: Check or record CLA signature
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.gesher-bot.outputs.token || github.token }}
          script: |
            const cla = require('./.github/scripts/cla.js');
            await cla.run({ github, context, core });
