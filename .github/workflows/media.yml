name: media

# The media track's test apps (docs/media.md, roadmap phase 8): mediaapp.apk,
# compiled against this run's framework classes (the framework job's
# framework-classes artifact) with the lifecycle app's build script. The
# natives themselves (compat/media) are in dalvikvm, built by the build job;
# the Windows test job runs tests/windows/tracks/38-media.ps1 on both.
#
on:
  workflow_call:

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/apps
            compat/media/sounds

      - uses: actions/download-artifact@v4
        with:
          name: framework-classes
          path: work

      - uses: actions/download-artifact@v4
        with:
          name: framework
          path: work/framework

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # aapt2 and zipalign, as framework.yml fetches them (same cache).
      - name: Restore build-tools
        id: bt
        uses: actions/cache/restore@v4
        with:
          path: work/build-tools-36.1
          key: build-tools-36.1-linux

      - name: Fetch build-tools
        if: steps.bt.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o work/build-tools.zip \
            https://dl.google.com/android/repository/build-tools_r36.1_linux.zip
          mkdir -p work/build-tools.tmp
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            work/build-tools.zip work/build-tools.tmp
          mv work/build-tools.tmp/* work/build-tools-36.1

      # The test media: a tone per format (tests/apps/mediaapp/gen-media.sh).
      - name: Generate the test media
        timeout-minutes: 10
        run: |
          set -x
          media_failure() {
            media_status=$?
            if [ "$media_status" -ne 0 ]; then
              ps -eo pid,ppid,stat,wchan:32,comm | awk 'NR == 1 || $5 ~ /^(apt-get|dpkg|ffmpeg|timeout|bash|sudo)$/'
            fi
          }
          trap media_failure EXIT
          if ! command -v ffmpeg > /dev/null 2>&1; then
            timeout --kill-after=5s 90s sudo apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q
            timeout --kill-after=5s 120s sudo apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          timeout --kill-after=5s 60s ffmpeg -version
          timeout --kill-after=5s 120s bash -x tests/apps/mediaapp/gen-media.sh
          # videoapp's clips (stage 2): a color per half second, one per codec.
          timeout --kill-after=5s 180s bash -x tests/apps/videoapp/gen-media.sh
          # Gesher's default ringtone, notification and alarm sounds, for the
          # tests and the installer.
          timeout --kill-after=5s 60s bash -x compat/media/sounds/gen-system-sounds.sh out

      # mediaapp's NDK audio test library (AAudio, OpenSL ES), with the NDK
      # native-libs.yml caches.
      - name: Restore the Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r27c
          key: ndk-27.2.12479018

      - name: Fetch the Android NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip && rm ndk.zip

      - name: Build libmedia_ndk_test.so
        run: |
          mkdir -p tests/apps/mediaapp/lib/x86_64
          android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang             -shared -fPIC -O2 -Wall -Werror -Wno-unused-parameter -Wl,-soname,libmedia_ndk_test.so             -o tests/apps/mediaapp/lib/x86_64/libmedia_ndk_test.so tests/apps/mediaapp/jni/media_ndk_test.c             -laaudio -lOpenSLES -lm

      - name: Build mediaapp.apk
        run: |
          chmod +x work/build-tools-36.1/aapt2 work/build-tools-36.1/zipalign
          mkdir -p work/framework-classes work/coremod
          (cd work/framework-classes && unzip -q ../framework-classes.zip)
          (cd work/coremod && unzip -q ../coremod.zip)
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/mediaapp/build.sh out \
            --framework-res work/framework/framework-res.apk \
            --framework-classes work/framework-classes --core-classes work/coremod
          BUILD_TOOLS_DIR="$PWD/work/build-tools-36.1" tests/apps/videoapp/build.sh out \
            --framework-res work/framework/framework-res.apk \
            --framework-classes work/framework-classes --core-classes work/coremod
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: |
            out/*.apk
            out/media/
