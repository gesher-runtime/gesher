name: binder2-stable-readonly-component

# Ordinary modes only. Full/package/e2e and the preserved transport-prefix
# failure fixture remain separate required gates.
on:
  push:
    branches: ['wip/binder2-stable-readonly']
    paths: ['.github/workflows/binder2-stable-readonly-component.yml']
  workflow_dispatch:

concurrency:
  group: binder2-stable-readonly-component-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  prerequisite:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actual shared strict archive negative controls before producers
        run: |
          python3 tools/binder/verify-helper-source.py
          python3 tools/surface/test-verified-artifact.py
      - name: Require exact selected prerequisite and actual mode build proof
        shell: pwsh
        run: |
          $qualified = '30db7709838839d28be68d8b467a57b26a3ac667'
          $baseline = 'a474aefaa553f53f3fdf14345c199b0a4ae3683c'
          $proof = gh api repos/${{ github.repository }}/actions/runs/40596167427 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $proof.head_sha -cne $qualified -or
              $proof.name -cne 'ci' -or $proof.run_attempt -ne 1 -or $proof.conclusion -cne 'success' -or
              $proof.repository.full_name -cne '${{ github.repository }}' -or
              $proof.head_repository.id -ne $proof.repository.id) { throw 'Qualified coherent union identity mismatch' }
          foreach ($ancestor in $qualified, $baseline, 'ed741c99367d61df2bb2c07ae4d01753d9a03c06') {
            git merge-base --is-ancestor $ancestor HEAD
            if ($LASTEXITCODE -ne 0) { throw "Missing exact selected prerequisite $ancestor" }
          }
          $allowed = @('compat/posix/src/binder.cc','tests/binder/sg-actor.h','tests/binder/run-modes.ps1',
            'tests/binder/OutputPageObserver.cs','.github/workflows/binder2-stable-readonly-component.yml',
            'tools/binder/verify-component-suppliers.ps1','tools/binder/verify-helper-source.py','tools/surface/download-verified-artifact.py',
            'tools/surface/assemble-artifacts.py','tools/surface/test-verified-artifact.py')
          $changed = @(git diff --name-only $baseline HEAD -- . ':!docs/**')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect exact successor source delta' }
          foreach ($path in $changed) { if ($path -cnotin $allowed) { throw "Unreviewed Binder successor source delta: $path" } }
          Write-Host "ACTUAL_BINDER_READONLY_BASE source=$baseline union=$qualified full=40596167427 attempt=1 ordinary=ed741c99367d61df2bb2c07ae4d01753d9a03c06 current=${{ github.sha }}"
      - name: Verify one real pinned archive before expensive producers
        shell: pwsh
        run: |
          $a = gh api repos/${{ github.repository }}/actions/artifacts/12777738989 | ConvertFrom-Json
          $digest = 'sha256:c0eb14751722b28dac9d0024e168cd8fb8e6441798f8b747063d092432baee9d'
          if ($LASTEXITCODE -ne 0 -or $a.id -ne 12777738989 -or $a.name -cne 'boot-image' -or $a.expired -or
              $a.digest -cne $digest -or $a.workflow_run.id -ne 40596167427 -or
              $a.workflow_run.head_sha -cne '30db7709838839d28be68d8b467a57b26a3ac667' -or
              "$($a.workflow_run.repository_id)" -cne $env:GITHUB_REPOSITORY_ID -or
              "$($a.workflow_run.head_repository_id)" -cne $env:GITHUB_REPOSITORY_ID) { throw 'Known archive positive control identity mismatch' }
          $j = gh api repos/${{ github.repository }}/actions/jobs/122529052458 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $j.conclusion -cne 'success' -or $j.run_id -ne 40596167427 -or $j.run_attempt -ne 1 -or
              $j.head_sha -cne '30db7709838839d28be68d8b467a57b26a3ac667' -or
              [datetime]$a.created_at -lt [datetime]$j.started_at -or [datetime]$a.created_at -gt [datetime]$j.completed_at) { throw 'Known archive producer attempt mismatch' }
          python3 tools/surface/download-verified-artifact.py --id 12777738989 --digest $digest --destination preflight-only-accepted-boot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'ACTUAL_BINDER_ARCHIVE_PREFLIGHT pinned-source=30db run=40596167427 current-runtime-input=False'
  fixtures:
    needs: prerequisite
    uses: ./.github/workflows/binder2-sg-modes-build.yml
  framework:
    needs: prerequisite
    uses: ./.github/workflows/framework.yml
  translator:
    needs: prerequisite
    uses: ./.github/workflows/arm64.yml
  host:
    needs: prerequisite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build current host, broker, launcher, compiler and core jars together
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cmake -S . -B out -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGESHER_WEB3_QUERY_TESTS=OFF
          ninja -C out dalvikvm dex2oat profman dexdump gesher-exec binderd servicemanager binder_sg_actor
          tools/build-boot-jars.sh out/boot-jars
          tests/build-test-apps.sh out/test-apps
          mkdir -p dist
          cp out/dalvikvm.exe out/dex2oat.exe out/profman.exe out/dexdump.exe out/gesher-exec.exe \
            out/binderd.exe out/servicemanager.exe out/binder_sg_actor.exe out/dalvikvm.map out/dex2oat.map \
            out/boot-jars/*.jar out/test-apps/hello.dex dist/
          cp third_party/aosp/external/icu/icu4c/source/stubdata/icudt*l.dat dist/
          tools/fonts/collect-fonts.sh third_party/aosp dist
          compat/libcore/collect-tzdata.sh third_party/aosp dist
          printf '%s\n' "$GITHUB_SHA" > dist/binder-sg-runtime-source.txt
          python3 - <<'PYCODE'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/web3').resolve()))
          import host_roles
          identity = host_roles.context()
          assert host_roles.cache(Path('out'))['GESHER_WEB3_QUERY_TESTS'] == 'OFF'
          identity['compiler'] = host_roles.compiler(Path('out'))
          root = Path('dist')
          identity['files'] = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in root.rglob('*') if p.is_file()}
          (root / 'binder-output-host-manifest.json').write_text(json.dumps(identity, sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/
  boot-image:
    name: boot-image / compile
    needs: [host, framework]
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact reviewed helper bytes on boot compiler host
        shell: pwsh
        run: python tools/binder/verify-helper-source.py
      - name: Verify exact current boot supplier identities
        id: suppliers
        shell: pwsh
        run: tools/binder/verify-component-suppliers.ps1 -Stage Boot
      - name: Verify host archive before boot compilation
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.windows_x64 }}" --digest "${{ steps.suppliers.outputs.windows_x64_digest }}" --destination boot-suppliers/host
      - name: Verify framework archive before boot compilation
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.framework }}" --digest "${{ steps.suppliers.outputs.framework_digest }}" --destination boot-suppliers/framework
      - name: Assemble nonoverlapping current boot inputs
        shell: pwsh
        run: |
          python tools/surface/assemble-artifacts.py --source boot-suppliers/host --destination dist --ledger boot-owners.json --owner binder_host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source boot-suppliers/framework --destination dist --ledger boot-owners.json --owner binder_framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # AOSP's boot image profiles, at aosp.lock's tag (ADR 0054).
      - name: Fetch the boot image profiles
        shell: pwsh
        run: pwsh -NoProfile -File tools/boot-image/fetch-profiles.ps1 -Out boot-image/profiles

      - name: Compile the boot image
        shell: pwsh
        # BOOT_IMAGE_VERBOSE: compiler logs dex2oat's phases; a dex2oat that
        # hangs is stopped after the timeout, with its threads' stacks.
        # speed-profile with AOSP's boot image profiles, as Android compiles
        # its boot image: the primary image (core-oj, core-libart, core-icu4j)
        # and framework.jar's extension get AOT code for the profile's methods
        # and hold the profile's classes (docs/compiled-code.md, ADR 0054);
        # gesher-app.jar, which no AOSP profile covers, is compiled `speed`.
        # gesher-base maps the oat files' code as views (ADR 0036).
        run: >-
          pwsh -NoProfile -File tools/boot-image/compile.ps1 -Dist dist -Out boot-image
          -Filter speed-profile -ExtensionFilter speed-profile -AppFilter speed
          -BootProfiles boot-image/profiles/art-boot-image-profile.txt,boot-image/profiles/framework-boot-image-profile.txt,tools/boot-image/gesher-startup-profile.txt
          -TimeoutMinutes 15

      # A first look before the test jobs: Hello runs on the image.
      - name: Hello on the boot image
        shell: pwsh
        run: |
          function NoDrive([string] $p) { ($p -replace '\\', '/') -replace '^[A-Za-z]:', '' }
          $root = Join-Path $env:RUNNER_TEMP 'gesher-root'
          foreach ($d in 'system/framework', 'art', 'data', 'i18n/etc/icu', 'tzdata') { New-Item -ItemType Directory -Force (Join-Path $root $d) | Out-Null }
          Copy-Item dist/icudt*l.dat (Join-Path $root 'i18n/etc/icu')
          $env:ANDROID_ROOT = NoDrive "$root/system"
          $env:ANDROID_ART_ROOT = NoDrive "$root/art"
          $env:ANDROID_DATA = NoDrive "$root/data"
          $env:ANDROID_I18N_ROOT = NoDrive "$root/i18n"
          $env:ANDROID_TZDATA_ROOT = NoDrive "$root/tzdata"
          $env:GESHER_REQUIRE_BOOT_IMAGE = '1'
          $env:GESHER_TRACE_FAULTS = '1'
          $bcp = (('core-oj', 'core-libart', 'core-icu4j') | ForEach-Object { NoDrive "$PWD/dist/$_.jar" }) -join ':'
          $out = & dist/dalvikvm.exe "-Xbootclasspath:$bcp" "-Ximage:$(NoDrive "$PWD/boot-image/framework/boot.art")" `
            -Xint '-Xusejit:false' -cp (NoDrive "$PWD/dist/hello.dex") gesher.Hello 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path dist/dalvikvm.map)) {
            $out | python tools/symbolize.py dist/dalvikvm.map | Out-Host
          }
          Write-Host $out
          if ($code -ne 0 -or -not $out.Contains('Hello from ART on Windows') -or $out -notmatch 'gesher: boot image loaded') {
            throw ('Hello did not run on the boot image (exit 0x{0:X8})' -f $code)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: boot-image/
  test:
    needs: [fixtures, framework, translator, host, boot-image]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Actual shared strict archive negatives on this Windows host
        shell: pwsh
        run: |
          python tools/binder/verify-helper-source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/test-verified-artifact.py
      - name: Require exact current-run artifact identities
        id: suppliers
        shell: pwsh
        run: tools/binder/verify-component-suppliers.ps1 -Stage Runtime
      - name: Verify exact windows_x64 archive before extraction
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.windows_x64 }}" --digest "${{ steps.suppliers.outputs.windows_x64_digest }}" --destination current-host
      - name: Verify exact framework archive before extraction
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.framework }}" --digest "${{ steps.suppliers.outputs.framework_digest }}" --destination suppliers/framework
      - name: Verify exact arm64 archive before extraction
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.arm64 }}" --digest "${{ steps.suppliers.outputs.arm64_digest }}" --destination suppliers/arm64
      - name: Verify exact boot_image archive before extraction
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.boot_image }}" --digest "${{ steps.suppliers.outputs.boot_image_digest }}" --destination boot-image
      - name: Verify exact binder2_sg_modes archive before extraction
        shell: pwsh
        run: python tools/surface/download-verified-artifact.py --id "${{ steps.suppliers.outputs.binder2_sg_modes }}" --digest "${{ steps.suppliers.outputs.binder2_sg_modes_digest }}" --destination fixtures
      - name: Verify whole current host payload and actual configured compiler
        shell: pwsh
        run: |
          $manifest = Get-Content current-host/binder-output-host-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source -cne $env:GITHUB_SHA -or $manifest.run -cne $env:GITHUB_RUN_ID -or
              $manifest.attempt -cne $env:GITHUB_RUN_ATTEMPT -or $manifest.repository -cne $env:GITHUB_REPOSITORY -or
              $manifest.repository_id -cne $env:GITHUB_REPOSITORY_ID -or $manifest.head_repository_id -cne $env:GITHUB_REPOSITORY_ID) { throw 'Current host manifest identity mismatch' }
          if ($manifest.compiler.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $manifest.compiler.metadata_sha256 -cnotmatch '^[0-9a-f]{64}$' -or -not $manifest.compiler.configured_driver) { throw 'Missing actual configured compiler evidence' }
          Write-Host "ACTUAL_BINDER_OUTPUT_COMPILER $($manifest.compiler | ConvertTo-Json -Compress)"
          $hostRoot = [IO.Path]::GetFullPath('current-host') + [IO.Path]::DirectorySeparatorChar
          $expected = @($manifest.files.PSObject.Properties.Name)
          $actual = @(Get-ChildItem -LiteralPath current-host -Recurse -File | ForEach-Object { $_.FullName.Substring($hostRoot.Length).Replace('\','/') } | Where-Object { $_ -cne 'binder-output-host-manifest.json' })
          function Exact-HostInventory([string[]]$declared, [string[]]$found) {
            return $declared.Count -gt 0 -and @($declared | Select-Object -Unique).Count -eq $declared.Count -and
              @(Compare-Object $declared $found -CaseSensitive).Count -eq 0
          }
          if (-not (Exact-HostInventory @('a','b') @('a','b')) -or
              (Exact-HostInventory @('a','b') @('a')) -or (Exact-HostInventory @('a','b') @('a','b','extra'))) { throw 'Host manifest negative controls failed' }
          Write-Host 'ACTUAL_BINDER_HOST_NEGATIVES missing/extra=rejected'
          if (-not (Exact-HostInventory $expected $actual)) { throw 'Current host payload missing or extra files' }
          foreach ($entry in $manifest.files.PSObject.Properties) {
            $path = [IO.Path]::GetFullPath((Join-Path $hostRoot $entry.Name))
            if (-not $path.StartsWith($hostRoot, [StringComparison]::OrdinalIgnoreCase) -or
                $entry.Value -cnotmatch '^[0-9a-f]{64}$' -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.Value) { throw "Current host payload mismatch $($entry.Name)" }
            Write-Host "ACTUAL_BINDER_OUTPUT_HOST_MEMBER name=$($entry.Name) sha256=$($entry.Value) source=$env:GITHUB_SHA run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          }
          python tools/surface/assemble-artifacts.py --source current-host --destination dist --ledger runtime-owners.json --owner binder_host --exclude binder-output-host-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source suppliers/framework --destination dist --ledger runtime-owners.json --owner binder_framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/surface/assemble-artifacts.py --source suppliers/arm64 --destination dist --ledger runtime-owners.json --owner binder_arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage actual same-source root and check every consumed image copy
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'gesher-sg-runtime'
          foreach ($folder in 'system/framework/x86_64','system/fonts','system/etc','art','data','i18n/etc/icu','tzdata') {
            New-Item -ItemType Directory -Force (Join-Path $root $folder) | Out-Null
          }
          Copy-Item dist/icudt*l.dat (Join-Path $root 'i18n/etc/icu')
          Copy-Item dist/framework-res.apk (Join-Path $root 'system/framework')
          Copy-Item dist/build.prop (Join-Path $root 'system')
          Copy-Item dist/fonts/*.ttf (Join-Path $root 'system/fonts')
          Copy-Item dist/fonts/fonts.xml (Join-Path $root 'system/etc')
          Copy-Item -Recurse -Force dist/tzdata/* (Join-Path $root 'tzdata')
          Copy-Item boot-image/framework/x86_64/* (Join-Path $root 'system/framework/x86_64')
          foreach ($jar in 'core-oj','core-libart','core-icu4j','framework','gesher-app') {
            Write-Host "ACTUAL_SG_JAR member=$jar.jar sha256=$((Get-FileHash "dist/$jar.jar" -Algorithm SHA256).Hash) source=${{ github.sha }}"
          }
          foreach ($image in 'boot','boot-core-libart','boot-core-icu4j','boot-framework','boot-gesher-app') {
            foreach ($extension in 'art','oat','vdex') {
              $member = "$image.$extension"
              $produced = (Get-FileHash "boot-image/framework/x86_64/$member" -Algorithm SHA256).Hash
              $consumed = (Get-FileHash "$root/system/framework/x86_64/$member" -Algorithm SHA256).Hash
              if ($produced -cne $consumed) { throw "SG image copy identity mismatch $member" }
              Write-Host "ACTUAL_SG_IMAGE member=$member sha256=$consumed current-source-rebuilt-copy-identical=True"
            }
          }
          if ((Get-Content dist/binder-sg-runtime-source.txt -Raw).Trim() -cne '${{ github.sha }}') {
            throw 'SG selected runtime source marker mismatch'
          }
          Write-Host "ACTUAL_SG_TRANSLATOR sha256=$((Get-FileHash dist/gesher_arm64.dll -Algorithm SHA256).Hash) source=${{ github.sha }}"
      - name: Actual independent ordinary host, both ELF/ART and single/device APK modes
        shell: pwsh
        run: |
          & tests/binder/run-modes.ps1 -Dir "$PWD/dist" -Fixtures "$PWD/fixtures" `
            -RuntimeRoot "$env:RUNNER_TEMP/gesher-sg-runtime" -Source '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual mode and device logs inside CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binder2-sg-mode-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/gesher-sg-modes-*/**
          if-no-files-found: warn

