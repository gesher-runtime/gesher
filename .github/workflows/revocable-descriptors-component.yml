name: revocable-descriptors-component
on:
  push:
    branches: [palmoni5/qa-pr118-revocable-c313c363]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revocable-descriptors-component-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_TAG: '20261006'
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: ~/toolchain
          key: ${{ env.LLVM_MINGW_NAME }}
      - name: Fetch the repository's pinned compiler
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchain"
          curl --fail --location --retry 3 --max-time 240 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" \
            --output "$RUNNER_TEMP/llvm-mingw.tar.xz"
          sha256sum "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$HOME/toolchain"
      - name: Fetch the two pinned AOSP component inputs
        run: python3 tools/revocable-component/prepare-inputs.py component-inputs
      - name: Build the actual POSIX and Binder implementation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S tools/revocable-component -B component-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-llvm-mingw.cmake" \
            -DLLVM_MINGW="$HOME/toolchain/$LLVM_MINGW_NAME" \
            -DAOSP_DIR="$PWD/component-inputs"
          timeout 600s cmake --build component-build --parallel 4
          python3 tools/revocable-component/artifact.py --build component-build \
            --inputs component-inputs --toolchain "$HOME/toolchain/$LLVM_MINGW_NAME" --output fixture
      - uses: actions/upload-artifact@v4
        with:
          name: revocable-${{ github.sha }}-a${{ github.run_attempt }}
          path: fixture/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: revocable-${{ github.sha }}-a${{ github.run_attempt }}
          path: fixture
      - name: Run owned native and Binder contract fixtures
        shell: pwsh
        run: tools/revocable-component/run.ps1 -Dir fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revocable-logs-${{ matrix.os }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: component-logs/
          if-no-files-found: error
          retention-days: 14
