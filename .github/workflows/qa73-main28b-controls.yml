name: qa73-main28b-controls
on:
  push:
    branches: ['qa/diagnostic-pr73-main28b-controls-20261120']
    paths:
      - '.github/workflows/qa73-main28b-controls.yml'
      - 'tools/qa73-main28b-controls/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: qa73-main28b-controls-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source history and pinned production compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa73-main28b-controls/diagnostic.py source-proof
          mkdir -p "$RUNNER_TEMP/qa73-main-toolchain"
          curl --fail --location --connect-timeout 20 --max-time 180 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW_NAME.tar.xz" \
            -o "$RUNNER_TEMP/qa73-main-toolchain/compiler.tar.xz"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$RUNNER_TEMP/qa73-main-toolchain/compiler.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/qa73-main-toolchain/compiler.tar.xz" -C "$RUNNER_TEMP/qa73-main-toolchain"
          python3 tools/pipe-component/prepare-inputs.py "$RUNNER_TEMP/qa73-main-aosp"
      - name: Build old and fixed production with identical complete assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa73-main28b-controls/diagnostic.py build \
            --work "$RUNNER_TEMP/qa73-main-build" --inputs "$RUNNER_TEMP/qa73-main-aosp" \
            --toolchain "$RUNNER_TEMP/qa73-main-toolchain/$LLVM_MINGW_NAME"
          python3 tools/qa73-main28b-controls/diagnostic.py package \
            --work "$RUNNER_TEMP/qa73-main-build" --inputs "$RUNNER_TEMP/qa73-main-aosp" \
            --toolchain "$RUNNER_TEMP/qa73-main-toolchain/$LLVM_MINGW_NAME" \
            --archive "$RUNNER_TEMP/qa73-main-toolchain/compiler.tar.xz" \
            --out "$RUNNER_TEMP/qa73-main-controls"
      - uses: actions/upload-artifact@v4
        with:
          name: qa73-main-controls-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa73-main-controls/
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current producer, source and binary bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/artifact_receipt.py --name "qa73-main-controls-$env:GITHUB_SHA-a$env:GITHUB_RUN_ATTEMPT" --producer build --destination qa73-main-controls
          if ($LASTEXITCODE -ne 0) { throw 'Current producer/archive verification failed' }
          python tools/qa73-main28b-controls/diagnostic.py verify --out qa73-main-controls
          if ($LASTEXITCODE -ne 0) { throw 'Current source/output verification failed' }
      - name: Run old and fixed real native contracts and empty-stdio observations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/qa73-main28b-controls/diagnostic.py run --out qa73-main-controls
          if ($LASTEXITCODE -ne 0) { throw 'Native control or observation failed; preserve all results' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa73-main-results-${{ matrix.os }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: qa73-main-controls/results/
          if-no-files-found: error
          retention-days: 7
