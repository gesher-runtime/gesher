name: Independent Windows network QA

on:
  push:
    branches: [palmoni5/qa-native-diagnostics-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            msvc_arch: x64
            target_arch: x64
            contract: server
          - os: windows-2025
            msvc_arch: x64
            target_arch: x64
            contract: server
          - os: windows-11-arm
            msvc_arch: amd64_arm64
            target_arch: arm64
            contract: client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed network checkpoint
        uses: actions/checkout@v4
        with:
          ref: 300a60a87e612ebe365bb275c833ad5b31e28eef
          path: network
          persist-credentials: false
      - name: Verify the source revision
        shell: pwsh
        run: |
          $networkRevision = git -C network rev-parse HEAD
          Write-Host "Network source: $networkRevision"
          if ($networkRevision -ne '300a60a87e612ebe365bb275c833ad5b31e28eef') { throw 'Unexpected network source' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Verify the native compiler target
        shell: pwsh
        run: |
          Write-Host "Compiler target: $env:VSCMD_ARG_TGT_ARCH; runner: $env:RUNNER_ARCH"
          if ($env:VSCMD_ARG_TGT_ARCH -ne '${{ matrix.target_arch }}') { throw 'Unexpected compiler target' }
      - name: Compile the production cost classification contracts
        id: policy_build
        working-directory: network
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX tests\metered-network\cost_policy_test.cc /Fe:cost-policy-test.exe
      - name: Verify unknown, unrestricted, and metered cost transitions
        if: ${{ !cancelled() && steps.policy_build.outcome == 'success' }}
        working-directory: network
        shell: pwsh
        run: |
          & .\cost-policy-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Production network cost classification failed' }
      - name: Compile the unchanged strict client subscription contract
        id: client_build
        if: ${{ !cancelled() && matrix.contract == 'client' }}
        working-directory: network
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /DNOGDI /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 compat\net\cost_events_win.cc tests\metered-network\cost_events_windows_test.cc /Fe:cost-events-test.exe ole32.lib uuid.lib
      - name: Require real client subscription and unsubscription
        if: ${{ !cancelled() && matrix.contract == 'client' && steps.client_build.outcome == 'success' }}
        working-directory: network
        shell: pwsh
        run: |
          & .\cost-events-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows client network cost subscription failed' }
      - name: Compile the independent Server capability and lifecycle contract
        id: server_build
        if: ${{ !cancelled() && matrix.contract == 'server' }}
        working-directory: network
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /DNOGDI /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 compat\net\cost_events_win.cc tests\metered-network\cost_events_server_test.cc /Fe:cost-events-server-test.exe ole32.lib uuid.lib
      - name: Verify actual Server support and reclaim failed-start resources
        if: ${{ !cancelled() && matrix.contract == 'server' && steps.server_build.outcome == 'success' }}
        working-directory: network
        shell: pwsh
        run: |
          & .\cost-events-server-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Server network cost capability or lifecycle failed' }
