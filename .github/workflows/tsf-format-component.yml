name: tsf-format-component
on:
  workflow_call:
  push:
    branches: [wip/tsf-format-current]
    paths: [.github/workflows/tsf-format-component.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tsf-format-component-${{ github.ref }}
  cancel-in-progress: false
env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Adversarial archive controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native3-locks/artifact/test-verified-artifact.py
  controller:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Qualify owned job and file controller with kernel evidence
        shell: pwsh
        run: tools/windows4/test-tsf-job-supervisor.ps1
  compile:
    needs: [preflight, controller]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: tsf-format-component
      - name: Build the existing TSF target and capture provenance
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B out -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C out windows4_text_store_probe
          mkdir fixture
          cp out/windows4_text_store_probe.exe out/windows4_tsf_service.dll fixture/
          for f in windows4_text_store_probe.exe windows4_tsf_service.dll; do
            "$HOME/toolchain/$LLVM_MINGW_NAME/bin/llvm-readobj" --coff-imports "fixture/$f" > "fixture/$f.imports.txt"
          done
          python3 tools/windows4/tsf-component-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: tsf-format-${{ github.sha }}-a${{ github.run_attempt }}
          path: fixture/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify producer and run the current controlled fixture
        shell: pwsh
        run: |
          if ('${{ github.workflow }}' -eq 'tsf-format-component') { tools/windows4/run-tsf-component.ps1 }
          else { tools/windows4/run-tsf-union.ps1 }
