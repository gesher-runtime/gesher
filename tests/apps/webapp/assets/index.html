<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html, body { margin: 0; height: 100%; background: #00ff00; }</style>
<script src="app.js"></script>
</head>
<body>
<script>
  // window.GesherTest is WebActivity.Bridge (addJavascriptInterface).
  var sum = GesherTest.add(2, 3);
  GesherTest.report('sum ' + sum + ', ' + GesherTest.greet('WebView'));
  GesherTest.report(typeof GesherTest.secret === 'undefined' ? 'secret hidden' : 'secret visible');
  console.log('console from the page');
  alert('hello from the page');
  document.title = 'Gesher WebView test';
  // WebViewClient.shouldInterceptRequest answers this (with CORS headers).
  fetch('https://intercepted.example/data.json')
      .then(function (r) { return r.json(); })
      .then(function (j) { GesherTest.report('intercepted ' + j.value); })
      .catch(function (e) { GesherTest.report('intercept failed ' + e); });
  // WebViewClient.shouldOverrideUrlLoading takes this one (the page stays).
  window.addEventListener('load', function () {
    setTimeout(function () { location.href = 'https://gesher.invalid/blocked'; }, 200);
  });
</script>
</body>
</html>
